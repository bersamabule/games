<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Creature Maker</title>
<link rel="icon" href="icon.png">
<style>
  :root { --ink: #24345a; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  [hidden] { display: none !important; }

  button { font: inherit; font-weight: bold; font-size: clamp(20px, 3vw, 28px); min-height: 56px; padding: 6px 26px;
    border: 0; border-radius: 20px; cursor: pointer; color: #fff; background: #3f8cff; box-shadow: 0 5px 0 #2159b8; touch-action: manipulation; }

  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  button.main { background: #ff9a2e; box-shadow: 0 5px 0 #c26500; }
  button.main:active { box-shadow: 0 2px 0 #c26500; }
  button.green { background: #2fbf71; box-shadow: 0 5px 0 #1b8a4e; }
  button.sel { background: #ff9a2e; box-shadow: 0 5px 0 #c26500; }

  #title { position: fixed; left: 12px; right: 12px; top: max(16px, env(safe-area-inset-top)); text-align: center; pointer-events: none; }
  h1 { margin: 0; font-size: clamp(38px, 9vw, 96px); color: #fff; letter-spacing: 1px;
    text-shadow: 0 4px 0 #3f8cff, 0 8px 0 #2159b8, 0 14px 26px rgba(20, 40, 90, .35); }
  #nogl { margin-top: 10px; font-size: 20px; color: #8a1d1d; }
  .bottom { position: fixed; left: 16px; right: 16px; bottom: max(26px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }

  button.danger { background: #e5484d; color: #fff; }
  #bWipe { font-size: 18px; min-height: 44px; }
  #wipeMsg { font-size: 20px; max-width: 460px; margin: 0 auto; }
  #menu button.main { font-size: clamp(26px, 4vw, 40px); min-height: 72px; padding: 6px 48px; }

  .panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); box-sizing: border-box; max-width: calc(100% - 28px);
    max-height: calc(100% - 28px); overflow: auto; padding: 18px 26px 24px; text-align: center; background: rgba(255, 255, 255, .94);
    border: 4px solid #fff; border-radius: 28px; box-shadow: 0 10px 40px rgba(20, 40, 90, .35); }
  .panel h2 { margin: 0 0 10px; font-size: clamp(24px, 4vw, 38px); }
  .panel .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 12px 0; align-items: center; }
  .panel .lab { font-size: 22px; font-weight: bold; min-width: 120px; }

  #win { top: auto; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 12px 22px 16px; }
  #win h2 { font-size: clamp(22px, 3.4vw, 34px); }
  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; }

  #sizebar { position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); width: min(520px, calc(100% - 220px)); }
  #track { margin: 0 20px; position: relative; height: 22px; border-radius: 14px; background: rgba(255,255,255,.75); box-shadow: inset 0 2px 4px rgba(0,0,0,.2); }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 14px; background: linear-gradient(90deg, #7be0a8, #ffd34d, #ff8a4d); width: 0; }
  #marker { position: absolute; top: -9px; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; border: 3px solid #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,.35); background: #5fe0b0; }
  #marker i { position: absolute; top: 12px; width: 9px; height: 11px; border-radius: 50%; background: #fff; border: 2px solid #24345a; box-sizing: border-box; }
  #marker i:nth-child(1) { left: 7px; } #marker i:nth-child(2) { right: 7px; }
  #ticks { position: absolute; left: 20px; right: 20px; top: 26px; height: 24px; }

  #stageName { margin-top: 30px; font-size: clamp(22px, 3vw, 30px); font-weight: bold; color: #fff; text-shadow: 0 2px 0 #2159b8, 0 3px 8px rgba(0,0,0,.3); }
  #tools { position: absolute; right: max(14px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); display: flex; gap: 10px; }
  button.round { min-height: 60px; width: 60px; padding: 0; border-radius: 50%; font-size: 30px; line-height: 1; }
  button.glow { animation: glow 0.9s ease-in-out infinite alternate; background: #ff9a2e; box-shadow: 0 5px 0 #c26500; }
  @keyframes glow { from { box-shadow: 0 5px 0 #c26500, 0 0 0 0 rgba(255,220,80,.9); transform: scale(1); } to { box-shadow: 0 5px 0 #c26500, 0 0 0 18px rgba(255,220,80,0); transform: scale(1.14); } }
  #bFlap { position: absolute; right: max(22px, env(safe-area-inset-right)); bottom: max(26px, env(safe-area-inset-bottom)); width: 96px; height: 96px; min-height: 96px; font-size: 46px; border-radius: 50%; padding: 0; }
  #hint { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(640px, calc(100% - 280px)); text-align: center;
    font-size: 20px; font-weight: bold; color: #fff; text-shadow: 0 2px 4px rgba(20,40,90,.8); pointer-events: none; transition: opacity 1s; }
  #mkLeft .part.wide { grid-column: 1 / -1; justify-content: center; } #mkLeft { overflow-x: hidden; }
  #bAttack { position: absolute; right: max(130px, calc(env(safe-area-inset-right) + 120px)); bottom: max(26px, env(safe-area-inset-bottom)); width: 96px; height: 96px; min-height: 96px; font-size: 46px; border-radius: 50%; padding: 0; background: #ff7a45; }
  .dmgpop { position: fixed; transform: translate(-50%, -50%); font-weight: bold; font-size: 44px; color: #fff; -webkit-text-stroke: 3px #e8402a; paint-order: stroke fill; pointer-events: none; animation: dmgup .9s ease-out forwards; }
  @keyframes dmgup { 0% { opacity: 1; transform: translate(-50%, -50%) scale(.6); } 20% { transform: translate(-50%, -80%) scale(1.3); } 100% { opacity: 0; transform: translate(-50%, -260%) scale(1); } }

  /* family buttons: nest, egg, snack, voice */
  #acts { position: absolute; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 10px; align-items: flex-end; }

  #raceBig.show { animation: bigpop 1s ease-out forwards; } @keyframes bigpop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } 70% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); } }
  #raceHud { position: absolute; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); font-size: 22px; font-weight: bold; color: #fff; background: rgba(36,52,90,.7); border-radius: 20px; padding: 6px 18px; white-space: nowrap; pointer-events: none; z-index: 5; }
  #raceArrow { position: fixed; pointer-events: none; font-size: 44px; color: #ffd23f; -webkit-text-stroke: 3px #fff; paint-order: stroke fill; z-index: 6; animation: apulse .6s ease-in-out infinite alternate; }
  .racetag { position: fixed; transform: translate(-50%, -100%); pointer-events: none; font-size: 18px; font-weight: bold; color: #24345a; background: rgba(255,255,255,.92); border-radius: 14px; padding: 2px 10px; white-space: nowrap; z-index: 4; }
  #trophyPop { position: fixed; left: 50%; top: 110px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; background: #fff; border: 5px solid #ffc83a; border-radius: 26px; padding: 10px 26px; font-size: 24px; font-weight: bold; color: #24345a; box-shadow: 0 8px 30px rgba(0,0,0,.35); z-index: 25; text-align: left; pointer-events: none; }
  #trophyPop span { font-size: 60px; } #trophyPop.show { animation: tpop .5s cubic-bezier(.3,1.6,.5,1); } @keyframes tpop { from { transform: translateX(-50%) scale(.3); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  #trophies { z-index: 40; width: min(760px, calc(100% - 28px)); } #trophyCount { font-size: 22px; font-weight: bold; color: #24345a; margin-bottom: 8px; }

  .tile span { font-size: 40px; line-height: 1.1; } .tile b { font-size: 17px; } .tile i { font-size: 13px; font-style: normal; opacity: .85; }
  .tile.locked { background: #e6e9ef; border-color: #c4cad6; } .tile.locked span { filter: grayscale(1); opacity: .45; } .tile.locked b { color: #8a93a6; }
  #bMore { display: none; } #actRow { display: contents; }
  #nestArrow { position: fixed; pointer-events: none; font-size: 38px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); animation: apulse .9s ease-in-out infinite alternate; }
  #voices { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; align-items: center; } #voices span { display: none; }
  #voices button { min-height: 52px; padding: 0; font-size: 28px; } #voices button.sel { background: #ff9a2e; box-shadow: 0 5px 0 #c26500; }
  #bMoon.home { background: #2fbf71; box-shadow: 0 5px 0 #1b8a4e; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .35s ease-in; }
  #flash.on { opacity: 1; } #flash.slow { transition: opacity .9s ease-out; }
  #hearts { position: absolute; left: 0; top: 96px; display: flex; gap: 2px; font-size: clamp(22px, 3.4vw, 30px); filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); }
  #hearts span.half { opacity: .55; } #hearts span.empty { opacity: .25; filter: grayscale(1); }
  #hearts.flash { animation: hflash .3s steps(2) infinite; } @keyframes hflash { 50% { opacity: .3; } }
  #pauseStats { text-align: center; font-size: 22px; font-weight: bold; color: #24345a; margin: 4px 0 10px; line-height: 1.5; }
  #tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .btag { position: absolute; transform: translate(-50%, -100%); text-align: center; color: #fff; font-weight: bold; font-size: 20px; text-shadow: 0 2px 0 #2159b8, 0 2px 6px rgba(0,0,0,.4); white-space: nowrap; }
  .btag .bar { width: 110px; height: 12px; margin: 3px auto 0; border-radius: 8px; background: rgba(0,0,0,.35); overflow: hidden; border: 2px solid #fff; box-sizing: content-box; }
  .btag .bar i { display: block; height: 100%; background: #ff5a6a; transition: width .25s; }
  #bubble { position: fixed; transform: translate(-50%, -100%); max-width: min(300px, 80vw); background: #fff; color: #24345a; border-radius: 18px; padding: 10px 14px; font-size: 19px; line-height: 1.25; box-shadow: 0 5px 0 rgba(0,0,0,.18), 0 8px 24px rgba(0,0,0,.2); pointer-events: none; text-align: center; }
  #bubble b { display: block; color: #e8780a; font-size: 17px; margin-bottom: 2px; }
  #bubble::after { content: ''; position: absolute; left: 50%; bottom: -10px; margin-left: -10px; border: 10px solid transparent; border-top-color: #fff; border-bottom: 0; }
  #bossArrow { position: fixed; pointer-events: none; font-size: 44px; color: #ff5a6a; text-shadow: 0 0 0 #fff, 0 3px 6px rgba(0,0,0,.4); -webkit-text-stroke: 3px #fff; paint-order: stroke fill; animation: apulse .8s ease-in-out infinite alternate; }
  @keyframes apulse { to { font-size: 52px; } }
  #banner { position: fixed; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none; font-size: clamp(44px, 10vw, 110px); font-weight: bold; color: #fff;
    text-shadow: 0 5px 0 #ff9a2e, 0 10px 0 #c26500, 0 16px 30px rgba(0,0,0,.35); opacity: 0; transform: scale(.4); }
  #banner.show { animation: banner 2.8s ease-out forwards; }
  @keyframes banner { 0% { opacity: 0; transform: scale(.4); } 12% { opacity: 1; transform: scale(1.12); } 22% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05) translateY(-20px); } }
  #toast { position: fixed; left: 50%; top: 150px; transform: translateX(-50%); max-width: min(620px, calc(100% - 40px)); box-sizing: border-box; padding: 14px 22px; text-align: center;
    background: rgba(255,255,255,.95); border-radius: 22px; font-size: clamp(18px, 2.6vw, 26px); font-weight: bold; box-shadow: 0 6px 24px rgba(20,40,90,.35); pointer-events: none; }
  .plus { position: fixed; pointer-events: none; font-weight: bold; font-size: 44px; color: #fff; -webkit-text-stroke: 2px #24345a; text-shadow: 0 3px 6px rgba(0,0,0,.3); animation: plus .9s ease-out forwards; transform: translate(-50%, -50%); }
  @keyframes plus { 0% { opacity: 0; margin-top: 0; scale: .5; } 15% { opacity: 1; scale: 1.2; } 100% { opacity: 0; margin-top: -90px; scale: 1; } }

  /* Creature Maker panel */
  #maker { position: fixed; inset: 0; pointer-events: none; display: grid; grid-template-columns: minmax(230px, 1fr) minmax(0, 1fr) minmax(250px, 1fr); align-items: center; padding: 12px; box-sizing: border-box; }
  #maker .col { pointer-events: auto; background: rgba(255,255,255,.9); border-radius: 26px; padding: 14px 16px; box-shadow: 0 8px 30px rgba(20,40,90,.3); max-height: calc(100% - 100px); overflow: auto; }
  #mkLeft { grid-column: 1; } #mkRight { grid-column: 3; }
  .part { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0; }
  .part .ico { font-size: 40px; width: 52px; text-align: center; }
  .part button { min-height: 64px; width: 64px; padding: 0; font-size: 40px; border-radius: 50%; line-height: 1; }
  .part b { font-size: 40px; min-width: 40px; text-align: center; }
  #swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 8px 0; }
  #swatches button { min-height: 44px; height: 44px; width: 100%; padding: 0; border-radius: 14px; border: 3px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  input[type=range] { width: 100%; height: 30px; margin: 6px 0; -webkit-appearance: none; appearance: none; border-radius: 15px; border: 3px solid #fff; box-sizing: border-box; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 4px solid #24345a; }
  input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 4px solid #24345a; }
  #hue { background: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  #lit { background: linear-gradient(90deg, #111, #888, #fff); }
  #pats { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
  #pats button { min-height: 60px; flex: 1; padding: 0; font-size: 32px; }
  #mkTabs { display: none; pointer-events: auto; position: absolute; left: 50%; top: max(10px, env(safe-area-inset-top)); transform: translateX(-50%); gap: 10px; }
  #mkTabs button { min-height: 50px; width: 70px; padding: 0; font-size: 28px; }
  #shellSw { display: flex; align-items: center; gap: 5px; margin: 6px 0; } #shellSw span { font-size: 28px; width: 34px; }
  #shellSw button { min-height: 34px; height: 34px; flex: 1; padding: 0; border-radius: 10px; border: 3px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  #shellSw button.on { border-color: #24345a; }
  .compactmk #mkTabs { display: flex; }
  #mkDone { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); pointer-events: auto; font-size: 32px; min-height: 70px; padding: 6px 54px; }
  #mkDone:active { transform: translateX(-50%) translateY(3px); }

  @media (max-aspect-ratio: 1/1), (max-height: 520px) {
    #maker[data-tab=parts] #mkRight { display: none; } #maker[data-tab=colors] #mkLeft { display: none; }
  }
  #stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; pointer-events: none; background: rgba(255,255,255,.28); border: 3px solid rgba(255,255,255,.7); }
  #knob { position: absolute; left: 36px; top: 36px; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 2px 6px rgba(0,0,0,.3); }

  /* phones, upright */
  @media (max-aspect-ratio: 1/1) {
    #maker { grid-template-columns: 1fr; align-items: end; padding-bottom: 86px; gap: 8px; }
    #mkLeft, #mkRight { max-height: none; padding: 8px 8px; border-radius: 20px; grid-column: 1; }
    #mkLeft { display: grid; grid-template-columns: 1fr 1fr; gap: 0 4px; }
    .part { margin: 2px 0; gap: 4px; } .part .ico { font-size: 26px; width: 30px; } .part b { font-size: 26px; min-width: 20px; }
    .part button { min-height: 44px; width: 44px; font-size: 28px; }
    #swatches { grid-template-columns: repeat(4, 1fr); gap: 6px; } #swatches button { min-height: 34px; height: 34px; border-radius: 10px; }
    input[type=range] { height: 26px; margin: 4px 0; }
    #pats button { min-height: 44px; font-size: 26px; }
    #mkDone { min-height: 54px; font-size: 26px; padding: 4px 30px; white-space: nowrap; }
    #sizebar { top: calc(max(12px, env(safe-area-inset-top)) + 66px); width: calc(100% - 28px); }
    #stageName { margin-top: 28px; }
    button.round { min-height: 50px; width: 50px; font-size: 24px; }
    #tools { gap: 6px; }
    #hint { left: 14px; transform: none; text-align: left; width: calc(100% - 140px); font-size: 17px; }
    #toast { top: 190px; }
    #dayIco { font-size: 28px; line-height: 50px; }
    #bMoon { right: auto; left: 14px; top: auto; bottom: 86px; font-size: 18px; }
    #raceHud { top: auto; bottom: 96px; left: 14px; transform: none; font-size: 17px; } #trophyPop { font-size: 19px; padding: 8px 16px; white-space: nowrap; } #trophyPop span { font-size: 44px; }
    #acts { left: auto; right: max(34px, calc(env(safe-area-inset-right) + 28px)); bottom: 150px; flex-direction: row-reverse; }
    #bMore { display: block; } #actRow { display: none; gap: 8px; flex-direction: row-reverse; } #acts.open #actRow { display: flex; }
    #acts button.round { min-height: 50px; width: 50px; font-size: 24px; }
    #voices button { min-height: 44px; font-size: 24px; }
  }
  /* phones, sideways */
  @media (max-height: 520px) and (min-aspect-ratio: 1/1) {
    #maker { grid-template-columns: minmax(200px, 1fr) minmax(0, 1fr) minmax(210px, 1fr); }
    #mkLeft { display: block; padding: 4px 8px; margin-top: 56px; }
    .part { margin: 1px 0; } .part .ico { font-size: 28px; width: 34px; } .part b { font-size: 28px; min-width: 26px; }
    .part button { min-height: 36px; width: 36px; font-size: 24px; } .part .ico { font-size: 24px; width: 30px; } .part b { font-size: 24px; }
    #mkRight { margin-top: 56px; }
    #swatches button { min-height: 34px; height: 34px; } #pats button { min-height: 46px; font-size: 26px; }
    #maker .col { padding: 8px 10px; max-height: calc(100% - 90px); }
    #mkDone { min-height: 56px; font-size: 26px; padding: 4px 36px; }
    h1 { font-size: 40px; } #menu button.main { min-height: 56px; font-size: 26px; }
    .bottom { bottom: 14px; }
    button { min-height: 48px; }
    #hint { display: none; }
    #bFlap { width: 80px; height: 80px; min-height: 80px; font-size: 38px; }
    #acts { bottom: 124px; }
    .tile i { font-size: 12px; } .tile span { font-size: 34px; }
    #dayIco { font-size: 26px; line-height: 50px; }
    #sizebar { width: min(520px, calc(100% - 262px)); }
    #bMoon { top: calc(max(12px, env(safe-area-inset-top)) + 62px); min-height: 40px; font-size: 17px; padding: 2px 14px; }

<script>
'use strict';
// =====================================================================================
//  Creature Maker: start as a tiny blob in a pond, eat, grow, give yourself legs, eyes
//  and wings, and grow until you are a GIANT.
// =====================================================================================

// ---------- Tuning (all the numbers you may want to change) ----------
const SIZE_START = 0.2;          // metres across, the tiny blob
const SIZE_WIN = 40;             // reaching this wins
const SIZE_CAP = 60;             // never bigger than this
const STAGES = [['Tiny', '💧', 0.2], ['Small', '🌱', 0.5], ['Medium', '🍎', 1.4], ['Big', '🌳', 4], ['Huge', '⛰️', 10], ['GIANT', '🏆', 25]];
const EDIBLE_RATIO = 0.9;        // food must be thinner than this share of your size
const GROW_K = 0.03;              // how much each bite grows you (in log size)
const GROW_EXP = 0.6;            // bigger food (compared with you) gives more
const GROW_SMOOTH = 3.0;         // how quickly the size catches up with the growth
const POND_CAP = 0.9;            // without legs or wings you stop growing here (pond too small)
const SPEED_LEN = 4.2;           // body lengths per second
const LEG_SPEED_BONUS = 0.14;    // extra speed for every pair of legs
const SWIM_K = 0.8, LANDROLL_K = 0.45, FLY_SPEED_K = 1.25;
const ACCEL = 7;
const GRAV_LEN = 22;             // gravity in body lengths per second squared
const HOP_LEN = 7;               // little hop when you press Space without wings
const FLAP_UP = 9;               // upward speed of one flap, body lengths per second
const FLAP_INTERVAL = 0.3;       // seconds between flaps when Space is held
const WING_FLAP_BONUS = 0.18;    // stronger flaps for every extra pair of wings
const GLIDE_FALL = 3.2;          // slowest falling speed with wings
const FLY_MAX_LEN = 17;          // highest you can flap above the ground, in body lengths
const WORLD_LIMIT = 5200;
const POND_R = 18, POND_D = 1.8, ISLAND_R = 3200, HILL_AMP = 280, WATER_LEVEL = 0;
const RESPAWN_TIME = [22, 40];   // seconds before eaten food grows back
const RESPAWN_FAR_LEN = 26;      // grows back at least this many body lengths away (out of sight)
const EAT_ANIM = 0.22;
const CAM_DIST = 4.8, CAM_PITCH = 0.5;
const BOOM_FRUIT_TREES = 160;    // trees that carry fruit
const WIN_SWOOP_TIME = 5;
const COLOR_SWATCHES = [[0,.8,.58],[28,.95,.56],[50,.95,.6],[86,.7,.52],[135,.6,.5],[172,.65,.5],[200,.9,.64],[226,.8,.62],[268,.65,.64],[322,.85,.72],[0,0,.97],[24,.5,.4]];
const DEFAULT_LOOK = { eyes: 2, legs: 0, wings: 0, horns: 0, tail: 0, shell: 0, shellC: 0, weapon: 0, voice: 1, h: 168, s: .7, l: .64, pattern: 'plain' };
const SHELL_COLORS = [[30, .7, .45], [135, .5, .4], [350, .7, .55], [210, .7, .55], [280, .6, .55], [48, .9, .55]];
const MAX_HEARTS = 6, HIT_SAFE = 2, HEAL_PER_FOOD = 0.25;   // hearts, safe seconds after a hit, hearts per food
const FRIEND_REL = 0.9, FRIEND_SNACK = 0.05, FRIEND_TALK_GAP = 4.5;   // friend size vs you, snack growth (log), seconds per joke
const BOSS_REL = 2, BOSS_BONK_GAP = 0.7, BOSS_PRIZE = 0.3, BOSS_SHOW = 14, BOSS_ARROW = 60;   // boss size vs you, prize growth (log)
const OLD_BOSS = { spitter: 'gloopo', stinger: 'buzzbert', smacker: 'floppo' };   // old saved boss ids
const HORN_BONK = 2;             // bonk strength with horns (1 without)

// ---- places: the volcano (id 'volcano'), under the sea (id 'sea'), the Moon (id 'moon'), and day and night ----
const PLACES = { volcano: { name: 'The Volcano', icon: '🌋' }, sea: { name: 'Under the sea', icon: '🐠' }, moon: { name: 'The Moon', icon: '🌙' } };
const DAY_SECONDS = 240, NIGHT_SECONDS = 120, DAY_CYCLE = DAY_SECONDS + NIGHT_SECONDS;   // a whole day, in seconds
const DAY_START = 0.06;          // a new game starts just after sunrise (0..1 of the cycle)
const MOON_SIZE = 25;            // GIANT: from this size you can jump to the Moon
const MOON_TRIP_UP = 2.6, MOON_TRIP_DOWN = 2.2, TRIP_LIFT = 2600;   // seconds of the fly-up and fly-down, height of the fly-up (metres)
const MOON_G = 0.17, MOON_JUMP_LEN = 7, MOON_R = 7000, MOON_GROW = 0.012;   // moon gravity (share of home gravity), jump speed (body lengths/s), size of the Moon, growth per bite
const LAVA_BOUNCE_LEN = 11, LAVA_GAP = 1.1;     // lava bounce speed (body lengths/s), seconds between bounces
const DIVE_LEN = 3, DIVE_IDLE = 4;              // comfortable swim depth (body lengths), seconds still before you float up
const WHALE_REL = 4.5, WHALE_COUNT = [1, 2, 3, 3], FISH_SCHOOLS = [3, 5, 7, 7], FISH_PER = [10, 14, 16, 16];   // whale length vs you; per quality
const LOB_TIME = 2.5, LOB_R = 1.35, LOB_COOL = 2.6, LOB_WIND = 1.1;   // Magmo: lava blob flight seconds, landing circle (x his size), seconds between lobs, wind-up
// a shell blocks every other hit (clang!)
const TAIL_SWIM_BONUS = 0.3;     // a tail swims this much faster
const QUALITY = [
  { name: 'Low',    pr: 0.75, shadow: 0,    treeShadow: false, aa: false, decor: 0.35, rays: 0, fire: 0, bubbles: 14, bump: 1, fx: 0, env: 0, bloom: 0, ao: 0, fxScale: 1 },
  { name: 'Medium', pr: 1,    shadow: 1024, treeShadow: false, aa: true,  decor: 0.7, rays: 4, fire: 24, bubbles: 30, bump: 1, fx: 1, env: 64, bloom: 2, ao: 0, fxScale: 0.7 },
  { name: 'High',   pr: 1.25, shadow: 2048, treeShadow: true,  aa: true,  decor: 1, rays: 9, fire: 64, bubbles: 50, bump: 2, fx: 1, env: 128, bloom: 3, ao: 0, fxScale: 0.8 },
  { name: 'Ultra',  pr: 1.5,  shadow: 2048, treeShadow: true,  aa: true,  decor: 1, rays: 9, fire: 64, bubbles: 50, bump: 2, fx: 1, env: 128, bloom: 5, ao: 1, fxScale: 1 }
];

// ---------- Helpers ----------
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage may be blocked */ } }
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const H = {};
location.hash.slice(1).split(',').forEach(p => { if (!p) return; const i = p.indexOf('='); if (i < 0) H[p] = true; else H[p.slice(0, i)] = p.slice(i + 1); });

function hash2(ix, iz) { let h = Math.imul(ix, 374761393) + Math.imul(iz, 668265263) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
function vnoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
  return (a + (b - a) * u) + ((c + (d - c) * u) - (a + (b - a) * u)) * v;
}
function fbm(x, z, oct) {
  let s = 0, a = 0.5, f = 1, tot = 0;
  for (let o = 0; o < oct; o++) { s += a * vnoise(x * f + o * 17.3, z * f + o * 9.1); tot += a; a *= 0.5; f *= 2.03; }
  return s / tot;
}

// ---------- The land: a pond in the middle, a meadow, a forest, hills, and sea all round ----------
function coastR(ang) { return ISLAND_R * (1 + 0.32 * (vnoise(Math.cos(ang) * 1.7 + 40, Math.sin(ang) * 1.7 + 40) - 0.5)); }
function groundBase(x, z) {
  const r = Math.hypot(x, z);
  if (r > 44000) return -700;
  const u = r / POND_R;
  const near = u < 1 ? -POND_D * (1 - u * u) : 0.55 * smooth(POND_R, POND_R + 10, r);
  const cr = coastR(Math.atan2(z, x));
  const landMask = 1 - smooth(cr - 350, cr + 150, r);
  const meadow = 1.8 * smooth(60, 300, r) + (fbm(x / 70 + 11, z / 70 + 3, 3) - 0.47) * 2 * 3.2 * smooth(40, 260, r) + (fbm(x / 22, z / 22, 2) - 0.47) * 0.5 * smooth(25, 60, r);
  const hn = fbm(x / 520 + 5, z / 520 + 9, 4);
  const hills = Math.pow(Math.max(0, hn - 0.4) / 0.6, 1.3) * HILL_AMP * smooth(650, 1500, r) * smooth(cr - 100, cr - 900, r);
  const pondBlend = smooth(POND_R + 10, POND_R + 120, r);
  let h = near * (1 - pondBlend) + (0.55 + meadow + hills) * pondBlend;
  const seaH = Math.max(-700, -2 - (r - cr) * 0.02 - 420 * smooth(60, 1900, r - cr));   // a shelf near the shore, then deep water
  return lerp(seaH, h, landMask);
}

// ---------- the volcano: a cone with a crater, a lava lake and three lava rivers (id 'volcano') ----------
const VOLC = { ang: 5.6, dist: 1400, R: 560, H: 330, craterR: 68, craterDepth: 46 };
VOLC.x = Math.cos(VOLC.ang) * VOLC.dist; VOLC.z = Math.sin(VOLC.ang) * VOLC.dist;
VOLC.aM = Math.atan2(-VOLC.z, -VOLC.x);                      // the side that faces the pond: Magmo waits there
VOLC.rivers = [VOLC.aM + 1.05, VOLC.aM - 1.2, VOLC.aM + 2.55];
VOLC.mx = VOLC.x + Math.cos(VOLC.aM) * VOLC.R * 0.8; VOLC.mz = VOLC.z + Math.sin(VOLC.aM) * VOLC.R * 0.8;
VOLC.shelf = VOLC.H * Math.pow(1 - 0.8, 1.7);
VOLC.base = groundBase(VOLC.x, VOLC.z);
const VOLC_OUT2 = (VOLC.R * 1.2) * (VOLC.R * 1.2);
function volcRiverAngle(k, d) { return VOLC.rivers[k] + 0.22 * Math.sin(d * 0.012 + k * 2.1) + 0.12 * Math.sin(d * 0.031 + k); }
function lavaAmount(d, a) {      // 0..1: how much lava is here (the lake in the crater, then the rivers)
  const R = VOLC.R, cR = VOLC.craterR;
  if (d >= R * 0.93) return 0;
  if (d < cR * 0.72) return 1;
  let m = d < cR * 0.8 ? 1 - smooth(cR * 0.72, cR * 0.8, d) : 0;
  const half = lerp(22, 9, smooth(cR * 0.8, R * 0.9, d));
  for (let k = 0; k < 3; k++) {
    let da = a - volcRiverAngle(k, d); da = Math.atan2(Math.sin(da), Math.cos(da));
    m = Math.max(m, 1 - smooth(half * 0.75, half * 1.25, Math.abs(da) * d));
  }
  return m * (1 - smooth(R * 0.8, R * 0.93, d));
}
function volcNotch(d, a) {       // the rim is cut open where a river leaves the crater
  const cR = VOLC.craterR; if (d < cR * 0.7 || d > cR * 1.7) return 0; let m = 0;
  for (let k = 0; k < 3; k++) { let da = a - volcRiverAngle(k, d); da = Math.atan2(Math.sin(da), Math.cos(da)); m = Math.max(m, 1 - smooth(8, 20, Math.abs(da) * d)); }

}
function volcRise(x, z) {
  const dx = x - VOLC.x, dz = z - VOLC.z, d = Math.hypot(dx, dz), R = VOLC.R;
  if (d >= R) return 0;
  const a = Math.atan2(dz, dx), cR = VOLC.craterR, prof = r => VOLC.H * Math.pow(1 - r / R, 1.7);
  let h = d > cR ? prof(d) + 6 * Math.exp(-(((d - cR) / 9) ** 2)) : prof(cR) + 6 - VOLC.craterDepth * (1 - (d / cR) ** 2);
  const fade = smooth(cR * 0.5, cR * 1.3, d) * (1 - smooth(R * 0.7, R, d));
  h += (fbm(x / 60 + 31, z / 60 + 17, 3) - 0.5) * 26 * fade + (vnoise(Math.cos(a) * 3.2 + 9, Math.sin(a) * 3.2 + 4 + d * 0.01) - 0.5) * 20 * fade;
  h -= 2.6 * lavaAmount(d, a) * smooth(cR * 0.8, cR * 1.1, d) + 24 * volcNotch(d, a);
  const sd = Math.hypot(x - VOLC.mx, z - VOLC.mz);
  if (sd < 80) h = lerp(VOLC.shelf, h, smooth(40, 80, sd));   // a flat shelf where Magmo stands
  return h;
}
function volcLava(x, z) { const dx = x - VOLC.x, dz = z - VOLC.z; if (Math.abs(dx) > VOLC.R || Math.abs(dz) > VOLC.R) return 0; const d = Math.hypot(dx, dz); return d >= VOLC.R ? 0 : lavaAmount(d, Math.atan2(dz, dx)); }
function groundNoV(x, z) {       // the land without the volcano (the big ground mesh uses this one; the volcano has its own fine mesh)
  const g = groundBase(x, z), d = Math.hypot(x - VOLC.x, z - VOLC.z);
  return d > VOLC.R * 1.2 ? g : lerp(VOLC.base, g, smooth(VOLC.R * 0.5, VOLC.R * 1.2, d));
}
function groundH(x, z) {
  const dx = x - VOLC.x, dz = z - VOLC.z; if (dx * dx + dz * dz > VOLC_OUT2) return groundBase(x, z);
  return groundNoV(x, z) + volcRise(x, z);
}

// ---------- State ----------
const S = {
  screen: 'menu', t: 0, clock: 0,
  size: SIZE_START, target: SIZE_START, stageIdx: 0,
  x: 1.5, y: 0, z: 1, vx: 0, vz: 0, vy: 0, yaw: 0, camYaw: 0, camPitch: CAM_PITCH,
  grounded: true, inWater: true, legAmt: 0,
  look: Object.assign({}, DEFAULT_LOOK),
  won: false, winning: false, winT: 0, eaten: 0, played: 0,
  seenPond: false, flapTimer: 0, flapAnim: 0, mouthT: 0, chewT: 0, quality: 1, sound: true, bot: false,
  lookTarget: null, hintT: 0, blockedHintT: 0,
  hearts: MAX_HEARTS, invT: 0, kx: 0, kz: 0, bonkT: 0, friends: new Set(), bosses: new Set(),
  // places: where you are ('island' or 'moon'), time of day, swimming depth, the trip to the Moon
  place: 'island', day: DAY_START, dayLock: false, dive: 0, stillT: 0, lavaT: 0, underK: 0, spaceK: 0, tripLift: 0, trip: null, homeX: 0, homeZ: 0, visited: new Set(), trophies: new Set(), races: new Set(), apples: 0, wp: 0, nearRace: null, nest: null, eggs: [], nestT: 0, tameCool: 0, teamBonkT: 1, bonkI: 0, tameNear: null, nightK: 0, warmK: 0, seaNear: false, camDepthR: 0, seaGoal: null
};
let qIdx = parseInt(lsGet('creature-maker-quality'), 10);
if (!(qIdx >= 0 && qIdx <= 3)) qIdx = (window.matchMedia && matchMedia("(pointer: coarse)").matches) ? 0 : 1;   // nobody has picked yet: Medium, which is smooth on the family laptop; phones and tablets start on Low
if (H.quality !== undefined && +H.quality >= 0 && +H.quality <= 3) qIdx = +H.quality;
S.quality = qIdx;
S.sound = lsGet('creature-maker-sound') !== 'off';
const isTouch = !!H.touch || ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ---------- three.js setup ----------
let renderer;

  renderer = new THREE.WebGLRenderer({ canvas: $('game'), antialias: QUALITY[qIdx].aa, powerPreference: 'high-performance' });
} catch (e) { $('nogl').hidden = false; throw e; }
renderer.setClearColor(0x9fdcff);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 1800);
const horizonColor = new THREE.Color('#d4f0ff');
scene.fog = new THREE.Fog(horizonColor, 90, 760);
const hemi = new THREE.HemisphereLight(0xd8efff, 0x9fd27c, 1.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d2, 2.7);
sun.position.set(30, 48, 21);
