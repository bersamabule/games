<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Trampoline</title>
<link rel="icon" href="icon.png">
<style>
  @font-face { font-family: "Fredoka"; src: url("fonts/Fredoka.ttf") format("truetype");
               font-weight: 300 700; font-stretch: 75% 125%; font-display: swap; }

  :root {
    --ink: #2b2140;
    --play: #3ccf5a;
    --play-dark: #23a03f;
    --set: #4aa8ff;
    --set-dark: #2b7fd1;
    --panel: rgba(255, 255, 255, 0.94);
    --pick: #ffd23f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff;
               font-family: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
               color: var(--ink); user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* the 3D world fades in once it is ready (the first time, the computer needs a few seconds to get it ready) */
  #gl { opacity: 0; transition: opacity 0.8s; }
  #gl.on { opacity: 1; }
  .hidden { display: none !important; }

  /* ---------- Menu: only Play and Settings ---------- */
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
          padding-top: 4vh; pointer-events: none; }
  .title { margin: 0; font-size: min(15vh, 13vw); font-weight: 700; letter-spacing: 0.02em;
           line-height: 1; white-space: nowrap; }
  .title span { display: inline-block; animation: hop 1.1s ease-in-out infinite;
                -webkit-text-stroke: 0.035em #fff; paint-order: stroke fill;
                text-shadow: 0 0.06em 0 rgba(0,0,0,0.18); }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-0.18em); } }
  .btns { display: flex; gap: 4vw; margin-top: 4vh; pointer-events: auto; }
  .big { font: inherit; font-size: min(6.5vh, 7vw); font-weight: 700; color: #fff; border: 0;
         border-radius: 999px; padding: 0.35em 1.1em; cursor: pointer;
         box-shadow: 0 0.16em 0 var(--d), 0 0.3em 0.6em rgba(0,0,0,0.2);
         transition: transform 0.12s; text-shadow: 0 0.05em 0 rgba(0,0,0,0.25); }
  .big.sel { transform: scale(1.12); outline: 0.12em solid #fff; outline-offset: 0.08em; }
  .big:active { transform: scale(1.05) translateY(0.1em); }
  #bPlay { background: var(--play); --d: var(--play-dark); }
  #bSet  { background: var(--set);  --d: var(--set-dark); }
  /* not a button: it only shows once unlimited space is unlocked */
  #spaceBadge { margin-top: 3vh; font-size: min(3.6vh, 4.6vw); font-weight: 600; color: #fff;
                background: rgba(20, 16, 60, 0.6); border-radius: 999px; padding: 0.35em 0.9em;
                text-shadow: 0 0.06em 0 rgba(0,0,0,0.3); white-space: nowrap; text-align: center; }
  #spaceStats { font-size: 0.85em; color: #ffe14d; }
  #spaceStats:empty { display: none; }

  /* ---------- Settings ---------- */
  #settings { position: fixed; inset: 0; display: flex; align-items: center; padding-left: 4vw; }
  .panel { background: var(--panel); border-radius: 28px; padding: 3vh 2.6vw 3vh;
           width: min(560px, 50vw); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .panel h2 { margin: 0 0 2vh; font-size: min(6vh, 7vw); text-align: center; }
  .row { border-radius: 18px; padding: 1.2vh 1vw; margin-bottom: 1.4vh; border: 4px solid transparent; }
  .row.sel { border-color: var(--pick); background: #fff8d9; }
  .lab { font-size: min(3.4vh, 4.5vw); font-weight: 600; margin-bottom: 0.8vh; }
  .opts { display: flex; flex-wrap: wrap; gap: 0.8vw; }
  .opt { font: inherit; font-size: min(3.2vh, 4.2vw); font-weight: 600; border: 3px solid #d7d0e6;
         background: #fff; color: var(--ink); border-radius: 14px; padding: 0.3em 0.7em; cursor: pointer; }
  .opt.on { background: var(--pick); border-color: #e0a800; }
  #bBack { font: inherit; font-size: min(4vh, 5vw); font-weight: 700; width: 100%; cursor: pointer;
           background: #ff8a3d; color: #fff; border: 4px solid transparent; border-radius: 18px;
           padding: 0.3em; box-shadow: 0 5px 0 #d1621b; }
  #bBack.sel { border-color: var(--pick); }

  /* ---------- Playing ---------- */
  #bHome { position: fixed; left: 14px; top: 14px; font-size: 34px; width: 64px; height: 64px;
           border-radius: 50%; border: 0; background: rgba(255,255,255,0.85); cursor: pointer;
           box-shadow: 0 4px 0 rgba(0,0,0,0.15); }

  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .panel { max-height: 94vh; overflow-y: auto; }

  /* Phones held upright: buttons on top of each other, settings across the top */
  @media (max-aspect-ratio: 1/1) {
    #menu { padding-top: 7vh; }
    .btns { flex-direction: column; gap: 2.2vh; margin-top: 3vh; align-items: stretch; }
    .big { font-size: min(5vh, 8.5vw); }
    #settings { align-items: flex-start; padding: 2vh 3vw 0; }
    .panel { width: 100%; max-height: 60vh; padding: 2vh 4vw; }
    .panel h2 { font-size: min(4.5vh, 8vw); margin-bottom: 1.2vh; }
    .lab { font-size: min(2.6vh, 5vw); }
    .opt { font-size: min(2.5vh, 4.6vw); }
    .opts { gap: 2vw; }
    #bBack { font-size: min(3.2vh, 6vw); }
  }
  /* Phones held sideways: everything a bit bigger for fingers */
  @media (max-height: 500px) and (min-aspect-ratio: 1/1) {
    .panel { padding: 2vh 2vw; width: min(560px, 56vw); }
    .panel h2 { font-size: 7vh; margin-bottom: 1vh; }
    .row { padding: 0.8vh 1vw; margin-bottom: 1vh; }
    .lab { font-size: 4.4vh; margin-bottom: 0.4vh; }
    .opt { font-size: 4.3vh; padding: 0.25em 0.6em; }
    #bBack { font-size: 6vh; }
    #bHome { width: 52px; height: 52px; font-size: 28px; left: 10px; top: 10px; }
  }
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#5bb8f5"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Trampoline"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(e){console.warn('sw',e)})})}</script></head>
<body>
<canvas id="gl"></canvas>
<canvas id="c"></canvas>

<div id="menu">
  <h1 class="title" id="title"></h1>
  <div class="btns">
    <button class="big" id="bPlay">▶ Play</button>
    <button class="big" id="bSet">⚙️ Settings</button>
  </div>
  <div id="spaceBadge" class="hidden">🌌 Unlimited space unlocked!<div id="spaceStats"></div></div>
</div>

<div id="settings" class="hidden">
  <div class="panel">
    <h2>⚙️ Settings</h2>
    <div class="row" data-key="who">
      <div class="lab">Who bounces?</div>
      <div class="opts">
        <button class="opt" data-v="duck">🦆 Duck</button>
        <button class="opt" data-v="robot">🤖 Robot</button>
        <button class="opt" data-v="frog">🐸 Frog</button>
      </div>
    </div>
    <div class="row" data-key="color">
      <div class="lab">Trampoline colour</div>
      <div class="opts">
        <button class="opt" data-v="red">Red</button>
        <button class="opt" data-v="blue">Blue</button>
        <button class="opt" data-v="green">Green</button>
        <button class="opt" data-v="rainbow">🌈 Rainbow</button>
      </div>
    </div>
    <div class="row" data-key="sound">
      <div class="lab">Sound</div>
      <div class="opts">
        <button class="opt" data-v="on">🔊 On</button>
        <button class="opt" data-v="off">🔇 Off</button>
      </div>
    </div>
    <button id="bBack">⬅ Back</button>
  </div>
</div>

<button id="bHome" class="hidden" title="Back to the menu">🏠</button>

<!-- three.js r186 (MIT licence, lib/three-LICENSE.txt): draws the 3D world. It is in the game folder, so no internet is needed. -->
<script src="lib/three.js"></script>
<script>
"use strict";

// ================= Saved stuff (localStorage keys start with "trampoline") =================
const SAVE_SETTINGS = "trampoline-settings";
const SAVE_BEST = "trampoline-best";
const settings = { who: "duck", color: "red", sound: "on" };
try { Object.assign(settings, JSON.parse(localStorage.getItem(SAVE_SETTINGS) || "{}")); } catch (e) {}
let best = 0;
try { best = Number(localStorage.getItem(SAVE_BEST)) || 0; } catch (e) {}
function saveSettings() { try { localStorage.setItem(SAVE_SETTINGS, JSON.stringify(settings)); } catch (e) {} }
function saveBest() { try { localStorage.setItem(SAVE_BEST, String(Math.round(best))); } catch (e) {} }
// progress: where you stopped (at), planets and aliens found, treasure gems, and the highest and farthest you flew in space
const SAVE_PROGRESS = "trampoline-progress";
const prog = { at: null, planets: [], aliens: [], gems: [], high: 0, far: 0 };
try { Object.assign(prog, JSON.parse(localStorage.getItem(SAVE_PROGRESS) || "{}")); } catch (e) {}
if (!Array.isArray(prog.planets)) prog.planets = [];
if (!Array.isArray(prog.aliens)) prog.aliens = [];
if (!Array.isArray(prog.gems)) prog.gems = [];
prog.high = Number(prog.high) || 0; prog.far = Number(prog.far) || 0;
function saveProgress() { try { localStorage.setItem(SAVE_PROGRESS, JSON.stringify(prog)); } catch (e) {} }

// ================= Bounce tuning =================
const BOUNCE = {
  maxPower: 21,                         // 21 good bounces in a row reaches the top of space
  height: p => 2.5 * Math.pow(1.27, p), // metres for each power level (power 20 is about 300 m)
  airTime: p => 0.85 + 0.3 * p,         // seconds in the air
  zone: 0.42,                           // seconds before landing when SPACE counts
  squish: 0.16,                         // seconds on the mat
  dip: p => 0.35 + 0.02 * p,            // how far the mat stretches down (metres)
};
const SPACE_M = 300;                    // where space starts
const PX = 40;                          // screen units per metre
const VH = 720;                         // every screen is 720 units tall

// ================= Unlimited space =================
// Get a personal best of 370 m or higher (Noah's rule), and after that a jetpack lets you fly anywhere in space.
const UNLOCK_M = 370;                                // the best height that unlocks it
const SAVE_SPACE = "trampoline-space";               // set once the unlock has been cheered
const FLY = {
  push: 32,               // how hard the jetpack pushes (metres per second, every second)
  top: 20,                // fastest flying speed (metres per second)
  drag: 1.4,              // how quickly you slow down when you let go
  home: SPACE_M - 30,     // fly lower than this and you fall back home to the trampoline
};
const CELL = 40;          // space is cut into squares this many metres wide; each can hold a planet and a flying saucer
function spaceUnlocked() { return best >= UNLOCK_M; }

// ================= Screen =================
const cv = document.getElementById("c");
let ctx = cv.getContext("2d");
let scale = 1, VW = 1280, cacheGen = 0;   // cacheGen goes up on resize so the saved pictures get drawn again
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * dpr);
  cv.height = Math.round(innerHeight * dpr);
  scale = cv.height / VH;
  VW = cv.width / scale;
  cacheGen++;
}
addEventListener("resize", resize);
resize();

// ================= Game state =================
let screen = "menu";      // menu | settings | play
let time = 0;
const J = { y: 3, vy: 0, g: 20, phase: "air", squishT: 0, p: 0, pressed: "none", peakDone: true, goodCount: 0, x: 0, vx: 0, z: 0, vz: 0 };
let cam = 0;              // how high the camera is (metres)
let trampX = VW / 2;      // where the trampoline is on the screen
let bestMark = 0, shownNewBest = false, milestones = {};
let popups = [], confetti = [], banner = null, bannerQ = [], hintOn = true, speedOff = 0;
// flying in unlimited space (J.x and J.z are how far away sideways, in metres; the trampoline is at 0, 0)
let flying = false, thrust = 0, tilt = 0, flyFade = 0, flyHint = 0;
const held = new Set();           // arrow keys / WASD held down
let things = [], shootT = 1, greeted = new Map(), lastFound = "";
let rec = { high0: 0, far0: 0, high: false, far: false };   // the space records when this flight began
let statPulse = 0, saveT = 2;                                 // statPulse: the numbers glow when they go up
// standing on a planet (land holds the planet, which way is up there, how high you jumped, how fast you walk)
let land = null, noLandT = 0, landHint = 0, lastPlanet = null;
const fx3d = [];                  // little 3D effects to start (a puff of dust, a sparkle burst)

function resetJump() {
  Object.assign(J, { y: 3, vy: 0, g: 20, phase: "air", squishT: 0, p: 0, pressed: "none", peakDone: true, goodCount: 0, x: 0, vx: 0, z: 0, vz: 0 });
  popups = []; confetti = []; banner = null; bannerQ = []; milestones = {}; hintOn = true;
  bestMark = best; shownNewBest = false;
  flying = false; thrust = 0; tilt = 0; flyFade = 0; flyHint = 0;
  held.clear(); things = []; lastFound = "";
  land = null; noLandT = 0; landHint = 0; lastPlanet = null; fx3d.length = 0;
  jetStop();
}

function timeToLand() {
  // falling: y + vy t - g t^2 / 2 = 0
  const v = -J.vy;
  return (-v + Math.sqrt(v * v + 2 * J.g * Math.max(0, J.y))) / J.g;
}
function inZone() {
  if (J.pressed !== "none") return false;
  if (J.phase === "squish") return true;
  return J.vy < 0 && timeToLand() <= BOUNCE.zone;
}

function press() {
  if (screen === "play" && land) { planetJump(); return; }
  if (screen !== "play" || flying) return;
  if (J.pressed !== "none") return;
  if (J.phase === "squish") { J.pressed = "good"; return; }
  if (J.vy > 0) return;                     // still going up: nothing happens
  if (timeToLand() <= BOUNCE.zone) J.pressed = "good";
  else {
    J.pressed = "early";
    popup("Too soon! Wait for it...", "#ffffff");
    sfx.bwomp();
  }
}

function launch() {
  const demo = screen !== "play";
  if (demo) J.pressed = J.p < 2 ? "good" : "none";
  const good = J.pressed === "good";
  if (good) {
    J.p = Math.min(J.p + 1, BOUNCE.maxPower);
    if (!demo) {
      J.goodCount++;
      if (J.goodCount >= 1) hintOn = false;
      const words = ["Boing!", "Nice!", "Great!", "Super!", "Wow!", "Yes!", "Boing boing!"];
      popup(J.p === BOUNCE.maxPower ? "MEGA BOUNCE!" : words[Math.floor(Math.random() * words.length)], "#ffe14d");
    }
  } else {
    J.p = Math.max(J.p - 1, 0);
  }
  if (J.p <= 2) {
    // back near the bottom: the cheers can happen again on the way up
    milestones = {};
    if (shownNewBest) { shownNewBest = false; bestMark = best; }
  }
  sfx.boing(J.p, good && !demo);
  const h = BOUNCE.height(J.p), T = BOUNCE.airTime(J.p);
  J.g = 8 * h / (T * T);
  J.vy = 4 * h / T;
  J.y = 0;
  J.phase = "air";
  J.pressed = "none";
  J.peakDone = false;
}

function updateJump(dt) {
  if (flying) { updateFly(dt); return; }
  if (J.x !== 0 || J.z !== 0) {             // after flying: glide back over the trampoline while falling home
    const d = Math.hypot(J.x, J.z), step = Math.min(d, Math.max(d * 4 * dt, 20 * dt));
    if (step >= d) { J.x = 0; J.z = 0; } else { J.x -= J.x / d * step; J.z -= J.z / d * step; }
  }
  if (J.phase === "air") {
    J.vy -= J.g * dt;
    J.y += J.vy * dt;
    if (screen === "play") {
      if (bestMark >= 5 && !shownNewBest && J.y > bestMark) {
        shownNewBest = true;
        showBanner("New best! 🎉");
        burstConfetti();
        sfx.yay();
      }
      checkMilestones();
      if (J.vy > 0 && J.y >= SPACE_M) reachSpace();
    }
    if (!J.peakDone && J.vy <= 0) {
      J.peakDone = true;
      if (screen === "play" && J.y > best) { best = J.y; saveBest(); }
    }
    if (J.y <= 0 && J.vy < 0) {
      J.y = 0; J.x = 0; J.z = 0; J.phase = "squish"; J.squishT = 0;
    }
  } else {
    J.squishT += dt;
    J.y = -BOUNCE.dip(J.p) * Math.sin(Math.PI * Math.min(1, J.squishT / BOUNCE.squish));
    if (J.squishT >= BOUNCE.squish) launch();
  }
}

const MILESTONES = [
  { h: 30,      text: "Up in the clouds! ☁️" },
  { h: 110,     text: "Higher than a hot air balloon! 🎈" },
  { h: 190,     text: "Higher than a plane! ✈️" },
  { h: SPACE_M, text: "SPACE! 🚀" },
];
function checkMilestones() {
  for (const m of MILESTONES) {
    if (J.y >= m.h && !milestones[m.h]) {
      milestones[m.h] = true;
      showBanner(m.text);
      sfx.yay();
    }
  }
}

function popup(text, color) {
  popups.push({ text, color, x: flyerX(), y: flyerY() - 30, life: 1.3 });   // just above the bouncer's head
}
function popAt(text, color, x, y) {
  ctx.font = "700 40px Fredoka, sans-serif";
  const hw = Math.min(ctx.measureText(text).width, VW - 30) / 2 + 15;     // keep the words on the screen
  popups.push({ text, color, x: clamp(x, hw, VW - hw), y: clamp(y, popTop(), VH - 60), life: 2.0 });
}
function popTop() { return VW < 760 ? 220 : 160; }                       // words never float up behind the numbers at the top
function showBanner(text) { banner = { text, life: 2.0 }; }
function thenBanner(text) { if (banner) bannerQ.push(text); else showBanner(text); }   // waits for the one showing now
function soonBanner(text) { if (banner) bannerQ.unshift(text); else showBanner(text); } // next in line

// ---------- Unlimited space: the jetpack ----------
const JET_ON = "🎒 Jetpack on! Fly anywhere!";
// called every moment you are above 300 m and still going up
function reachSpace() {
  if (spaceUnlocked() || J.y >= UNLOCK_M) { startFlying(); return; }   // reaching 370 m unlocks it right there
  if (milestones.space) return;
  milestones.space = true;                   // not unlocked yet: say what to do (once each climb)
  thenBanner("Reach " + UNLOCK_M + " m to unlock UNLIMITED SPACE! 🌌");
}
function startFlying() {
  flying = true;
  J.vy = Math.min(J.vy, 12); J.vx = 0; J.vz = 0; J.phase = "air"; J.pressed = "none";
  if (J.y > best) { best = J.y; saveBest(); }
  beginFlight(8);
  bannerQ = [];                              // drop old messages that are still waiting (like "Reach 370 m")
  let first = false;
  try { first = !localStorage.getItem(SAVE_SPACE); localStorage.setItem(SAVE_SPACE, "1"); } catch (e) {}
  if (first) { thenBanner("🌌 UNLIMITED SPACE UNLOCKED!"); burstConfetti(); }
  thenBanner(JET_ON);
}
function beginFlight(hint) {
  flyHint = hint; lastFound = "";
  rec = { high0: prog.high, far0: prog.far, high: false, far: false };
}

// ---------- Remembering where you stopped ----------
const BACK_TEXT = "📍 Back where you stopped!";
function rememberWhere() {
  if (screen !== "play") return;
  const r2 = v => Math.round(v * 100) / 100;
  prog.at = flying ? { fly: 1, x: r2(J.x), y: r2(J.y), z: r2(J.z) } : J.p > 0 ? { p: J.p } : null;
  if (flying && land) prog.at.planet = land.key;
  saveProgress();
}
// pressing Play: carry on flying at the same spot in space, or bouncing with the same power
function resumeWhere() {
  const a = prog.at;
  if (!a) return;
  if (a.fly && spaceUnlocked() && isFinite(a.x) && isFinite(a.y) && (a.y >= FLY.home || a.planet)) {
    flying = true;
    J.x = a.x; J.y = a.y; J.z = isFinite(a.z) ? a.z : 0;               // (older saves have no z)
    J.vx = 0; J.vy = 0; J.vz = 0; J.phase = "air"; J.pressed = "none"; J.p = BOUNCE.maxPower - 1;
    snapView = true;
    milestones = { 30: true, 110: true, 190: true, [SPACE_M]: true, space: true };
    hintOn = false; beginFlight(6);
    const o = a.planet ? findPlanet(a.planet) : null;           // standing on a planet: back on it
    if (o) { landOn(o, new THREE.Vector3(J.x, J.y + MAT_Y, J.z), true); flyHint = 0; }   // (J is where the feet were)
    showBanner(BACK_TEXT);
  } else {
    J.p = clamp(Math.round(Number(a.p) || (a.fly ? BOUNCE.maxPower - 1 : 0)), 0, BOUNCE.maxPower);
    if (J.p >= 3) { hintOn = false; showBanner(BACK_TEXT); }
  }
}
function updateFly(dt) {
  if (land) { updatePlanet(dt); return; }
  noLandT = Math.max(0, noLandT - dt);
  // which way you want to go, as the camera sees it: sideways, up/down, forwards/backwards
  let sx = 0, sy = 0, sf = 0;
  if (held.has("left")) sx -= 1;
  if (held.has("right")) sx += 1;
  if (held.has("up")) sy += 1;
  if (held.has("down")) sy -= 1;
  if (held.has("fwd")) sf += 1;
  if (held.has("back")) sf -= 1;
  if (joy) { sx += joy.dx; sy += joy.dy; }   // the joystick on a phone
  // turn that into the world: the camera's right, its up, and its forwards (flat)
  const ca = Math.cos(view.az), sa = Math.sin(view.az), X = camFrame.ex, Y = camFrame.up, Z = camFrame.ez;
  const rx = sx * ca - sf * sa, rz = -sx * sa - sf * ca;
  let ax = X.x * rx + Z.x * rz + Y.x * sy, ay = X.y * rx + Z.y * rz + Y.y * sy, az = X.z * rx + Z.z * rz + Y.z * sy;
  const n = Math.hypot(ax, ay, az);
  if (n > 1) { ax /= n; ay /= n; az /= n; }
  J.vx += ax * FLY.push * dt; J.vy += ay * FLY.push * dt; J.vz += az * FLY.push * dt;
  const slow = Math.exp(-FLY.drag * dt * (n > 0 ? 0.25 : 1));
  J.vx *= slow; J.vy *= slow; J.vz *= slow;
  const sp = Math.hypot(J.vx, J.vy, J.vz);
  if (sp > FLY.top) { const k = FLY.top / sp; J.vx *= k; J.vy *= k; J.vz *= k; }

  thrust = lerp(thrust, n > 0 ? Math.min(1, 0.35 + n) : 0.2, Math.min(1, dt * 8));
  tilt = lerp(tilt, clamp(Math.hypot(J.vx, J.vz) / FLY.top, 0, 1) * 0.45, Math.min(1, dt * 5));   // lean forwards when you fly along
  // space records: the highest and the farthest you have ever flown
  if (J.y > prog.high) {
    if (!rec.high && rec.high0 >= SPACE_M + 20 && J.y > rec.high0) { rec.high = true; thenBanner("🏆 Higher than ever before!"); sfx.yay(); statPulse = 1.5; }
    prog.high = J.y;
  }
  const far = Math.hypot(J.x, J.z);
  if (far > prog.far) {
    if (!rec.far && rec.far0 >= 20 && far > rec.far0) { rec.far = true; thenBanner("🏆 Farther than ever before!"); sfx.yay(); statPulse = 1.5; }
    prog.far = far;
  }

  if (noLandT <= 0) for (const o of things) {
    if (o.kind !== "planet") continue;
    const cx = J.x, cy = J.y + MAT_Y + 1, cz = J.z;              // the middle of the bouncer
    if (Math.hypot(cx - o.x, cy - o.y, cz - o.z) < o.R + 0.9) { landOn(o, new THREE.Vector3(cx, cy, cz)); return; }

}

// ---------- Landing on planets: walk round them, floaty jumps, a treasure gem on each ----------
const PLANET_WALK = 3, PLANET_G = 5.8, PLANET_JUMP = 7.2;      // walking speed (m/s), low gravity, jump speed: about 4.5 m up, 2.5 s in the air
const _la = new THREE.Vector3(), _lb = new THREE.Vector3(), _lc = new THREE.Vector3();
function planetCentre(o) { return new THREE.Vector3(o.x, o.y, o.z); }
// where a planet's treasure gem is: its middle, just above the ground (out is a Vector3)
function gemSpot(o, out) { return out.set(o.x + o.gx * (o.R + 0.45), o.y + o.gy * (o.R + 0.45), o.z + o.gz * (o.R + 0.45)); }
// find a planet again from its key ("p" + i + "," + j + "," + k)
function findPlanet(key) {
  const m = /^p(-?\d+),(-?\d+),(-?\d+)$/.exec(key || "");
  if (!m) return null;
  const out = []; cellThings(+m[1], +m[2], +m[3], out);
  return out.find(o => o.key === key) || null;
}
// land on planet o where the bouncer touched it (quiet: no banner or thump, for "back where you stopped")
function landOn(o, touch, quiet) {
  const C = planetCentre(o), n = touch.clone().sub(C);
  if (n.lengthSq() < 1e-6) n.set(0, 1, 0);
  n.normalize();
  const face = new THREE.Vector3(J.vx, J.vy, J.vz);              // keep facing the way you were flying
  face.addScaledVector(n, -face.dot(n));
  if (face.lengthSq() < 1e-4) { face.set(1, 0, 0).addScaledVector(n, -n.x); if (face.lengthSq() < 1e-4) face.set(0, 0, 1).addScaledVector(n, -n.z); }
  face.normalize();

  land = { o, key: o.key, C, R: o.R, n, face, h, vr: quiet ? 0 : -1.5, vt: new THREE.Vector3(), air: 0, settled: !!quiet, walkPh: 0 };
  J.vx = J.vy = J.vz = 0; thrust = 0; tilt = 0; landHint = 6; flyHint = 0;
  setFeet();

}
// put J where the feet are (J.y is MAT_Y lower than the 3D world, like everywhere else in the game)
function setFeet() {
  const L = land;
  _la.copy(L.C).addScaledVector(L.n, L.R + L.h);
  J.x = _la.x; J.y = _la.y - MAT_Y; J.z = _la.z;
}
function planetJump() {
  const L = land;
  if (L.h <= 0.001 && L.vr <= 0) { L.vr = PLANET_JUMP; L.air = 0; sfx.whee(); return; }   // on the ground: a big floaty jump
  if (L.air > 0.12) flyAway();                                                          // in the air: the jetpack comes back on
}
function flyAway() {
  const L = land;
  land = null; noLandT = 1.1; landHint = 0;
  lastPlanet = { C: L.C, R: L.R, t: 3 };
  const push = L.n.clone().multiplyScalar(9).add(L.vt);          // a gentle push away from the planet
  J.vx = push.x; J.vy = push.y; J.vz = push.z; thrust = 1;
}
function updatePlanet(dt) {
  const L = land, n = L.n;
  landHint = Math.max(0, landHint - dt);
  thrust = lerp(thrust, 0, Math.min(1, dt * 8));
  // which way to walk: up/W away from the camera, down/S towards it, left/right sideways (or the joystick)
  let sx = 0, sf = 0;
  if (held.has("left")) sx -= 1;
  if (held.has("right")) sx += 1;
  if (held.has("up") || held.has("fwd")) sf += 1;
  if (held.has("down") || held.has("back")) sf -= 1;
  if (joy) { sx += joy.dx; sf += joy.dy; }
  const fwd = camForward(_la);
  fwd.addScaledVector(n, -fwd.dot(n));                            // flat along the ground here
  if (fwd.lengthSq() < 1e-6) fwd.copy(L.face);
  fwd.normalize();

  const wish = _lc.copy(right).multiplyScalar(sx).addScaledVector(fwd, sf);
  if (wish.length() > 1) wish.normalize();

  // walk along the round ground: step, then stand up straight again on the new spot
  const sp = L.vt.length();

    _la.copy(n).multiplyScalar(L.R + L.h).addScaledVector(L.vt, dt).normalize();
    n.copy(_la);
    L.vt.addScaledVector(n, -L.vt.dot(n)).setLength(sp);

  L.face.addScaledVector(n, -L.face.dot(n));

  L.face.normalize();
  L.walkPh += dt * sp * 3.2;

    if (L.h <= 0) { L.h = 0; L.vr = 0; L.air = 0; }

    L.settled = true; sfx.thump();
    fx3d.push({ type: "puff", n: n.clone(), C: L.C, R: L.R, t: L.o.t });
  }
  setFeet();
  // the treasure gem
  const o = L.o;
  if (!prog.gems.includes(o.key)) {
    const g = gemSpot(o, _la);
    _lb.copy(L.C).addScaledVector(n, L.R + L.h + 0.9);
    if (_lb.distanceTo(g) < 1.6) {
      prog.gems.push(o.key); saveProgress(); statPulse = 1.5;
      fx3d.push({ type: "burst", at: g.clone(), t: o.t });
      sfx.chime();
      showBanner("💎 You found a treasure!");
      const c = prog.gems.length;
      thenBanner("💎 " + c + (c === 1 ? " treasure!" : " treasures!"));
    }
  }
}
// flew down out of space: the jetpack switches off and you fall back to the trampoline.
// One good bounce when you land takes you straight back up to space.
function fallHome() {
  flying = false; jetStop();
  const p = BOUNCE.maxPower - 1, h = BOUNCE.height(p), T = BOUNCE.airTime(p);
  J.p = p; J.g = 8 * h / (T * T); J.vy = Math.min(J.vy, 0); J.vx = 0; J.vz = 0;
  J.phase = "air"; J.pressed = "none"; J.peakDone = true;

// every frame while flying: sounds, saying hello to aliens, naming planets (shooting stars are in the 3D part)
function updateSpace(dt) {
  flyHint = Math.max(0, flyHint - dt);
  jetSound(thrust);
  for (const o of things) {
    const d = Math.hypot(o.x - J.x, o.y - (J.y + 1.2), o.z - J.z);
    if (o.kind === "planet" && d < o.R + 3.5 && lastFound !== o.key) {
      lastFound = o.key;
      const P = PLANETS[o.t];
      showBanner("You found " + P.name + "! " + P.emoji);
      sfx.yay();
      if (!prog.planets.includes(P.kind)) {      // a new kind of planet for the collection
        prog.planets.push(P.kind); saveProgress(); statPulse = 1.5;
        const n = prog.planets.length;
        if (n >= PLANETS.length) { thenBanner("🎉 You found them ALL!"); burstConfetti(); }
        else thenBanner("🪐 " + n + " of " + PLANETS.length + " planets found!");
      }
    }
    if (o.kind === "ufo" && d < 7) {
      const g = greeted.get(o.key);
      if (g === undefined || time - g > 20) {
        greeted.set(o.key, time);
        const u = toScreen(o.x, o.y, o.z, { x: 0, y: 0, b: false });   // the words float up from under the saucer (or above it, near the bottom)
        if (u.b) { u.x = flyerX(); u.y = flyerY() - 120; }
        popAt(GREETINGS[Math.floor(Math.random() * GREETINGS.length)], "#b8ffb0", u.x, u.y > VH - 220 ? u.y - 95 : u.y + 75);
        sfx.bleep();
        if (!prog.aliens.includes(o.key)) { prog.aliens.push(o.key); saveProgress(); statPulse = 1.5; }   // a new alien friend

}

// ---------- Unlimited space: what is out there ----------
const PLANETS = [
  { kind: "moon",    name: "the Moon",          emoji: "🌕", cols: ["#ffffff", "#d9d6cc", "#8f8c82"], glow: "220,225,255" },
  { kind: "mars",    name: "Mars",              emoji: "🔴", cols: ["#ffb98a", "#d9603a", "#7a2614"], glow: "255,150,110" },
  { kind: "saturn",  name: "Saturn",            emoji: "🪐", cols: ["#fbe3b0", "#e2b46c", "#9a6a2c"], glow: "255,220,160", rings: true },
  { kind: "ice",     name: "the Ice Planet",    emoji: "❄️", cols: ["#ffffff", "#a8e4f6", "#3a7fb8"], glow: "170,230,255" },
  { kind: "candy",   name: "the Candy Planet",  emoji: "🍭", cols: ["#ffe3f1", "#ff8cc8", "#b8407e"], glow: "255,160,210" },
  { kind: "jungle",  name: "the Jungle Planet", emoji: "🌴", cols: ["#9fe0ff", "#2f86d6", "#0f3f86"], glow: "130,200,255" },
  { kind: "jupiter", name: "Jupiter",           emoji: "🟠", cols: ["#fff0d6", "#e6a865", "#8c5226"], glow: "255,210,160", big: 1.35 },
];
const GREETINGS = [
  "Hi! 👋",
  "Hello, friend!",
  "Bleep bloop! 💚",
  "Welcome to space!",
];
// The same box of space always holds the same things, so you can fly back to them.
// Space is cut into boxes CELL metres wide (i: sideways, j: up, k: forwards and backwards).
function cellThings(i, j, k, out) {
  if (j < 7 || (j <= 9 && (i === -1 || i === 0) && (k === -1 || k === 0))) return;   // nothing low down, or right above the trampoline
  const r = n => rand(i * 73.13 + j * 157.71 + k * 241.37 + n * 11.37);
  if (r(1) < 0.22) {
    const t = Math.floor(r(2) * PLANETS.length), R = (3 + r(3) * 3) * (PLANETS[t].big || 1);
    const x = (i + 0.22 + r(4) * 0.56) * CELL, y = (j + 0.22 + r(5) * 0.56) * CELL, z = (k + 0.22 + r(11) * 0.56) * CELL;
    const hd = Math.hypot(x, z) || 1;
    let gx = x / hd + (r(14) - 0.5) * 0.9, gy = 0.35 + r(13) * 0.5, gz = z / hd + (r(15) - 0.5) * 0.9;
    if (PLANETS[t].rings) {                                          // keep it away from under Saturn's rings
      const d = gx * RING_N[0] + gy * RING_N[1] + gz * RING_N[2], sg = d < 0 ? -1 : 1, gl = Math.hypot(gx, gy, gz);
      if (Math.abs(d) / gl < 0.6) { gx += RING_N[0] * sg * 1.2 * gl; gy += RING_N[1] * sg * 1.2 * gl; gz += RING_N[2] * sg * 1.2 * gl; }
    }
    const gl = Math.hypot(gx, gy, gz);
    out.push({ kind: "planet", key: "p" + i + "," + j + "," + k, t, R, x, y, z, gx: gx / gl, gy: gy / gl, gz: gz / gl });
  }
  if (r(6) < 0.17) {
    const ph = r(7) * 6.28, bx = (i + 0.15 + r(8) * 0.7) * CELL, by = (j + 0.15 + r(9) * 0.7) * CELL, bz = (k + 0.15 + r(12) * 0.7) * CELL;
    out.push({ kind: "ufo", key: "u" + i + "," + j + "," + k, c: Math.floor(r(10) * 4), ph,
               x: bx + Math.sin(time * 0.45 + ph) * 3, y: by + Math.sin(time * 0.9 + ph) * 0.6, z: bz + Math.cos(time * 0.45 + ph) * 3 });
  }
}
const RING_N = [0, 0.913, 0.408];                    // which way Saturn's rings face (they are tilted)
const WELCOME = { x: -5.5, y: 303.5, z: -3 };     // a friendly alien waiting right where you come into space
function spaceThingsNear() {
  const out = [], R = SPACE_R, ci = Math.floor(J.x / CELL), cj = Math.floor(J.y / CELL), ck = Math.floor(J.z / CELL);
  for (let j = cj - R; j <= cj + R; j++) for (let i = ci - R; i <= ci + R; i++) for (let k = ck - R; k <= ck + R; k++)
    if ((i - ci) ** 2 + (j - cj) ** 2 + (k - ck) ** 2 <= (R + 0.5) ** 2) cellThings(i, j, k, out);
  out.push({ kind: "ufo", key: "welcome", c: 0, ph: 0,
             x: WELCOME.x + Math.sin(time * 0.45) * 1.2, y: WELCOME.y + Math.sin(time * 0.9) * 0.5, z: WELCOME.z + Math.cos(time * 0.45) * 0.8 });
  return out;
}
function burstConfetti() {
  const cols = ["#ff5c5c", "#ffd23f", "#3ccf5a", "#4aa8ff", "#c06bff", "#ff8a3d"];
  for (let i = 0; i < 90; i++) {
    confetti.push({ x: VW / 2 + (Math.random() - 0.5) * 200, y: VH * 0.3,
      vx: (Math.random() - 0.5) * 700, vy: -200 - Math.random() * 500,
      r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 12,
      c: cols[i % cols.length], life: 2 + Math.random() });
  }
}

// ================= Sounds (made right here, no files) =================
let actx = null;
function audio() {
  if (settings.sound !== "on") return null;
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sfx = {
  boing(p, good) {
    if (screen !== "play") return;
    const a = audio(); if (!a) return;
    const t0 = a.currentTime, base = good ? 140 + p * 12 : 110;
    const o = a.createOscillator(), g = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(base, t0);
    o.frequency.exponentialRampToValueAtTime(base * (good ? 3.2 : 1.8), t0 + 0.28);
    lfo.frequency.value = 22; lg.gain.value = base * 0.25;
    lfo.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(good ? 0.3 : 0.15, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.4);
    o.connect(g).connect(a.destination);
    o.start(t0); lfo.start(t0); o.stop(t0 + 0.45); lfo.stop(t0 + 0.45);
  },
  bwomp() { tone("triangle", 220, 90, 0.3, 0.15); },
  click() { tone("square", 660, 880, 0.07, 0.06); },
  yay()   { [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f * 1.01, 0.18, 0.15, i * 0.09)); },
  bleep() { tone("sine", 880, 1320, 0.09, 0.12); tone("sine", 1320, 620, 0.16, 0.12, 0.12); },   // an alien saying hi
  thump() { tone("sine", 150, 55, 0.3, 0.26); tone("triangle", 95, 50, 0.22, 0.1); },              // landing softly on a planet
  whee()  { tone("sine", 330, 780, 0.6, 0.12); tone("triangle", 495, 1170, 0.5, 0.05, 0.07); },    // a floaty jump
  chime() { [1047, 1319, 1568, 2093, 2637].forEach((f, i) => tone("triangle", f, f * 1.003, 0.4, 0.11, i * 0.07)); },   // treasure!
};
// the jetpack's soft whoosh: a loop of noise that gets louder when you fly
const jet = { src: null, gain: null };
function jetSound(v) {
  if (!jet.src) {
    if (v <= 0) return;
    const a = audio(); if (!a) return;
    const buf = a.createBuffer(1, a.sampleRate, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; src.loop = true; f.type = "lowpass"; f.frequency.value = 650; g.gain.value = 0;
    src.connect(f).connect(g).connect(a.destination); src.start();
    jet.src = src; jet.gain = g;
  }
  jet.gain.gain.setTargetAtTime(v * 0.11, actx.currentTime, 0.08);
}
function jetStop() {
  if (!jet.src) return;
  try { jet.src.stop(); } catch (e) {}
  jet.src = null; jet.gain = null;
}
document.addEventListener("visibilitychange", () => { if (document.hidden) { jetStop(); rememberWhere(); } });
addEventListener("pagehide", () => rememberWhere());

// ================= Little helpers (for the HUD, and for painting the pictures of the 3D world) =================
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function rand(seed) { const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function ellipse(x, y, rx, ry, fill, rot = 0) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill();
}
function rrect(x, y, w, h, r, fill) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
}
function poly(pts, fill) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
// a little random-number maker that gives the same numbers every time (so pictures never change)
function rng(seed) {
  let a = (seed * 2654435761) >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// a soft round blob of colour (centre solid, edge clear)
function puff(x, y, r, rgb, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(0.55, `rgba(${rgb},${a * 0.75})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
// a soft oval blob, turned by rot
function softEllipse(cx, cy, rx, ry, rgb, a, rot = 0) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(0.55, `rgba(${rgb},${a * 0.6})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(-rx, -rx, rx * 2, rx * 2); ctx.restore();
}
// paint into a new canvas; w and h are in units, k is how many pixels per unit
function sprite(w, h, k, fn) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.ceil(w * k)); c.height = Math.max(1, Math.ceil(h * k));
  const old = ctx; ctx = c.getContext("2d"); ctx.setTransform(k, 0, 0, k, 0, 0);
  try { fn(); } finally { ctx = old; }
  return c;
}
// draw something that repeats at the edges of an S x S picture (so the picture tiles with no seams)
function tiled(S, x, y, m, fn) {
  for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) {
    const X = x + ox, Y = y + oy;
    if (X < -m || X > S + m || Y < -m || Y > S + m) continue;
    fn(X, Y);

  PLANETS.forEach((P, t) => { const o = makePlanetObj(t); temp.add(o); pools.planet[t].push(o); });
  ALIEN_COLS.forEach((c, i) => { const o = makeUfo(i); temp.add(o); pools.ufo[i].push(o); });
  const gem = makeGem("moon"); temp.add(gem); (gemPools.moon = gemPools.moon || []).push(gem);
  if (planetShadow) { planetShadow.visible = true; hidden.push(planetShadow); }
  temp.position.set(0, -60, 0); scene.add(temp);
  for (const o of hidden) o.visible = true;
  const done = () => { scene.remove(temp); for (const o of hidden) o.visible = false; };
  try {
    if (R3.compileAsync) R3.compileAsync(scene, camera).then(done, done);
    else { R3.compile(scene, camera); done(); }
  } catch (err) { done(); }
}
function warm3D() {
  if (!jobs3D.length) return;
  try { if (jobs3D[0]() !== false) jobs3D.shift(); } catch (err) { jobs3D.shift(); console.error(err); }
  setTimeout(warm3D, 30);
}
setTimeout(warm3D, 120);
function buildAll() { while (jobs3D.length) { if (jobs3D[0]() !== false) jobs3D.shift(); } }   // (used by the tests)

// ================= HUD while playing =================
let touchMode = matchMedia("(pointer: coarse)").matches;   // phones and tablets: tap instead of SPACE
addEventListener("touchstart", () => { touchMode = true; }, { passive: true });
addEventListener("keydown", () => { touchMode = false; });

function drawHUD() {
  const h = Math.max(0, J.y);
  const narrow = VW < 760;                                   // a phone held upright
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.font = "700 64px Fredoka, sans-serif";
  ctx.lineWidth = 10; ctx.strokeStyle = "rgba(43,33,64,0.6)";
  const label = Math.floor(h) + " m";
  ctx.strokeText(label, VW / 2, 18); ctx.fillStyle = "#fff"; ctx.fillText(label, VW / 2, 18);

  // bounce power bar (not while flying with the jetpack)
  const bw = Math.min(360, VW * 0.5), bx = VW / 2 - bw / 2, by = 96;
  if (!flying) {
    rrect(bx - 4, by - 4, bw + 8, 26, 13, "rgba(43,33,64,0.45)");
    const f = J.p / BOUNCE.maxPower;
    if (f > 0) {
      const gr = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      ["#3ccf5a", "#ffe14d", "#ff9f1c", "#ff4d4d", "#c06bff"].forEach((c, i) => gr.addColorStop(i / 4, c));
      rrect(bx, by, Math.max(18, bw * f), 18, 9, gr);
    }
    ctx.font = "600 20px Fredoka, sans-serif"; ctx.fillStyle = "#fff";
    ctx.lineWidth = 5; ctx.lineJoin = "round"; ctx.strokeStyle = "rgba(43,33,64,0.65)";
    ctx.strokeText("Bounce power", VW / 2, by + 24); ctx.fillText("Bounce power", VW / 2, by + 24);
  }

  // best (under the power bar on an upright phone)
  const bestText = "🏆 Best " + Math.floor(best) + " m";
  ctx.font = `700 ${narrow ? 26 : 30}px Fredoka, sans-serif`;
  ctx.textAlign = narrow ? "center" : "right";
  const bx2 = narrow ? VW / 2 : VW - 20, by2 = narrow ? 156 : 22;
  ctx.lineWidth = 6;
  if (!flying) { ctx.strokeText(bestText, bx2, by2); ctx.fillStyle = "#ffe14d"; ctx.fillText(bestText, bx2, by2); }
  else {
    // while flying: space records (highest, farthest) and what you have found (planets, alien friends)
    const recText = "🏆 ↑ " + Math.floor(prog.high) + " m   ↔ " + Math.floor(prog.far) + " m";
    const foundText = "🪐 " + prog.planets.length + "/" + PLANETS.length + "   👽 " + prog.aliens.length + "   💎 " + prog.gems.length;
    const y1 = narrow ? 96 : 22, y2 = y1 + (narrow ? 32 : 40), glowOn = statPulse > 0 && Math.sin(time * 14) > -0.3;
    ctx.font = `700 ${narrow ? 22 : 28}px Fredoka, sans-serif`;
    ctx.strokeText(recText, bx2, y1); ctx.fillStyle = "#ffe14d"; ctx.fillText(recText, bx2, y1);
    ctx.strokeText(foundText, bx2, y2); ctx.fillStyle = glowOn ? "#b8ffb0" : "#ffffff"; ctx.fillText(foundText, bx2, y2);
  }

  // height ladder on the right
  const top = narrow ? 340 : 90, bot = narrow ? 500 : VH - 60, lx = VW - (narrow ? 16 : 40);
  const map = m => bot - Math.sqrt(clamp(m, 0, 400) / 400) * (bot - top);
  if (!flying) {
    rrect(lx - 5, top, 10, bot - top, 5, "rgba(255,255,255,0.45)");
    ctx.font = `${narrow ? 18 : 26}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    [["🏠", 0], ["☁️", 30], ["🎈", 110], ["✈️", 190], ["🚀", SPACE_M]].forEach(([e, m]) => ctx.fillText(e, lx - (narrow ? 22 : 34), map(m)));
    if (!spaceUnlocked()) ctx.fillText("🌌", lx - (narrow ? 44 : 66), map(UNLOCK_M));   // the height that unlocks unlimited space
    if (best > 0) { rrect(lx - 14, map(best) - 3, 28, 6, 3, "#ffe14d"); }
    ellipse(lx, map(h), 11, 11, "#ff5c5c"); ellipse(lx, map(h), 6, 6, "#fff");
  }

  // help at the start
  ctx.textBaseline = "alphabetic";
  const hint = touchMode ? "Tap the screen when you land!" : "Press SPACE when you land!";
  if (hintOn && !flying) {
    bigText(hint, VW / 2, narrow ? VH - 150 : VH - 40, 36, "#fff");
    const look = touchMode ? "Drag with one finger to look around!" : "Drag the mouse to look around!";
    bigText(look, VW / 2, narrow ? VH - 88 : VH - 92, 26, "#d8f0ff");
  }
  if (flying && touchMode) {                                   // the joystick (bottom left): steer left and right, up and down
    const j = joyPlace(), kx = joy ? joy.dx : 0, ky = joy ? joy.dy : 0;
    ellipse(j.x, j.y, j.r, j.r, "rgba(255,255,255,0.16)");
    ctx.strokeStyle = "rgba(255,255,255,0.65)"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(j.x, j.y, j.r, 0, 7); ctx.stroke();
    ctx.font = "700 22px Fredoka, sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("▲", j.x, j.y - j.r * 0.72); ctx.fillText("▼", j.x, j.y + j.r * 0.72); ctx.fillText("◀", j.x - j.r * 0.72, j.y); ctx.fillText("▶", j.x + j.r * 0.72, j.y);
    ctx.textBaseline = "alphabetic";
    ellipse(j.x + kx * j.r * 0.6, j.y - ky * j.r * 0.6, j.r * 0.42, j.r * 0.42, joy ? "rgba(255,255,255,0.85)" : "rgba(255,255,255,0.6)");
  }
  if (land && landHint > 0) {                                  // on a planet: how to walk, jump and fly away
    const walkTip = touchMode ? "Joystick to walk, tap to jump! Tap twice to fly away!" : "Arrows to walk, SPACE to jump! Jump twice to fly away!";
    ctx.globalAlpha = clamp(landHint, 0, 1);
    bigText(walkTip, touchMode && !narrow ? Math.min(VW / 2 + 90, VW - 200) : VW / 2, VH - 30, 34, "#fff");
    ctx.globalAlpha = 1;
  }
  if (flying && flyHint > 0 && !land) {
    const flyTip = touchMode ? "Use the joystick to fly!" : "Arrow keys to fly! Fly down to go home.";
    ctx.globalAlpha = clamp(flyHint, 0, 1);
    bigText(flyTip, touchMode && !narrow ? Math.min(VW / 2 + 90, VW - 200) : VW / 2, VH - 30, 34, "#fff");
    ctx.globalAlpha = 1;
  }

  // "NOW!" when it's time to press
  if (J.vy < 0 && J.phase === "air" && !flying) {
    if (matOffScreen()) {
      const zone = inZone();
      const dist = Math.floor(J.y);
      if (zone) bigText("⬇ NOW! ⬇", VW / 2, VH - 30, 58 + Math.sin(time * 25) * 6, "#fff36b");
      else bigText("⬇ " + dist + " m", VW / 2, VH - 30, 34, "#fff");
    } else if (inZone() && J.goodCount < 3) {
      if (narrow) bigText("NOW!", VW / 2, VH - 24, 50, "#fff36b");
      else bigText("NOW!", nowX, nowY, 50, "#fff36b");
    }
  }
}

// Big outlined words. Too wide for the screen? Smaller, or on two lines.
function bigText(t, x, y, size, color, split = true) {
  ctx.textAlign = "center";
  ctx.font = `700 ${size}px Fredoka, sans-serif`;
  const room = VW - 30, w = ctx.measureText(t).width;
  if (w > room) {
    let cut = t.lastIndexOf(" ", Math.floor(t.length / 2) + 2);
    const stop = t.indexOf("! ");                        // two sentences? put one on each line
    if (stop > t.length * 0.25 && stop < t.length * 0.75) cut = stop + 1;
    if (split && size * room / w < 30 && cut > 0) {
      const s2 = Math.min(size, 46);
      bigText(t.slice(0, cut), x, y - s2 * 0.55, s2, color, false);   // each line only shrinks, so lines never pile up
      bigText(t.slice(cut + 1), x, y + s2 * 0.55, s2, color, false);
      return;
    }
    size = Math.floor(size * room / w);
    ctx.font = `700 ${size}px Fredoka, sans-serif`;
  }
  ctx.lineWidth = size / 5; ctx.strokeStyle = "rgba(43,33,64,0.7)"; ctx.lineJoin = "round";
  ctx.strokeText(t, x, y); ctx.fillStyle = color; ctx.fillText(t, x, y);
}

function drawSpeedLines() {
  const s = Math.abs(J.vy);
  if (s < 40 || J.phase !== "air" || flying) return;
  ctx.globalAlpha = clamp((s - 40) / 120, 0, 0.5) * (1 - Math.abs(camera.matrixWorld.elements[9]));
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
  for (let i = 0; i < 18; i++) {
    const x = rand(i + 900) * VW;
    const len = 80 + rand(i + 950) * 160;
    const m = VH + len;
    const y = (((rand(i + 999) * m + speedOff) % m) + m) % m;
    ctx.beginPath(); ctx.moveTo(x, y - len); ctx.lineTo(x, y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ================= Main loop =================
let last = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0.016);
  last = t; time += dt;

  updateJump(dt);
  speedOff += J.vy * PX * 0.6 * dt;
  flyFade = clamp(flyFade + (flying ? dt : -dt) / 1.2, 0, 1);
  things = flyFade > 0 ? spaceThingsNear() : [];
  if (flying) updateSpace(dt);
  statPulse = Math.max(0, statPulse - dt);
  if (screen === "play" && (saveT -= dt) <= 0) { saveT = 2; rememberWhere(); }   // remember where you are every 2 seconds

  for (const p of popups) { p.life -= dt; p.y = Math.max(popTop(), p.y - 60 * dt); }   // they float up, but stop below the numbers at the top
  popups = popups.filter(p => p.life > 0);
  for (const c of confetti) { c.life -= dt; c.vy += 700 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.r += c.vr * dt; }
  confetti = confetti.filter(c => c.life > 0 && c.y < VH + 40);
  if (banner) {
    banner.life -= dt;
    if (banner.life <= 0) banner = bannerQ.length ? { text: bannerQ.shift(), life: 2.0 } : null;
  }

  // the 3D world
  updateView(dt);
  updateWorld(dt);
  render3D();
  watchSpeed(dt);

  // words on top (a see-through canvas over the 3D one)
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawSpeedLines();
  for (const p of popups) { ctx.globalAlpha = clamp(p.life * 2, 0, 1); bigText(p.text, p.x, p.y, 40, p.color); }
  ctx.globalAlpha = 1;
  for (const c of confetti) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r);
    ctx.fillStyle = c.c; ctx.fillRect(-6, -4, 12, 8); ctx.restore();
  }
  if (screen === "play") {
    drawHUD();
    if (banner) {
      ctx.globalAlpha = clamp(banner.life * 2, 0, 1);
      bigText(banner.text, VW / 2, flying ? (touchMode && VW < 760 ? VH * 0.6 : VH * 0.82) : VH * 0.58, 64, "#ffe14d");   // under you while flying (above the joystick on a phone)
      ctx.globalAlpha = 1;
    }
  }
  requestAnimationFrame(frame);
}

// ================= Menu, Settings and keys =================
const elMenu = document.getElementById("menu"), elSet = document.getElementById("settings"), elHome = document.getElementById("bHome");
const menuBtns = [document.getElementById("bPlay"), document.getElementById("bSet")];
const rows = [...document.querySelectorAll("#settings .row"), document.getElementById("bBack")];
let menuSel = 0, setSel = 0;

// rainbow bouncy title
const titleCols = ["#ff4d4d", "#ff9f1c", "#ffd23f", "#3ccf5a", "#4aa8ff", "#8a5cff"];
document.getElementById("title").innerHTML = [..."TRAMPOLINE"].map((ch, i) =>
  `<span style="color:${titleCols[i % titleCols.length]};animation-delay:${i * 0.08}s">${ch}</span>`).join("");

function show(name) {
  rememberWhere();                             // leaving a game: remember where you were
  screen = name;
  elMenu.classList.toggle("hidden", name !== "menu");
  elSet.classList.toggle("hidden", name !== "settings");
  elHome.classList.toggle("hidden", name !== "play");
  document.getElementById("spaceBadge").classList.toggle("hidden", !spaceUnlocked());
  document.getElementById("spaceStats").textContent = prog.high > 0 ? "🪐 " + prog.planets.length + "/" + PLANETS.length +
    " · 👽 " + prog.aliens.length + " · 💎 " + prog.gems.length + " · 🏆 ↑ " + Math.floor(prog.high) + " m ↔ " + Math.floor(prog.far) + " m" : "";
  if (name === "play" || name === "menu") resetJump();
  if (name === "play") { resumeWhere(); saveT = 2; snapView = true; }
  if (name === "menu") menuView.az = view.az;
  paintMenu(); paintSettings();
}
function paintMenu() { menuBtns.forEach((b, i) => b.classList.toggle("sel", i === menuSel)); }
function paintSettings() {
  rows.forEach((r, i) => r.classList.toggle("sel", i === setSel));
  for (const r of rows) {
    if (!r.dataset.key) continue;
    r.querySelectorAll(".opt").forEach(o => o.classList.toggle("on", o.dataset.v === settings[r.dataset.key]));
  }
}
function changeSetting(row, dir) {
  const key = row.dataset.key; if (!key) return;
  const vals = [...row.querySelectorAll(".opt")].map(o => o.dataset.v);
  const i = vals.indexOf(settings[key]);
  settings[key] = vals[(i + dir + vals.length) % vals.length];
  saveSettings(); paintSettings(); sfx.click();
}

menuBtns[0].onclick = () => { sfx.click(); show("play"); };
menuBtns[1].onclick = () => { sfx.click(); menuSel = 1; setSel = 0; show("settings"); };
menuBtns.forEach((b, i) => b.onmouseenter = () => { menuSel = i; paintMenu(); });
document.getElementById("bBack").onclick = () => { sfx.click(); show("menu"); };
elHome.onclick = () => { sfx.click(); menuSel = 0; show("menu"); };
rows.forEach((r, i) => {
  r.onmouseenter = () => { setSel = i; paintSettings(); };
  r.querySelectorAll?.(".opt").forEach(o => o.onclick = () => {
    settings[r.dataset.key] = o.dataset.v; saveSettings(); paintSettings(); sfx.click();
  });
});

// flying with the jetpack: arrow keys (left, right, up, down) and W/S (forwards and backwards, the way the camera looks)
const FLY_KEYS = { ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right",
                   ArrowUp: "up", ArrowDown: "down", w: "fwd", W: "fwd", s: "back", S: "back" };
addEventListener("keyup", e => { if (FLY_KEYS[e.key]) held.delete(FLY_KEYS[e.key]); });
addEventListener("blur", () => held.clear());

addEventListener("keydown", e => {
  const k = e.key;
  if ([" ", "Enter", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Escape", "Tab"].includes(k)) e.preventDefault();
  if (screen === "play") {
    if (FLY_KEYS[k]) held.add(FLY_KEYS[k]);
    if (k === " " && !e.repeat) press();
    if (k === "Escape") { menuSel = 0; show("menu"); }
    return;
  }
  if (e.repeat && (k === " " || k === "Enter")) return;
  if (screen === "menu") {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Tab"].includes(k)) { menuSel = 1 - menuSel; paintMenu(); sfx.click(); }
    if (k === " " || k === "Enter") menuBtns[menuSel].onclick();
  } else if (screen === "settings") {
    if (k === "ArrowDown" || k === "Tab") { setSel = (setSel + 1) % rows.length; paintSettings(); }
    if (k === "ArrowUp") { setSel = (setSel + rows.length - 1) % rows.length; paintSettings(); }
    if (k === "ArrowLeft") changeSetting(rows[setSel], -1);
    if (k === "ArrowRight") changeSetting(rows[setSel], 1);
    if (k === " " || k === "Enter") {
      if (rows[setSel].id === "bBack") rows[setSel].onclick(); else changeSetting(rows[setSel], 1);
    }
    if (k === "Escape") show("menu");
  }
});
show("menu");
requestAnimationFrame(t => { last = t; frame(t); });
</script>
