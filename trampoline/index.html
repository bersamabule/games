<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Trampoline</title>
<link rel="icon" href="icon.png">
<style>
  @font-face { font-family: "Fredoka"; src: url("fonts/Fredoka.ttf") format("truetype");
               font-weight: 300 700; font-stretch: 75% 125%; font-display: swap; }

  :root {
    --ink: #2b2140;
    --play: #3ccf5a;
    --play-dark: #23a03f;
    --set: #4aa8ff;
    --set-dark: #2b7fd1;
    --panel: rgba(255, 255, 255, 0.94);
    --pick: #ffd23f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff;
               font-family: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
               color: var(--ink); user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }

  /* ---------- Menu: only Play and Settings ---------- */
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
          padding-top: 4vh; pointer-events: none; }
  .title { margin: 0; font-size: min(15vh, 13vw); font-weight: 700; letter-spacing: 0.02em;
           line-height: 1; white-space: nowrap; }
  .title span { display: inline-block; animation: hop 1.1s ease-in-out infinite;
                -webkit-text-stroke: 0.035em #fff; paint-order: stroke fill;
                text-shadow: 0 0.06em 0 rgba(0,0,0,0.18); }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-0.18em); } }
  .btns { display: flex; gap: 4vw; margin-top: 4vh; pointer-events: auto; }
  .big { font: inherit; font-size: min(6.5vh, 7vw); font-weight: 700; color: #fff; border: 0;
         border-radius: 999px; padding: 0.35em 1.1em; cursor: pointer;
         box-shadow: 0 0.16em 0 var(--d), 0 0.3em 0.6em rgba(0,0,0,0.2);
         transition: transform 0.12s; text-shadow: 0 0.05em 0 rgba(0,0,0,0.25); }
  .big.sel { transform: scale(1.12); outline: 0.12em solid #fff; outline-offset: 0.08em; }
  .big:active { transform: scale(1.05) translateY(0.1em); }
  #bPlay { background: var(--play); --d: var(--play-dark); }
  #bSet  { background: var(--set);  --d: var(--set-dark); }

  /* ---------- Settings ---------- */
  #settings { position: fixed; inset: 0; display: flex; align-items: center; padding-left: 4vw; }
  .panel { background: var(--panel); border-radius: 28px; padding: 3vh 2.6vw 3vh;
           width: min(560px, 50vw); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .panel h2 { margin: 0 0 2vh; font-size: min(6vh, 7vw); text-align: center; }
  .row { border-radius: 18px; padding: 1.2vh 1vw; margin-bottom: 1.4vh; border: 4px solid transparent; }
  .row.sel { border-color: var(--pick); background: #fff8d9; }
  .lab { font-size: min(3.4vh, 4.5vw); font-weight: 600; margin-bottom: 0.8vh; }
  .opts { display: flex; flex-wrap: wrap; gap: 0.8vw; }
  .opt { font: inherit; font-size: min(3.2vh, 4.2vw); font-weight: 600; border: 3px solid #d7d0e6;
         background: #fff; color: var(--ink); border-radius: 14px; padding: 0.3em 0.7em; cursor: pointer; }
  .opt.on { background: var(--pick); border-color: #e0a800; }
  #bBack { font: inherit; font-size: min(4vh, 5vw); font-weight: 700; width: 100%; cursor: pointer;
           background: #ff8a3d; color: #fff; border: 4px solid transparent; border-radius: 18px;
           padding: 0.3em; box-shadow: 0 5px 0 #d1621b; }
  #bBack.sel { border-color: var(--pick); }

  /* ---------- Playing ---------- */
  #bHome { position: fixed; left: 14px; top: 14px; font-size: 34px; width: 64px; height: 64px;
           border-radius: 50%; border: 0; background: rgba(255,255,255,0.85); cursor: pointer;
           box-shadow: 0 4px 0 rgba(0,0,0,0.15); }

  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .panel { max-height: 94vh; overflow-y: auto; }

  /* Phones held upright: buttons on top of each other, settings across the top */
  @media (max-aspect-ratio: 1/1) {
    #menu { padding-top: 7vh; }
    .btns { flex-direction: column; gap: 2.2vh; margin-top: 3vh; align-items: stretch; }
    .big { font-size: min(5vh, 8.5vw); }
    #settings { align-items: flex-start; padding: 2vh 3vw 0; }
    .panel { width: 100%; max-height: 60vh; padding: 2vh 4vw; }
    .panel h2 { font-size: min(4.5vh, 8vw); margin-bottom: 1.2vh; }
    .lab { font-size: min(2.6vh, 5vw); }
    .opt { font-size: min(2.5vh, 4.6vw); }
    .opts { gap: 2vw; }
    #bBack { font-size: min(3.2vh, 6vw); }
  }
  /* Phones held sideways: everything a bit bigger for fingers */
  @media (max-height: 500px) and (min-aspect-ratio: 1/1) {
    .panel { padding: 2vh 2vw; width: min(560px, 56vw); }
    .panel h2 { font-size: 7vh; margin-bottom: 1vh; }
    .row { padding: 0.8vh 1vw; margin-bottom: 1vh; }
    .lab { font-size: 4.4vh; margin-bottom: 0.4vh; }
    .opt { font-size: 4.3vh; padding: 0.25em 0.6em; }
    #bBack { font-size: 6vh; }
    #bHome { width: 52px; height: 52px; font-size: 28px; left: 10px; top: 10px; }
  }
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#5bb8f5"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Trampoline"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(e){console.warn('sw',e)})})}</script></head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <h1 class="title" id="title"></h1>
  <div class="btns">
    <button class="big" id="bPlay">▶ Play</button>
    <button class="big" id="bSet">⚙️ Settings</button>
  </div>
</div>

<div id="settings" class="hidden">
  <div class="panel">
    <h2>⚙️ Settings</h2>
    <div class="row" data-key="who">
      <div class="lab">Who bounces?</div>
      <div class="opts">
        <button class="opt" data-v="duck">🦆 Duck</button>
        <button class="opt" data-v="robot">🤖 Robot</button>
        <button class="opt" data-v="frog">🐸 Frog</button>
      </div>
    </div>
    <div class="row" data-key="color">
      <div class="lab">Trampoline colour</div>
      <div class="opts">
        <button class="opt" data-v="red">Red</button>
        <button class="opt" data-v="blue">Blue</button>
        <button class="opt" data-v="green">Green</button>
        <button class="opt" data-v="rainbow">🌈 Rainbow</button>
      </div>
    </div>
    <div class="row" data-key="sound">
      <div class="lab">Sound</div>
      <div class="opts">
        <button class="opt" data-v="on">🔊 On</button>
        <button class="opt" data-v="off">🔇 Off</button>
      </div>
    </div>
    <button id="bBack">⬅ Back</button>
  </div>
</div>

<button id="bHome" class="hidden" title="Back to the menu">🏠</button>

<script>
"use strict";

// ================= Saved stuff (localStorage keys start with "trampoline") =================
const SAVE_SETTINGS = "trampoline-settings";
const SAVE_BEST = "trampoline-best";
const settings = { who: "duck", color: "red", sound: "on" };
try { Object.assign(settings, JSON.parse(localStorage.getItem(SAVE_SETTINGS) || "{}")); } catch (e) {}
let best = 0;
try { best = Number(localStorage.getItem(SAVE_BEST)) || 0; } catch (e) {}
function saveSettings() { try { localStorage.setItem(SAVE_SETTINGS, JSON.stringify(settings)); } catch (e) {} }
function saveBest() { try { localStorage.setItem(SAVE_BEST, String(Math.round(best))); } catch (e) {} }

// ================= Bounce tuning =================
const BOUNCE = {
  maxPower: 21,                         // 21 good bounces in a row reaches the top of space
  height: p => 2.5 * Math.pow(1.27, p), // metres for each power level (power 20 is about 300 m)
  airTime: p => 0.85 + 0.3 * p,         // seconds in the air
  zone: 0.42,                           // seconds before landing when SPACE counts
  squish: 0.16,                         // seconds on the mat
  dip: p => 0.35 + 0.02 * p,            // how far the mat stretches down (metres)
};
const SPACE_M = 300;                    // where space starts
const PX = 40;                          // screen units per metre
const VH = 720;                         // every screen is 720 units tall

// ================= Screen =================
const cv = document.getElementById("c");
let ctx = cv.getContext("2d");
let scale = 1, VW = 1280, cacheGen = 0;   // cacheGen goes up on resize so the saved pictures get drawn again
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * dpr);
  cv.height = Math.round(innerHeight * dpr);
  scale = cv.height / VH;
  VW = cv.width / scale;
  cacheGen++;
}
addEventListener("resize", resize);
resize();

// ================= Game state =================
let screen = "menu";      // menu | settings | play
let time = 0;
const J = { y: 3, vy: 0, g: 20, phase: "air", squishT: 0, p: 0, pressed: "none", peakDone: true, goodCount: 0 };
let cam = 0;              // camera height in metres
let trampX = VW / 2;
let bestMark = 0, shownNewBest = false, milestones = {};
let popups = [], confetti = [], banner = null, hintOn = true, speedOff = 0;

function resetJump() {
  Object.assign(J, { y: 3, vy: 0, g: 20, phase: "air", squishT: 0, p: 0, pressed: "none", peakDone: true, goodCount: 0 });
  cam = 0; popups = []; confetti = []; banner = null; milestones = {}; hintOn = true;
  bestMark = best; shownNewBest = false;
}

function timeToLand() {
  // falling: y + vy t - g t^2 / 2 = 0
  const v = -J.vy;
  return (-v + Math.sqrt(v * v + 2 * J.g * Math.max(0, J.y))) / J.g;
}
function inZone() {
  if (J.pressed !== "none") return false;
  if (J.phase === "squish") return true;
  return J.vy < 0 && timeToLand() <= BOUNCE.zone;
}

function press() {
  if (screen !== "play") return;
  if (J.pressed !== "none") return;
  if (J.phase === "squish") { J.pressed = "good"; return; }
  if (J.vy > 0) return;                     // still going up: nothing happens
  if (timeToLand() <= BOUNCE.zone) J.pressed = "good";
  else {
    J.pressed = "early";
    popup("Too soon! Wait for it...", "#ffffff");
    sfx.bwomp();
  }
}

function launch() {
  const demo = screen !== "play";
  if (demo) J.pressed = J.p < 2 ? "good" : "none";
  const good = J.pressed === "good";
  if (good) {
    J.p = Math.min(J.p + 1, BOUNCE.maxPower);
    if (!demo) {
      J.goodCount++;
      if (J.goodCount >= 1) hintOn = false;
      const words = ["Boing!", "Nice!", "Great!", "Super!", "Wow!", "Yes!", "Boing boing!"];
      popup(J.p === BOUNCE.maxPower ? "MEGA BOUNCE!" : words[Math.floor(Math.random() * words.length)], "#ffe14d");
    }
  } else {
    J.p = Math.max(J.p - 1, 0);
  }
  if (J.p <= 2) {
    // back near the bottom: the cheers can happen again on the way up
    milestones = {};
    if (shownNewBest) { shownNewBest = false; bestMark = best; }
  }
  sfx.boing(J.p, good && !demo);
  const h = BOUNCE.height(J.p), T = BOUNCE.airTime(J.p);
  J.g = 8 * h / (T * T);
  J.vy = 4 * h / T;
  J.y = 0;
  J.phase = "air";
  J.pressed = "none";
  J.peakDone = false;
}

function updateJump(dt) {
  if (J.phase === "air") {
    J.vy -= J.g * dt;
    J.y += J.vy * dt;
    if (screen === "play") {
      if (bestMark >= 5 && !shownNewBest && J.y > bestMark) {
        shownNewBest = true;
        showBanner("New best! 🎉");
        burstConfetti();
        sfx.yay();
      }
      checkMilestones();
    }
    if (!J.peakDone && J.vy <= 0) {
      J.peakDone = true;
      if (screen === "play" && J.y > best) { best = J.y; saveBest(); }
    }
    if (J.y <= 0 && J.vy < 0) {
      J.y = 0; J.phase = "squish"; J.squishT = 0;
    }
  } else {
    J.squishT += dt;
    J.y = -BOUNCE.dip(J.p) * Math.sin(Math.PI * Math.min(1, J.squishT / BOUNCE.squish));
    if (J.squishT >= BOUNCE.squish) launch();
  }
}

const MILESTONES = [
  { h: 30,      text: "Up in the clouds! ☁️" },
  { h: 110,     text: "Higher than a hot air balloon! 🎈" },
  { h: 190,     text: "Higher than a plane! ✈️" },
  { h: SPACE_M, text: "SPACE! 🚀" },
];
function checkMilestones() {
  for (const m of MILESTONES) {
    if (J.y >= m.h && !milestones[m.h]) {
      milestones[m.h] = true;
      showBanner(m.text);
      sfx.yay();
    }
  }
}

function popup(text, color) {
  popups.push({ text, color, x: trampX, y: screenY(J.y) - 110, life: 1.3 });
}
function showBanner(text) { banner = { text, life: 2.0 }; }
function burstConfetti() {
  const cols = ["#ff5c5c", "#ffd23f", "#3ccf5a", "#4aa8ff", "#c06bff", "#ff8a3d"];
  for (let i = 0; i < 90; i++) {
    confetti.push({ x: VW / 2 + (Math.random() - 0.5) * 200, y: VH * 0.3,
      vx: (Math.random() - 0.5) * 700, vy: -200 - Math.random() * 500,
      r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 12,
      c: cols[i % cols.length], life: 2 + Math.random() });
  }
}

// ================= Sounds (made right here, no files) =================
let actx = null;
function audio() {
  if (settings.sound !== "on") return null;
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sfx = {
  boing(p, good) {
    if (screen !== "play") return;
    const a = audio(); if (!a) return;
    const t0 = a.currentTime, base = good ? 140 + p * 12 : 110;
    const o = a.createOscillator(), g = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(base, t0);
    o.frequency.exponentialRampToValueAtTime(base * (good ? 3.2 : 1.8), t0 + 0.28);
    lfo.frequency.value = 22; lg.gain.value = base * 0.25;
    lfo.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(good ? 0.3 : 0.15, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.4);
    o.connect(g).connect(a.destination);
    o.start(t0); lfo.start(t0); o.stop(t0 + 0.45); lfo.stop(t0 + 0.45);
  },
  bwomp() { tone("triangle", 220, 90, 0.3, 0.15); },
  click() { tone("square", 660, 880, 0.07, 0.06); },
  yay()   { [523, 659, 784, 1047].forEach((f, i) => tone("triangle", f, f * 1.01, 0.18, 0.15, i * 0.09)); },
};

// ================= Drawing helpers =================
function screenY(m) { return (VH - 190) - (m - cam) * PX; }   // metres -> screen units
function lerp(a, b, t) { return a + (b - a) * t; }
function mix(c1, c2, t) {
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const r = Math.round(lerp(a >> 16, b >> 16, t)), g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, t)),
        bl = Math.round(lerp(a & 255, b & 255, t));
  return `rgb(${r},${g},${bl})`;
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function rand(seed) { const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function ellipse(x, y, rx, ry, fill, rot = 0) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill();
}
function rrect(x, y, w, h, r, fill) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
}
function poly(pts, fill) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
// a little random-number maker that gives the same numbers every time (so pictures never change)
function rng(seed) {
  let s = (seed * 9301 + 49297) % 233280;
  return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}
function LX() { return VW < 760 ? -1 : 1; }          // which side the sun is on (-1: left, on an upright phone)
function CS() { return clamp(scale, 1, 2); }         // how sharp the saved pictures are

// ---------- Pictures that are drawn once and then just stamped (fast on phones) ----------
const CACHE = new Map();
function cached(name, key, build) {
  const e = CACHE.get(name);
  if (e && e.key === key && e.gen === cacheGen) return e.val;
  const val = build();
  const entry = { key, gen: cacheGen, val };
  CACHE.set(name, entry);
  // stamping a finished picture is quicker when it is an ImageBitmap, so swap them in as soon as they are ready
  if (typeof createImageBitmap === "function") {
    const up = (obj, prop) => {
      const src = obj[prop];
      if (src instanceof HTMLCanvasElement) createImageBitmap(src).then(b => { if (obj[prop] === src) obj[prop] = b; }).catch(() => {});
    };
    if (val instanceof HTMLCanvasElement) up(entry, "val");
    else if (val && typeof val === "object") for (const p of Object.keys(val)) up(val, p);
  }
  return val;
}
// draw something into its own little canvas; w and h are in game units, k is how many pixels per unit
function sprite(w, h, k, fn) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.ceil(w * k)); c.height = Math.max(1, Math.ceil(h * k));
  const old = ctx; ctx = c.getContext("2d"); ctx.setTransform(k, 0, 0, k, 0, 0);
  try { fn(); } finally { ctx = old; }
  return c;
}
// a soft round blob of colour (centre solid, edge clear)
function puff(x, y, r, rgb, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(0.55, `rgba(${rgb},${a * 0.75})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
// a soft flat shadow or glow (an ellipse that fades out)
function softEllipse(cx, cy, rx, ry, rgb, a) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(0.55, `rgba(${rgb},${a * 0.6})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(-rx, -rx, rx * 2, rx * 2); ctx.restore();
}
// steel-tube look: dark outline, mid metal, bright highlight on the sun side
function tube(x1, y1, x2, y2, w, L) {
  ctx.lineCap = "round";
  ctx.strokeStyle = "#2b303b"; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = "#8590a3"; ctx.lineWidth = w * 0.68; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = "#e8eef8"; ctx.lineWidth = Math.max(1, w * 0.22); ctx.beginPath();
  ctx.moveTo(x1 + L * w * 0.2, y1); ctx.lineTo(x2 + L * w * 0.2, y2); ctx.stroke();
}

// ---------- Sky colour by height ----------
const SKY = [
  { h: 0,   top: "#3a8ee0", bot: "#cfe9fb" },
  { h: 120, top: "#2a6fcc", bot: "#86c0ee" },
  { h: 230, top: "#14357f", bot: "#2d63b8" },
  { h: 270, top: "#0a1646", bot: "#16296a" },
  { h: 310, top: "#02030c", bot: "#0a1030" },
];
function skyAt(h) {
  for (let i = 0; i < SKY.length - 1; i++) {
    const a = SKY[i], b = SKY[i + 1];
    if (h <= b.h) { const t = clamp((h - a.h) / (b.h - a.h), 0, 1); return [mix(a.top, b.top, t), mix(a.bot, b.bot, t)]; }
  }
  return [SKY[SKY.length - 1].top, SKY[SKY.length - 1].bot];
}

function sunSprite() {
  return cached("sun", 0, () => sprite(640, 640, 1, () => {
    const c = 320;
    let g = ctx.createRadialGradient(c, c, 0, c, c, 320);
    g.addColorStop(0, "rgba(255,250,215,0.95)"); g.addColorStop(0.1, "rgba(255,244,190,0.75)");
    g.addColorStop(0.22, "rgba(255,232,150,0.34)"); g.addColorStop(0.5, "rgba(255,226,150,0.1)"); g.addColorStop(1, "rgba(255,226,150,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, 640, 640);
    // soft glare streaks

    // chimney

    ctx.fillStyle = "#a9553f"; ctx.fillRect(cx0, wallTop - 96, 26, 60);
    for (let y = wallTop - 96; y < wallTop - 36; y += 6) { ctx.fillStyle = "rgba(255,225,200,0.3)"; ctx.fillRect(cx0, y + 5, 26, 1); }
    g = ctx.createLinearGradient(cx0, 0, cx0 + 26, 0); g.addColorStop(L > 0 ? 0 : 1, "rgba(40,10,10,0.4)"); g.addColorStop(L > 0 ? 1 : 0, "rgba(255,240,210,0.2)");
    ctx.fillStyle = g; ctx.fillRect(cx0, wallTop - 96, 26, 60);

    ellipse(hx, wallTop - 62, 11, 11, "#fbf6ee"); ellipse(hx, wallTop - 62, 8, 8, "#8cc2ec"); ellipse(hx - 2, wallTop - 64, 3, 2, "rgba(255,255,255,0.7)");

    const gap0 = hx - W2 - 6, gap1 = hx + W2 + 6;
    ctx.fillStyle = "#3b2a18"; ctx.fillRect(0, F - 52, Math.max(0, gap0), 52); ctx.fillRect(gap1, F - 52, VW, 52);
    for (let x = -6, i = 0; x < VW + 20; x += 22, i++) {

      const tone = [[236, 204, 154], [224, 190, 138], [214, 178, 124]][Math.floor(r() * 3)];
      const lo = `rgb(${tone[0] - 40},${tone[1] - 46},${tone[2] - 46})`, hi = `rgb(${Math.min(255, tone[0] + 14)},${Math.min(255, tone[1] + 14)},${Math.min(255, tone[2] + 10)})`;

      ctx.fillStyle = wg; ctx.fillRect(sx - 55, sb - 76, 110, 76);

      for (let x = sx - 55; x <= sx + 55; x += 11) { ctx.beginPath(); ctx.moveTo(x, sb - 76); ctx.lineTo(x, sb); ctx.stroke(); }
      poly([[sx - 66, sb - 74], [sx - 52, sb - 100], [sx + 52, sb - 100], [sx + 66, sb - 74]], "#5a4a3e");
      ctx.fillStyle = "rgba(255,255,255,0.14)"; ctx.fillRect(sx - 60, sb - 80, 120, 3);
      ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 1; for (let y = sb - 96; y < sb - 76; y += 5) { ctx.beginPath(); ctx.moveTo(sx - 60 + (sb - 76 - y) * 0.4, y); ctx.lineTo(sx + 60 - (sb - 76 - y) * 0.4, y); ctx.stroke(); }
      softShadow(sx, sb - 72, 62, 5, 0.3);
      rrect(sx - 28, sb - 58, 34, 58, 2, "#f3f0e6"); ctx.fillStyle = "#4e6e5a"; ctx.fillRect(sx - 25, sb - 55, 28, 55);
      ctx.strokeStyle = "#f3f0e6"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(sx - 25, sb - 55); ctx.lineTo(sx + 3, sb - 2); ctx.stroke();
      ellipse(sx - 1, sb - 28, 2, 2, "#e8c040");
      rrect(sx + 16, sb - 52, 28, 22, 2, "#f3f0e6");
      const sg = ctx.createLinearGradient(0, sb - 50, 0, sb - 32); sg.addColorStop(0, "#cfeaff"); sg.addColorStop(1, "#6fa4d0");
      ctx.fillStyle = sg; ctx.fillRect(sx + 18, sb - 50, 24, 18);
    }
    gardenTree(lay.tx, F + 12, 150, 100, 17, L, true);
    for (const [bx, bs, sd] of [[hx - 150, 1.0, 5], [hx + 152, 0.9, 6], [lay.tx - 118, 0.8, 7]]) {

    }
    // --- flowers: a border along the fence and some scattered about ---
    const flw = [];
    for (let i = 0; i < Math.round(70 * VW / 1280); i++) flw.push({ x: r() * VW, y: F + 6 + r() * 16, s: 0.55 + r() * 0.2, t: Math.floor(r() * 3), c: FLOWER_COLS[Math.floor(r() * 6)] });
    for (let i = 0; i < Math.round(34 * VW / 1280); i++) {

    flw.sort((a, b) => a.y - b.y);
    for (const f of flw) flower(f.x, f.y, f.s, f.t, f.c, L);
  });
}

function buildGardenFar() {
  const k = Math.min(CS(), 1.5), L = LX();
  return sprite(VW, FARH, k, () => {
    const F = FARF, r = rng(55);
    const hill = (base, amp, col, seed) => {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, FARH);
      for (let x = 0; x <= VW + 20; x += 20) ctx.lineTo(x, F - base - Math.sin(x / 170 + seed) * amp - Math.sin(x / 61 + seed * 2) * amp * 0.3);
      ctx.lineTo(VW, FARH); ctx.fill();
    };
    hill(96, 14, "#c4d8dc", 1);
    for (let i = 0; i < Math.round(VW / 260) + 1; i++) {                 // far-away rooftops
      const x = (i + 0.2 + r() * 0.6) * 260 + 20, w = 70 + r() * 40, wh = 28 + r() * 12, base = F - 66;
      ctx.fillStyle = "#cdbcb8"; ctx.fillRect(x - w / 2, base - wh, w, wh + 40);
      ctx.fillStyle = "#8f8590"; poly([[x - w / 2 - 6, base - wh + 2], [x, base - wh - 26], [x + w / 2 + 6, base - wh + 2]]); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fillRect(x - w / 4, base - wh + 8, 9, 10); ctx.fillRect(x + w / 4 - 9, base - wh + 8, 9, 10);
      ctx.fillStyle = "#a8837c"; ctx.fillRect(x + w / 4, base - wh - 20, 8, 16);
    }
    const trees = (base, rad, col, hi, seed, step) => {
      const rr = rng(seed);
      ctx.fillStyle = col;
      for (let x = -20; x < VW + 40; x += step * (0.7 + rr() * 0.6)) { const rad2 = rad * (0.7 + rr() * 0.6); ctx.beginPath(); ctx.arc(x, F - base + rad2 * 0.2 - rr() * rad * 0.5, rad2, 0, 7); ctx.fill(); }
      ctx.fillRect(0, F - base + rad * 0.5, VW, FARH);
      ctx.fillStyle = hi; ctx.globalAlpha = 0.5;
      for (let x = -10; x < VW + 40; x += step * 1.3) { ctx.beginPath(); ctx.arc(x + L * rad * 0.3, F - base - rad * 0.2 - rr() * rad * 0.4, rad * 0.55, 0, 7); ctx.fill(); }
      ctx.globalAlpha = 1;
    };
    trees(56, 28, "#9cc2ae", "#bfdccb", 3, 38);
    trees(34, 26, "#7fb48c", "#a8d3a6", 4, 34);
    const hg = ctx.createLinearGradient(0, F - 120, 0, F);                // morning haze
    hg.addColorStop(0, "rgba(235,245,248,0)"); hg.addColorStop(1, "rgba(235,245,248,0.35)");
    ctx.fillStyle = hg; ctx.fillRect(0, F - 120, VW, 120);
  });
}

function buildGardenFg() {
  const k = Math.min(CS(), 1.5), L = LX();
  return sprite(VW, 150, k, () => {
    const r = rng(91);
    for (const x0 of [-20, VW - 100]) {
      for (let i = 0; i < 26; i++) {
        const bx = x0 + r() * 120, h = 40 + r() * 90, w = 3 + r() * 4, lean = (r() - 0.5) * 0.7;
        const g = ctx.createLinearGradient(0, 150, 0, 150 - h); g.addColorStop(0, "#1f5f26"); g.addColorStop(0.6, "#3f9c3a"); g.addColorStop(1, "#86d256");
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(bx - w, 152);
        ctx.quadraticCurveTo(bx - w * 0.4 + lean * h * 0.4, 150 - h * 0.55, bx + lean * h, 150 - h);
        ctx.quadraticCurveTo(bx + w * 0.4 + lean * h * 0.4, 150 - h * 0.5, bx + w, 152); ctx.fill();
      }
      for (let i = 0; i < 3; i++) flower(x0 + 20 + r() * 80, 154, 1.7 + r() * 0.5, i % 3, FLOWER_COLS[Math.floor(r() * 6)], L);

function drawGarden() {
  const F = screenY(0) - 15;                        // where the fence stands on the screen
  if (F - GF > VH) return;
  const far = cached("gfar", VW, buildGardenFar), mid = cached("gmid", VW, buildGardenMid);
  const farY = F - 0.18 * cam * PX - FARF;           // the far hills sink slower (they are far away)
  const farRows = Math.min(FARH, Math.floor(FARF - 48 + 0.18 * cam * PX + 6));   // lower rows are hidden behind the fence and lawn
  if (farY < VH && farRows > 0) ctx.drawImage(far, 0, 0, far.width, far.height * farRows / FARH, 0, farY, VW, farRows);
  const y0 = F - GF;
  ctx.drawImage(mid, 0, y0, VW, GH);
  const yb = y0 + GH;
  if (yb < VH) ctx.drawImage(mid, 0, mid.height - 3, mid.width, 3, 0, yb - 0.5, VW, VH - yb + 1);   // grass goes on below
}
function drawForeground() {
  const y = VH - 150 + cam * PX * 1.25;             // tall grass in front moves faster
  if (y + 150 < 0 || y > VH) return;
  ctx.drawImage(cached("gfg", VW, buildGardenFg), 0, y, VW, 150);
}

// ================= The trampoline =================
function rimStyle(x0, x1) {
  if (settings.color === "rainbow") {
    const gr = ctx.createLinearGradient(x0, 0, x1, 0);
    ["#ff4d4d", "#ff9f1c", "#ffe14d", "#3ccf5a", "#4aa8ff", "#8a5cff"].forEach((c, i) => gr.addColorStop(i / 5, c));
    return gr;
  }
  return { red: "#e8383a", blue: "#2f7fe4", green: "#27b04a" }[settings.color] || "#e8383a";
}
function weaveTile() {
  return cached("weave", 0, () => sprite(6, 6, 2, () => {
    ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fillRect(0, 0, 3, 3); ctx.fillRect(3, 3, 3, 3);
    ctx.fillStyle = "rgba(0,0,0,0.18)"; ctx.fillRect(3, 0, 3, 3); ctx.fillRect(0, 3, 3, 3);
  }));
}
// All the still parts of the trampoline are drawn once: the back (legs, shadow, padded ring), the black mat, and the front (springs, frame).
function trampSprites(w, L) {
  return cached("tramp", w + "|" + settings.color + "|" + L + "|" + CS(), () => {
    const R = w / 2 + 8, rin = w / 2 - 10, PW = 12, SH = 20, FY = PW + SH, FRA = R - 8, FRB = 31, GY = 100, GRB = 22;
    const bw = Math.ceil(R * 2.6), bh = 190, ox = bw / 2, oy = 55, k = CS();
    const legs = [];
    for (const s of [-1, 1]) for (const fr of [-1, 1]) {
      const t = fr > 0 ? Math.PI / 2 + s * 0.8 : -Math.PI / 2 + s * 0.8;
      legs.push({ ax: FRA * Math.cos(t), ay: FY + FRB * Math.sin(t), fx: (FRA + 4) * Math.cos(t), fy: GY + GRB * Math.sin(t), front: fr > 0 });
    }
    const leg = (l) => { tube(l.ax, l.ay, l.fx, l.fy, 6.5, L); ellipse(l.fx, l.fy + 1.5, 6.5, 2.8, "#1b1e25"); };
    const paintPad = () => {
      ctx.fillStyle = rimStyle(-R, R); ctx.fillRect(-R - 4, -40, 2 * R + 8, 80);
      ctx.strokeStyle = "rgba(0,0,0,0.32)"; ctx.lineWidth = 9; ctx.beginPath(); ctx.ellipse(0, 0, R, 34, 0, 0, 7); ctx.stroke();
      ctx.strokeStyle = "rgba(0,0,0,0.36)"; ctx.lineWidth = 7; ctx.beginPath(); ctx.ellipse(0, 0, rin, 22, 0, 0, 7); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 8; ctx.beginPath(); ctx.ellipse(0, 0, (R + rin) / 2, 28, 0, 0, 7); ctx.stroke();
      const hg = ctx.createLinearGradient(-R, 0, R, 0);
      hg.addColorStop(L > 0 ? 0 : 1, "rgba(255,255,255,0.1)"); hg.addColorStop(L > 0 ? 1 : 0, "rgba(255,255,255,0.8)");
      ctx.strokeStyle = hg; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.ellipse(0, -1.5, (R + rin) / 2, 27, 0, 0, 7); ctx.stroke();
      ctx.setLineDash([5, 4]); ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(0, 2, (R + rin) / 2, 28, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    };
    const ringClip = () => { ctx.beginPath(); ctx.ellipse(0, 0, R, 34, 0, 0, 7); ctx.ellipse(0, 0, rin, 22, 0, 0, 7); ctx.clip("evenodd"); };

    const back = sprite(bw, bh, k, () => {
      ctx.translate(ox, oy);
      softEllipse(-L * 30, GY + 4, R * 1.15, 30, "5,25,10", 0.5);
      softEllipse(0, GY + 2, R * 0.9, 16, "5,20,8", 0.6);
      for (const l of legs) if (!l.front) leg(l);
      ctx.save(); ringClip(); paintPad(); ctx.restore();
    });

    const front = sprite(bw, bh, k, () => {
      ctx.translate(ox, oy);
      for (const l of legs) if (l.front) leg(l);
      // dark space under the padding, with the springs inside it
      ctx.beginPath(); ctx.ellipse(0, PW, R, 34, 0, 0, Math.PI); ctx.ellipse(0, FY, FRA, FRB, 0, Math.PI, 0, true); ctx.closePath();
      ctx.fillStyle = "rgba(6,8,14,0.85)"; ctx.fill();
      const N = Math.round(R / 5.2);
      for (let i = 0; i < N; i++) {
        const u = (i + 0.5) / N * Math.PI, tx = Math.cos(u) * (R - 4), ty = Math.sin(u) * 33 + PW - 2, bx = Math.cos(u) * (FRA - 1), by = Math.sin(u) * (FRB - 1) + FY - 1;
        ctx.beginPath(); ctx.moveTo(tx, ty);
        for (let j = 1; j <= 7; j++) { const f = j / 8, z = (j % 2 ? 2.4 : -2.4); ctx.lineTo(lerp(tx, bx, f) + z, lerp(ty, by, f)); }
        ctx.lineTo(bx, by);
        ctx.lineJoin = "round"; ctx.strokeStyle = "#555d6c"; ctx.lineWidth = 2.6; ctx.stroke();
        ctx.strokeStyle = "#c4cede"; ctx.lineWidth = 1.1; ctx.stroke();
      }
      // steel frame tube
      for (const [lw, col, off] of [[7, "#2b303b", 0], [4.6, "#8590a3", 0], [1.5, "#eef3fb", -1.2]]) {
        ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.ellipse(0, FY + off, FRA, FRB, 0, 0, Math.PI); ctx.stroke();
      }
      // padded wall
      ctx.beginPath(); ctx.ellipse(0, 0, R, 34, 0, 0, Math.PI); ctx.ellipse(0, PW, R, 34, 0, Math.PI, 0, true); ctx.closePath();
      ctx.fillStyle = rimStyle(-R, R); ctx.fill();
      let g = ctx.createLinearGradient(0, 0, 0, 46); g.addColorStop(0, "rgba(0,0,0,0.1)"); g.addColorStop(1, "rgba(0,0,0,0.5)");
      ctx.fillStyle = g; ctx.fill();
      g = ctx.createLinearGradient(-R, 0, R, 0); g.addColorStop(L > 0 ? 0 : 1, "rgba(0,0,0,0.3)"); g.addColorStop(L > 0 ? 1 : 0, "rgba(255,255,255,0.22)");
      ctx.fillStyle = g; ctx.fill();
      // front half of the padded ring (it hides the bouncer's feet)
      ctx.save(); ctx.beginPath(); ctx.rect(-R - 6, 0, 2 * R + 12, 60); ctx.clip(); ringClip(); paintPad(); ctx.restore();
    });

    const mat = sprite(2 * rin + 8, 56, k, () => {
      ctx.translate(rin + 4, 28);
      ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, rin, 22, 0, 0, 7); ctx.clip();
      ctx.save(); ctx.scale(1, 22 / rin);
      const g = ctx.createRadialGradient(L * rin * 0.3, -rin * 0.35, 0, 0, 0, rin * 1.15);
      g.addColorStop(0, "#4a5262"); g.addColorStop(0.35, "#2a2f3b"); g.addColorStop(1, "#0b0d12");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rin + 1, 0, 7); ctx.fill();
      ctx.setLineDash([6, 5]); ctx.strokeStyle = "rgba(180,190,210,0.28)"; ctx.lineWidth = 1.2;
      for (const f of [0.93, 0.5]) { ctx.beginPath(); ctx.arc(0, 0, rin * f, 0, 7); ctx.stroke(); }
      ctx.setLineDash([]); ctx.strokeStyle = "rgba(180,190,210,0.2)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, rin * 0.1, 0, 7); ctx.stroke();
      for (let i = 0; i < 64; i++) { const a = i / 64 * 6.283; ellipse(Math.cos(a) * rin * 0.965, Math.sin(a) * rin * 0.965, 1.5, 1.5, "rgba(205,212,226,0.55)"); }
      ctx.restore();
      ctx.globalAlpha = 0.35; ctx.fillStyle = ctx.createPattern(weaveTile(), "repeat");
      ctx.beginPath(); ctx.ellipse(0, 0, rin, 22, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = "rgba(0,0,0,0.6)"; ctx.lineWidth = 8; ctx.beginPath(); ctx.ellipse(0, 0, rin, 22, 0, 0, 7); ctx.stroke();
      ctx.restore();
    });
    return { back, front, mat, bw, bh, ox, oy, rin, R };

function drawBouncer(x, y) {
  // squash on the mat, stretch when flying fast
  let sx = 1, sy = 1;
  if (J.phase === "squish") {
    const k = Math.sin(Math.PI * Math.min(1, J.squishT / BOUNCE.squish));
    sy = 1 - 0.3 * k; sx = 1 + 0.25 * k;
  } else {
    const k = clamp(Math.abs(J.vy) / 60, 0, 0.18);
    sy = 1 + k; sx = 1 - k * 0.6;

  const up = J.phase === "air" && J.vy > 0;

  ctx.scale(sx, sy);
  if (settings.who === "robot") drawRobot(up);
  else if (settings.who === "frog") drawFrog(up);

  ctx.restore();
}

    ellipse(0, -22, 22, 16, g);
    ellipse(-6, -28, 9, 3, "rgba(255,255,255,0.4)", -0.3);
    // wet shine on the back
    ellipse(-14, -41, 12, 3.6, "rgba(255,255,255,0.34)", -0.45);
    ellipse(-17.5, -43, 3, 1.6, "rgba(255,255,255,0.85)", -0.45); ellipse(8, -47, 2.2, 1.2, "rgba(255,255,255,0.7)", -0.2);
    ctx.strokeStyle = "rgba(230,255,200,0.55)"; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.ellipse(0, -28, 33, 25, 0, L > 0 ? -1.2 : Math.PI + 0.3, L > 0 ? 0.1 : Math.PI + 1.5); ctx.stroke();
    // bulging eyes
    for (const ex of [-14, 14]) {
      skin(ex, -52, 12.5, 12);
      ellipse(ex - 1.5, -58.5, 5, 2, "rgba(255,255,255,0.45)", -0.3);
      ctx.strokeStyle = "rgba(25,95,30,0.7)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ex, -53, 11.4, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();    // eyelid line
      g = ctx.createRadialGradient(ex, -53, 1, ex, -53, 8.5); g.addColorStop(0, "#fffef4"); g.addColorStop(1, "#ece5c0");
      ellipse(ex, -53, 8, 8, g);
      g = ctx.createRadialGradient(ex + 1, -53, 1, ex + 1, -53, 6); g.addColorStop(0, "#ffd84a"); g.addColorStop(0.7, "#f0a81c"); g.addColorStop(1, "#b86a10");
      ellipse(ex + 1, -53, 5.6, 5.6, g);
      ellipse(ex + 1.2, -53, 3.4, 3.8, "#16101f");
      ellipse(ex + 2.8, -55.2, 1.8, 1.8, "rgba(255,255,255,0.97)"); ellipse(ex - 0.6, -51, 0.9, 0.9, "rgba(255,255,255,0.6)");
    }
    // smile, nostrils, rosy cheeks
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(210,255,170,0.55)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, -34.3, 12, 0.3, Math.PI - 0.3); ctx.stroke();
    ctx.strokeStyle = "#1f4a1c"; ctx.lineWidth = 2.8; ctx.beginPath(); ctx.arc(0, -36, 12, 0.3, Math.PI - 0.3); ctx.stroke();
    ellipse(-11.5, -32.5, 1.3, 1.3, "#1f4a1c"); ellipse(11.5, -32.5, 1.3, 1.3, "#1f4a1c");
    ellipse(-2.5, -45, 1, 0.8, "#1f5a22"); ellipse(2.5, -45, 1, 0.8, "#1f5a22");
    for (const cx of [-22, 22]) { puff(cx, -36, 7, "255,140,170", 0.7); }
  }));
}
function drawFrog(up) {
  const leg = up ? 10 : 0;
  ctx.drawImage(frogSprite(LX(), leg), -BX, -BY, 140, 140);
}

// ================= HUD while playing =================
let touchMode = matchMedia("(pointer: coarse)").matches;   // phones and tablets: tap instead of SPACE
addEventListener("touchstart", () => { touchMode = true; }, { passive: true });
addEventListener("keydown", () => { touchMode = false; });

function drawHUD() {
  const h = Math.max(0, J.y);
  const narrow = VW < 760;                                   // a phone held upright
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.font = "700 64px Fredoka, sans-serif";
  ctx.lineWidth = 10; ctx.strokeStyle = "rgba(43,33,64,0.6)";
  const label = Math.floor(h) + " m";
  ctx.strokeText(label, VW / 2, 18); ctx.fillStyle = "#fff"; ctx.fillText(label, VW / 2, 18);

  // bounce power bar
  const bw = Math.min(360, VW * 0.5), bx = VW / 2 - bw / 2, by = 96;
  rrect(bx - 4, by - 4, bw + 8, 26, 13, "rgba(43,33,64,0.45)");
  const f = J.p / BOUNCE.maxPower;
  if (f > 0) {
    const gr = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    ["#3ccf5a", "#ffe14d", "#ff9f1c", "#ff4d4d", "#c06bff"].forEach((c, i) => gr.addColorStop(i / 4, c));
    rrect(bx, by, Math.max(18, bw * f), 18, 9, gr);
  }
  ctx.font = "600 20px Fredoka, sans-serif"; ctx.fillStyle = "#fff";
  ctx.lineWidth = 5; ctx.lineJoin = "round"; ctx.strokeStyle = "rgba(43,33,64,0.65)";
  ctx.strokeText("Bounce power", VW / 2, by + 24); ctx.fillText("Bounce power", VW / 2, by + 24);

  // best (under the power bar on an upright phone)
  const bestText = "🏆 Best " + Math.floor(best) + " m";
  ctx.font = `700 ${narrow ? 26 : 30}px Fredoka, sans-serif`;
  ctx.textAlign = narrow ? "center" : "right";
  const bx2 = narrow ? VW / 2 : VW - 20, by2 = narrow ? 156 : 22;
  ctx.lineWidth = 6; ctx.strokeText(bestText, bx2, by2);
  ctx.fillStyle = "#ffe14d"; ctx.fillText(bestText, bx2, by2);

  // height ladder on the right
  const top = narrow ? 340 : 90, bot = narrow ? 500 : VH - 60, lx = VW - (narrow ? 16 : 40);
  const map = m => bot - Math.sqrt(clamp(m, 0, 400) / 400) * (bot - top);
  rrect(lx - 5, top, 10, bot - top, 5, "rgba(255,255,255,0.45)");
  ctx.font = `${narrow ? 18 : 26}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  [["🏠", 0], ["☁️", 30], ["🎈", 110], ["✈️", 190], ["🚀", SPACE_M]].forEach(([e, m]) => ctx.fillText(e, lx - (narrow ? 22 : 34), map(m)));
  if (best > 0) { rrect(lx - 14, map(best) - 3, 28, 6, 3, "#ffe14d"); }
  ellipse(lx, map(h), 11, 11, "#ff5c5c"); ellipse(lx, map(h), 6, 6, "#fff");

  // help at the start
  ctx.textBaseline = "alphabetic";
  const hint = touchMode ? "Tap the screen when you land!" : "Press SPACE when you land!";
  if (hintOn) bigText(hint, VW / 2, narrow ? 290 : VH - 40, 36, "#fff");

  // "NOW!" when it's time to press
  const matY = screenY(0);
  if (J.vy < 0 && J.phase === "air") {
    if (matY > VH - 20) {
      const zone = inZone();
      const dist = Math.floor(J.y);
      if (zone) bigText("⬇ NOW! ⬇", VW / 2, VH - 30, 58 + Math.sin(time * 25) * 6, "#fff36b");
      else bigText("⬇ " + dist + " m", VW / 2, VH - 30, 34, "#fff");
    } else if (inZone() && J.goodCount < 3) {
      if (narrow) bigText("NOW!", VW / 2, VH - 24, 50, "#fff36b");
      else bigText("NOW!", trampX + 200, matY - 20, 50, "#fff36b");
    }
  }
}

// Big outlined words. Too wide for the screen? Smaller, or on two lines.
function bigText(t, x, y, size, color) {
  ctx.textAlign = "center";
  ctx.font = `700 ${size}px Fredoka, sans-serif`;
  const room = VW - 30, w = ctx.measureText(t).width;
  if (w > room) {
    const cut = t.lastIndexOf(" ", Math.floor(t.length / 2) + 2);
    if (size * room / w < 30 && cut > 0) {
      const s2 = Math.min(size, 46);
      bigText(t.slice(0, cut), x, y - s2 * 0.55, s2, color);
      bigText(t.slice(cut + 1), x, y + s2 * 0.55, s2, color);
      return;
    }
    size = Math.floor(size * room / w);
    ctx.font = `700 ${size}px Fredoka, sans-serif`;
  }
  ctx.lineWidth = size / 5; ctx.strokeStyle = "rgba(43,33,64,0.7)"; ctx.lineJoin = "round";
  ctx.strokeText(t, x, y); ctx.fillStyle = color; ctx.fillText(t, x, y);
}

function drawSpeedLines() {
  const s = Math.abs(J.vy);
  if (s < 40 || J.phase !== "air") return;
  ctx.globalAlpha = clamp((s - 40) / 120, 0, 0.5);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
  for (let i = 0; i < 18; i++) {
    const x = rand(i + 900) * VW;
    const len = 80 + rand(i + 950) * 160;
    const m = VH + len;
    const y = (((rand(i + 999) * m + speedOff) % m) + m) % m;
    ctx.beginPath(); ctx.moveTo(x, y - len); ctx.lineTo(x, y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ================= Main loop =================
let last = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0.016);
  last = t; time += dt;

  updateJump(dt);
  speedOff += J.vy * PX * 0.6 * dt;
  if (screen === "play") cam = Math.max(0, J.y - 6.5);
  else cam = Math.max(0, J.y - 9);
  const tx = screen === "settings" && VW > VH ? VW * 0.74 : VW / 2;
  trampX = lerp(trampX, tx, Math.min(1, dt * 6));

  for (const p of popups) { p.life -= dt; p.y -= 60 * dt; }
  popups = popups.filter(p => p.life > 0);
  for (const c of confetti) { c.life -= dt; c.vy += 700 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.r += c.vr * dt; }
  confetti = confetti.filter(c => c.life > 0 && c.y < VH + 40);
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }

  // draw
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawSky();
  drawEarth();
  drawHighStuff();
  drawGarden();
  drawSpeedLines();
  const w = Math.min(320, VW * 0.8), my = screenY(0);
  const glow = screen === "play" && inZone();
  if (my < VH + 200) drawTrampolineBack(trampX, my, w, glow);
  if (my < VH + 50) drawBouncerShadow(trampX, my, w);
  drawBouncer(trampX, screenY(J.y));
  if (my < VH + 200) drawTrampolineFront(trampX, my, w);
  drawForeground();

  for (const p of popups) { ctx.globalAlpha = clamp(p.life * 2, 0, 1); bigText(p.text, p.x, p.y, 40, p.color); }
  ctx.globalAlpha = 1;
  for (const c of confetti) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r);
    ctx.fillStyle = c.c; ctx.fillRect(-6, -4, 12, 8); ctx.restore();
  }
  if (screen === "play") {
    drawHUD();
    if (banner) {
      ctx.globalAlpha = clamp(banner.life * 2, 0, 1);
      bigText(banner.text, VW / 2, VH * 0.58, 64, "#ffe14d");
      ctx.globalAlpha = 1;
    }
  }
  requestAnimationFrame(frame);
}

// ================= Menu, Settings and keys =================
const elMenu = document.getElementById("menu"), elSet = document.getElementById("settings"), elHome = document.getElementById("bHome");
const menuBtns = [document.getElementById("bPlay"), document.getElementById("bSet")];
const rows = [...document.querySelectorAll("#settings .row"), document.getElementById("bBack")];
let menuSel = 0, setSel = 0;

// rainbow bouncy title
const titleCols = ["#ff4d4d", "#ff9f1c", "#ffd23f", "#3ccf5a", "#4aa8ff", "#8a5cff"];
document.getElementById("title").innerHTML = [..."TRAMPOLINE"].map((ch, i) =>
  `<span style="color:${titleCols[i % titleCols.length]};animation-delay:${i * 0.08}s">${ch}</span>`).join("");

function show(name) {
  screen = name;
  elMenu.classList.toggle("hidden", name !== "menu");
  elSet.classList.toggle("hidden", name !== "settings");
  elHome.classList.toggle("hidden", name !== "play");
  if (name === "play" || name === "menu") resetJump();
  paintMenu(); paintSettings();
}
function paintMenu() { menuBtns.forEach((b, i) => b.classList.toggle("sel", i === menuSel)); }
function paintSettings() {
  rows.forEach((r, i) => r.classList.toggle("sel", i === setSel));
  for (const r of rows) {
    if (!r.dataset.key) continue;
    r.querySelectorAll(".opt").forEach(o => o.classList.toggle("on", o.dataset.v === settings[r.dataset.key]));
  }
}
function changeSetting(row, dir) {
  const key = row.dataset.key; if (!key) return;
  const vals = [...row.querySelectorAll(".opt")].map(o => o.dataset.v);
  const i = vals.indexOf(settings[key]);
  settings[key] = vals[(i + dir + vals.length) % vals.length];
  saveSettings(); paintSettings(); sfx.click();
}

menuBtns[0].onclick = () => { sfx.click(); show("play"); };
menuBtns[1].onclick = () => { sfx.click(); menuSel = 1; setSel = 0; show("settings"); };
menuBtns.forEach((b, i) => b.onmouseenter = () => { menuSel = i; paintMenu(); });
document.getElementById("bBack").onclick = () => { sfx.click(); show("menu"); };
elHome.onclick = () => { sfx.click(); menuSel = 0; show("menu"); };
rows.forEach((r, i) => {
  r.onmouseenter = () => { setSel = i; paintSettings(); };
  r.querySelectorAll?.(".opt").forEach(o => o.onclick = () => {
    settings[r.dataset.key] = o.dataset.v; saveSettings(); paintSettings(); sfx.click();
  });
});

addEventListener("keydown", e => {
  const k = e.key;
  if ([" ", "Enter", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Escape", "Tab"].includes(k)) e.preventDefault();
  if (screen === "play") {
    if (k === " " && !e.repeat) press();
    if (k === "Escape") { menuSel = 0; show("menu"); }
    return;
  }
  if (e.repeat && (k === " " || k === "Enter")) return;
  if (screen === "menu") {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Tab"].includes(k)) { menuSel = 1 - menuSel; paintMenu(); sfx.click(); }
    if (k === " " || k === "Enter") menuBtns[menuSel].onclick();
  } else if (screen === "settings") {
    if (k === "ArrowDown" || k === "Tab") { setSel = (setSel + 1) % rows.length; paintSettings(); }
    if (k === "ArrowUp") { setSel = (setSel + rows.length - 1) % rows.length; paintSettings(); }
    if (k === "ArrowLeft") changeSetting(rows[setSel], -1);
    if (k === "ArrowRight") changeSetting(rows[setSel], 1);
    if (k === " " || k === "Enter") {
      if (rows[setSel].id === "bBack") rows[setSel].onclick(); else changeSetting(rows[setSel], 1);
    }
    if (k === "Escape") show("menu");
  }
});
// tap or click the sky to bounce (for tablets and phones)
cv.addEventListener("pointerdown", () => press());
addEventListener("contextmenu", e => e.preventDefault());   // no pop-up menu on a long press
// after a click, let go of the button so SPACE doesn't press it again
addEventListener("click", () => document.activeElement?.blur?.());

// Get the saved pictures ready a few at a time while the menu is showing, so nothing stutters later.
(function warmUp() {
  const L = LX(), w = Math.min(320, VW * 0.8);
  const jobs = [
    () => cached("gmid", VW, buildGardenMid), () => cached("gfar", VW, buildGardenFar), () => trampSprites(w, L),
    () => settings.who === "robot" ? [robotSprite(L, 1), robotSprite(L, -1)] : settings.who === "frog" ? [frogSprite(L, 0), frogSprite(L, 10)] : [duckSprite(L), wingSprite(L)],
    () => cached("gfg", VW, buildGardenFg), () => sunSprite(), () => ghostSprite(),
    () => [0, 1, 2, 3, 4].forEach(cloudSprite), () => balloonSprite(L), () => planeSprite(L), () => contrailSprite(),
    () => starSprite(), () => milkySprite(), () => earthSprite(), () => satelliteSprite(L), () => moonSprite(L), () => planetSprite(L),
    () => { duckSprite(L); wingSprite(L); frogSprite(L, 0); frogSprite(L, 10); robotSprite(L, 1); robotSprite(L, -1); },
  ];
  let i = 0;
  const next = () => { if (i < jobs.length) { try { jobs[i++](); } catch (e) {} setTimeout(next, 40); } };
  setTimeout(next, 100);
})();

show("menu");
requestAnimationFrame(t => { last = t; frame(t); });
</script>
