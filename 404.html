<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;background:#17130f;color:#f0e6d4;font:500 22px/1.4 "Barlow Condensed","Arial Narrow",sans-serif}
h1{font:400 40px/1 "Saira Stencil One",Impact,sans-serif;color:#f4b400;margin:0 0 10px}
a{display:inline-block;margin-top:14px;background:#f4b400;color:#1b1406;text-decoration:none;font:400 24px/1 "Saira Stencil One",Impact,sans-serif;padding:14px 22px;border-radius:12px}</style>
</head>
<body><main><h1>Oops! Nothing here.</h1><p>That page took a wrong turn underground.</p><a id="home" href="./">Back to the games</a></main>
<script>
/* a 404 can be served from any depth: on a github.io project site the home page is /<repo>/, otherwise it is / */
(function(){var h=location.hostname,p=location.pathname.split('/').filter(Boolean),base='/';
if(/.github.io$/.test(h)&&p.length)base='/'+p[0]+'/';document.getElementById('home').href=base})();
</script>
</body>
</html>
