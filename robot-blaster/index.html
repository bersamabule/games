<!-- three.js r186 (MIT licence, lib/three-LICENSE.txt): draws the 3D arena. It is in the game folder, so no internet is needed. -->
<script src="lib/three.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const PHONE = matchMedia("(pointer: coarse)").matches || Math.min(screen.width, screen.height) < 600 || /lowq/.test(location.hash);
let touchMode = PHONE;
const HASH = location.hash;
const TESTING = /play/.test(HASH);
if (/touch/.test(HASH)) { touchMode = true; document.body.classList.add('touch'); }

let R;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, 16 / 9, 0.05, 400);

scene.add(camera);

// ---------- quality switch: the laptop gets the best, phones get a cheaper version ----------
const Q = PHONE
  ? { tex: 256, shadow: 1024, shR: 13, tufts: 2200, leaf: 0.55, aniso: 4, clear: false, zapLights: 1, skyW: 512 }

// ---------- little helpers: shapes ----------
const M = (color, o) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.6, metalness: 0 }, o || {}));
function box(w, h, d, mat, x, y, z, parent, shadow) {

  m.castShadow = shadow !== false; m.receiveShadow = true; (parent || scene).add(m); return m;
}
function cyl(rt, rb, h, mat, x, y, z, parent, seg) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 20), mat); m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true; (parent || scene).add(m); return m;
}
const GC = {};   // shared geometries so robots are cheap
function sph(r, mat, x, y, z, parent, sx, sy, sz) {
  const k = "s" + r; const g = GC[k] || (GC[k] = new THREE.SphereGeometry(r, 18, 14));
  const m = new THREE.Mesh(g, mat); m.position.set(x, y, z); if (sx) m.scale.set(sx, sy, sz);
  m.castShadow = true; (parent || scene).add(m); return m;
}

// ---------- surface textures, all drawn in code: colour + normal (bumps) + roughness/metal maps ----------
// The surfaces LOOK rough, but the map is just a picture on flat shapes: walking stays smooth.
function cv(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  const xs = [x], ys = [y]; if (x < rad) xs.push(x + S); if (x > S - rad) xs.push(x - S); if (y < rad) ys.push(y + S); if (y > S - rad) ys.push(y - S);

}
const grey = v => { v = Math.round(clamp(v, 0, 1) * 255); return `rgb(${v},${v},${v})`; };
function pbr(S, rx, ry, seed, fn, o) {
  o = o || {};
  const C = cv(S, S), H = cv(S, S), Rr = cv(S, S), Mm = cv(S, S);
  const c = C.getContext("2d"), h = H.getContext("2d"), r = Rr.getContext("2d"), m = Mm.getContext("2d");
  h.fillStyle = "#808080"; h.fillRect(0, 0, S, S);
  r.fillStyle = grey(o.rough == null ? 0.8 : o.rough); r.fillRect(0, 0, S, S);
  m.fillStyle = grey(o.metal || 0); m.fillRect(0, 0, S, S);
  fn({ c, h, r, m, S, k: S / 256, rn: mulberry(seed) });
  // height picture -> normal map (wraps round, so it tiles)
  const hd = h.getImageData(0, 0, S, S).data, NM = cv(S, S), n = NM.getContext("2d"), out = n.createImageData(S, S), st = (o.n || 3) / 255;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const l = hd[(y * S + (x + S - 1) % S) * 4], rr = hd[(y * S + (x + 1) % S) * 4], u = hd[(((y + S - 1) % S) * S + x) * 4], d = hd[(((y + 1) % S) * S + x) * 4];
    let nx = (l - rr) * st, ny = (d - u) * st, nz = 1; const il = 1 / Math.hypot(nx, ny, nz), i = (y * S + x) * 4;
    out.data[i] = (nx * il * 0.5 + 0.5) * 255; out.data[i + 1] = (ny * il * 0.5 + 0.5) * 255; out.data[i + 2] = (nz * il * 0.5 + 0.5) * 255; out.data[i + 3] = 255;
  }
  n.putImageData(out, 0, 0);
  const rd = r.getImageData(0, 0, S, S), md = m.getImageData(0, 0, S, S), OR = cv(S, S), oc = OR.getContext("2d"), od = oc.createImageData(S, S);
  for (let i = 0; i < S * S * 4; i += 4) { od.data[i] = 255; od.data[i + 1] = rd.data[i]; od.data[i + 2] = md.data[i]; od.data[i + 3] = 255; }
  oc.putImageData(od, 0, 0);
  const mk = (cnv, srgb) => { const t = new THREE.CanvasTexture(cnv); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = Q.aniso; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); return t; };
  return { map: mk(C, true), normalMap: mk(NM, false), orm: mk(OR, false) };
}
function variant(set, rx, ry, rot) {
  const v = {};
  for (const k of ["map", "normalMap", "orm"]) { const t = set[k].clone(); t.needsUpdate = true; t.repeat.set(rx, ry); if (rot) { t.center.set(0.5, 0.5); t.rotation = rot; } v[k] = t; }
  return v;
}
function matOf(set, o) {
  return new THREE.MeshStandardMaterial(Object.assign({ map: set.map, normalMap: set.normalMap, roughnessMap: set.orm, metalnessMap: set.orm, roughness: 1, metalness: 1 }, o || {}));
}

const grassSet = pbr(Q.tex, 100, 100, 1, ({ c, h, S, k, rn }) => {
  c.fillStyle = "#4d8a2c"; c.fillRect(0, 0, S, S);
  for (let i = 0; i < 46; i++) {
    const x = rn() * S, y = rn() * S, rad = (40 + rn() * 70) * k * 2, t = rn(), col = t < 0.4 ? "61,118,38" : t < 0.75 ? "125,165,55" : "158,146,72";
    for (const [px, py] of wrapPts(S, x, y, rad)) { const g = c.createRadialGradient(px, py, 0, px, py, rad); g.addColorStop(0, `rgba(${col},.42)`); g.addColorStop(1, `rgba(${col},0)`); c.fillStyle = g; c.fillRect(px - rad, py - rad, rad * 2, rad * 2); }
  }
  for (let i = 0; i < 700 * k * k; i++) { c.fillStyle = `rgba(55,40,22,${0.15 + rn() * 0.25})`; c.fillRect(rn() * S, rn() * S, 1 + rn() * 2, 1 + rn() * 2); }
  const n = Math.floor(2600 * k * k);
  for (let i = 0; i < n; i++) {
    const x = rn() * S, y = rn() * S, len = (6 + rn() * 11) * k, a = -Math.PI / 2 + (rn() - 0.5) * 1.2;
    let hue = 72 + rn() * 48, sat = 40 + rn() * 30, L = 18 + rn() * 34; if (rn() < 0.07) { hue = 48 + rn() * 14; sat = 50; L = 40 + rn() * 12; }
    const dx = Math.cos(a) * len, dy = Math.sin(a) * len, lw = (0.8 + rn() * 1.1) * Math.max(1, k * 0.9);
    for (const [px, py] of wrapPts(S, x, y, len + 2)) {
      c.strokeStyle = `hsl(${hue},${sat}%,${L}%)`; c.lineWidth = lw; c.beginPath(); c.moveTo(px, py); c.lineTo(px + dx, py + dy); c.stroke();
      h.strokeStyle = "rgba(255,255,255,.3)"; h.lineWidth = lw; h.beginPath(); h.moveTo(px, py); h.lineTo(px + dx, py + dy); h.stroke();
    }
  }
}, { rough: 0.92, n: 4 });

const pathSet = pbr(Q.tex, 1, 12, 2, ({ c, h, r, S, k, rn }) => {
  c.fillStyle = "#a08358"; c.fillRect(0, 0, S, S);
  for (let i = 0; i < 4500 * k * k; i++) { const t = rn(); c.fillStyle = t < 0.4 ? `rgba(90,68,42,${rn() * 0.4})` : `rgba(210,185,140,${rn() * 0.35})`; c.fillRect(rn() * S, rn() * S, 1 + rn() * 2.5, 1 + rn() * 2.5); }
  const pal = ["#8a8a85", "#b5a58a", "#6e6256", "#c9bfae", "#9b8f7a"];
  for (let i = 0; i < 130; i++) {
    const x = rn() * S, y = rn() * S, rx = (2.5 + rn() * 7) * k, ry = rx * (0.6 + rn() * 0.4), col = pal[(rn() * 5) | 0];
    for (const [px, py] of wrapPts(S, x, y, rx + 3)) {
      c.fillStyle = "rgba(40,28,14,.35)"; c.beginPath(); c.ellipse(px + 1.5 * k, py + 2 * k, rx * 1.1, ry * 1.1, 0, 0, 7); c.fill();
      const g = c.createRadialGradient(px - rx * 0.3, py - ry * 0.3, 0, px, py, rx); g.addColorStop(0, "#fff8"); g.addColorStop(0.25, col); g.addColorStop(1, "#2a2218");

requestAnimationFrame(loop);
// always keep one robot parade on the menu: a few robots stroll in the background

window.__rb = {

if (/play/.test(HASH)) {
