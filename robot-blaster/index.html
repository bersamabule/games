<!-- three.js r186 (MIT licence, lib/three-LICENSE.txt): draws the 3D arena. It is in the game folder, so no internet is needed. -->
<script src="lib/three.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const PHONE = matchMedia("(pointer: coarse)").matches || Math.min(screen.width, screen.height) < 600 || /lowq/.test(location.hash);
let touchMode = PHONE;
const HASH = location.hash;
const TESTING = /play/.test(HASH);
if (/touch/.test(HASH)) { touchMode = true; document.body.classList.add('touch'); }

let R;
try { R = new THREE.WebGLRenderer({ canvas: $("gl"), antialias: true }); } catch (e) { $("nogl").style.display = "flex"; $("menu").classList.add("hidden"); throw e; }
R.setPixelRatio(Math.min(devicePixelRatio || 1, PHONE ? 1.5 : 1.75));

R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, 16 / 9, 0.05, 520);
camera.rotation.order = "YXZ";
scene.add(camera);

// ---------- quality switch: the laptop gets the best, phones get a cheaper version ----------
const Q = PHONE
  ? { tex: 256, shadow: 1024, shR: 22, tufts: 2200, leaf: 0.55, aniso: 4, clear: false, zapLights: 1, skyW: 512 }
  : { tex: 512, shadow: 3072, shR: 34, tufts: 7000, leaf: 1, aniso: 8, clear: true, zapLights: 3, skyW: 1024 };

// ---------- little helpers: shapes ----------
const M = (color, o) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.6, metalness: 0 }, o || {}));
function box(w, h, d, mat, x, y, z, parent, shadow) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z);
  m.castShadow = shadow !== false; m.receiveShadow = true; (parent || scene).add(m); return m;
}
function cyl(rt, rb, h, mat, x, y, z, parent, seg) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 20), mat); m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true; (parent || scene).add(m); return m;
}
const GC = {};   // shared geometries so robots are cheap
function sph(r, mat, x, y, z, parent, sx, sy, sz) {
  const k = "s" + r; const g = GC[k] || (GC[k] = new THREE.SphereGeometry(r, 18, 14));
  const m = new THREE.Mesh(g, mat); m.position.set(x, y, z); if (sx) m.scale.set(sx, sy, sz);
  m.castShadow = true; (parent || scene).add(m); return m;
}

// ---------- surface textures, all drawn in code: colour + normal (bumps) + roughness/metal maps ----------
// The surfaces LOOK rough, but the map is just a picture on flat shapes: walking stays smooth.
function cv(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function wrapPts(S, x, y, rad) {
  const xs = [x], ys = [y]; if (x < rad) xs.push(x + S); if (x > S - rad) xs.push(x - S); if (y < rad) ys.push(y + S); if (y > S - rad) ys.push(y - S);
  const o = []; for (const a of xs) for (const b of ys) o.push([a, b]); return o;
}
const grey = v => { v = Math.round(clamp(v, 0, 1) * 255); return `rgb(${v},${v},${v})`; };
function pbr(S, rx, ry, seed, fn, o) {
  o = o || {};
  const C = cv(S, S), H = cv(S, S), Rr = cv(S, S), Mm = cv(S, S);
  const c = C.getContext("2d"), h = H.getContext("2d"), r = Rr.getContext("2d"), m = Mm.getContext("2d");
  h.fillStyle = "#808080"; h.fillRect(0, 0, S, S);
  r.fillStyle = grey(o.rough == null ? 0.8 : o.rough); r.fillRect(0, 0, S, S);
  m.fillStyle = grey(o.metal || 0); m.fillRect(0, 0, S, S);
  fn({ c, h, r, m, S, k: S / 256, rn: mulberry(seed) });
  // height picture -> normal map (wraps round, so it tiles)
  const hd = h.getImageData(0, 0, S, S).data, NM = cv(S, S), n = NM.getContext("2d"), out = n.createImageData(S, S), st = (o.n || 3) / 255;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const l = hd[(y * S + (x + S - 1) % S) * 4], rr = hd[(y * S + (x + 1) % S) * 4], u = hd[(((y + S - 1) % S) * S + x) * 4], d = hd[(((y + 1) % S) * S + x) * 4];
    let nx = (l - rr) * st, ny = (d - u) * st, nz = 1; const il = 1 / Math.hypot(nx, ny, nz), i = (y * S + x) * 4;
    out.data[i] = (nx * il * 0.5 + 0.5) * 255; out.data[i + 1] = (ny * il * 0.5 + 0.5) * 255; out.data[i + 2] = (nz * il * 0.5 + 0.5) * 255; out.data[i + 3] = 255;
  }
  n.putImageData(out, 0, 0);
  const rd = r.getImageData(0, 0, S, S), md = m.getImageData(0, 0, S, S), OR = cv(S, S), oc = OR.getContext("2d"), od = oc.createImageData(S, S);
  for (let i = 0; i < S * S * 4; i += 4) { od.data[i] = 255; od.data[i + 1] = rd.data[i]; od.data[i + 2] = md.data[i]; od.data[i + 3] = 255; }
  oc.putImageData(od, 0, 0);
  const mk = (cnv, srgb) => { const t = new THREE.CanvasTexture(cnv); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = Q.aniso; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); return t; };
  return { map: mk(C, true), normalMap: mk(NM, false), orm: mk(OR, false) };
}
function variant(set, rx, ry, rot) {
  const v = {};
  for (const k of ["map", "normalMap", "orm"]) { const t = set[k].clone(); t.needsUpdate = true; t.repeat.set(rx, ry); if (rot) { t.center.set(0.5, 0.5); t.rotation = rot; } v[k] = t; }
  return v;
}
function matOf(set, o) {
  return new THREE.MeshStandardMaterial(Object.assign({ map: set.map, normalMap: set.normalMap, roughnessMap: set.orm, metalnessMap: set.orm, roughness: 1, metalness: 1 }, o || {}));
}

const grassSet = pbr(Q.tex, 100, 100, 1, ({ c, h, S, k, rn }) => {
  c.fillStyle = "#4d8a2c"; c.fillRect(0, 0, S, S);
  for (let i = 0; i < 46; i++) {
    const x = rn() * S, y = rn() * S, rad = (40 + rn() * 70) * k * 2, t = rn(), col = t < 0.4 ? "61,118,38" : t < 0.75 ? "125,165,55" : "158,146,72";
    for (const [px, py] of wrapPts(S, x, y, rad)) { const g = c.createRadialGradient(px, py, 0, px, py, rad); g.addColorStop(0, `rgba(${col},.42)`); g.addColorStop(1, `rgba(${col},0)`); c.fillStyle = g; c.fillRect(px - rad, py - rad, rad * 2, rad * 2); }
  }
  for (let i = 0; i < 700 * k * k; i++) { c.fillStyle = `rgba(55,40,22,${0.15 + rn() * 0.25})`; c.fillRect(rn() * S, rn() * S, 1 + rn() * 2, 1 + rn() * 2); }
  const n = Math.floor(2600 * k * k);
  for (let i = 0; i < n; i++) {
    const x = rn() * S, y = rn() * S, len = (6 + rn() * 11) * k, a = -Math.PI / 2 + (rn() - 0.5) * 1.2;
    let hue = 72 + rn() * 48, sat = 40 + rn() * 30, L = 18 + rn() * 34; if (rn() < 0.07) { hue = 48 + rn() * 14; sat = 50; L = 40 + rn() * 12; }
    const dx = Math.cos(a) * len, dy = Math.sin(a) * len, lw = (0.8 + rn() * 1.1) * Math.max(1, k * 0.9);
    for (const [px, py] of wrapPts(S, x, y, len + 2)) {
      c.strokeStyle = `hsl(${hue},${sat}%,${L}%)`; c.lineWidth = lw; c.beginPath(); c.moveTo(px, py); c.lineTo(px + dx, py + dy); c.stroke();
      h.strokeStyle = "rgba(255,255,255,.3)"; h.lineWidth = lw; h.beginPath(); h.moveTo(px, py); h.lineTo(px + dx, py + dy); h.stroke();
    }
  }
}, { rough: 0.92, n: 4 });

const barkSet = pbr(256, 2, 3, 4, ({ c, h, S, rn }) => {
  c.fillStyle = "#6b5238"; c.fillRect(0, 0, S, S);
  const wob = (x0, A, kk, ph, col, lw, hc) => {
    for (const dx of [-S, 0, S]) {
      c.strokeStyle = col; c.lineWidth = lw; c.beginPath(); h.strokeStyle = hc; h.lineWidth = lw; h.beginPath();
      for (let y = 0; y <= S; y += 8) { const x = x0 + dx + A * Math.sin(2 * Math.PI * kk * y / S + ph); if (y) { c.lineTo(x, y); h.lineTo(x, y); } else { c.moveTo(x, y); h.moveTo(x, y); } }
      c.stroke(); h.stroke();
    }
  };

    if (b.life <= 0) b.m.visible = false;
  }
  // screen flash, banner, hint
  if (hurtA > 0) { hurtA = Math.max(0, hurtA - dt * 2.2); $("hurt").style.opacity = hurtA; }
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $("big").classList.add("hidden"); }
  if (hintT > 0) { hintT -= dt; if (hintT < 1) $("hint").style.opacity = Math.max(0, hintT); if (hintT <= 0) $("hint").classList.add("hidden"); }
}
function idleUpdate(dt) {
  clock += dt;
  // the menu camera slowly turns round in the park so the city looks alive
  camera.position.set(0, 2.6, 6.6); camera.rotation.set(-0.06, clock * 0.1, 0);
}
function frame(dt) {
  sky.rotation.y += dt * 0.004; sky.position.copy(camera.position);
  { const ts = 2 * Q.shR / Q.shadow, sx = Math.round(camera.position.x / ts) * ts, sz = Math.round(camera.position.z / ts) * ts;   // shadow box follows the player, snapped so shadows never shimmer
    sun.target.position.set(sx, 0, sz); const sd = SUN_DIR.clone().normalize().multiplyScalar(160); sun.position.set(sx + sd.x, sd.y, sz + sd.z); sun.target.updateMatrixWorld(); }
  fountainAnim(dt);
  if (mode === "play" && !frozen) update(dt);
  else if (mode === "menu") idleUpdate(dt);
  else if (mode === "pause") gunAnim(dt, 0);

function render() {
  R.autoClear = true; R.render(scene, camera);
  gun.visible = mode !== "menu";
  if (gun.visible) {
    // the blaster lives in its own scene drawn on top, lit by the same sun and sky (turned into the camera's point of view)
    const inv = camera.quaternion.clone().invert();
    gunSun.position.copy(SUN_DIR).normalize().applyQuaternion(inv).multiplyScalar(5); gunSun.target.position.set(0, 0, 0);
    gunScene.environmentRotation.setFromQuaternion(inv);
    R.autoClear = false; R.clearDepth(); R.render(gunScene, gunCam); R.autoClear = true;
  }
}
let last = performance.now();
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now;
  frame(dt); render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// always keep one robot parade on the menu: a few robots stroll in the background
if (document.body) { /* menu robots are drawn by wave code only; menu shows the arena */ }

// ---------- test hooks ----------
window.__rb = {
  startPlay, toMenu, pauseGame, resumeGame, gameOver,
  spawnWave: n => { clearRobots(); beginWave(n); spawnT = 0; },
  shoot: () => { fireCd = 0; shoot(); },
  hurt: () => { P.inv = 0; hurtPlayer(robots[0] || { x: P.x, z: P.z - 1 }); },
  sim: sec => { for (let i = 0; i < Math.round(sec * 20); i++) { frame(0.05); } },
  aimAt: i => { const o = robots[i]; if (!o) return false; const dx = o.x - P.x, dz = o.z - P.z; P.yaw = Math.atan2(-dx, -dz); P.pitch = Math.atan2(1.2 * o.s - 1.6, Math.hypot(dx, dz)); return true; },
  place: (x, z, yaw, pitch) => { P.x = x; P.z = z; P.yaw = yaw || 0; P.pitch = pitch || 0; },
  addRobot: (x, z, tier) => { const o = spawnRobot(); o.x = x; o.z = z; o.born = 1; o.root.position.set(x, 0, z); return o; },
  freeze: v => { frozen = v !== false; },
  render, openShop, buy: buyPower, addCoins: n => { addCoins(n); drawStats(); }, setPower: n => { power = clamp(n, 0, MAXP); savePower(); drawShop(); },
  jump: () => { jumpQueued = true; }, key: (k, v) => { keys[k] = v; }, P,
  perf: () => { const gl = R.getContext(), t0 = performance.now(); for (let i = 0; i < 20; i++) { R.render(scene, camera); gl.finish(); } return { renderMs: +((performance.now() - t0) / 20).toFixed(1), calls: R.info.render.calls, tris: R.info.render.triangles }; },
  state: () => ({ mode, wave, score, hearts: P.hearts, queue, robots: robots.map(o => ({ x: +o.x.toFixed(1), z: +o.z.toFixed(1), hp: o.hp, tier: o.tier })), px: +P.x.toFixed(1), pz: +P.z.toFixed(1), yaw: +P.yaw.toFixed(2), best: bestWave, shots: shots.filter(s => s.g.visible).length, coins, power, y: +P.y.toFixed(2), floor: P.floor, onFloor: P.onFloor, bits: bits.filter(b => b.m.visible).length })
};
if (/play/.test(HASH)) {
  const w = /wave=(\d+)/.exec(HASH); startPlay(w ? +w[1] : 1); dragLook = true;
  if (/close/.test(HASH)) {
    __rb.spawnWave(w ? +w[1] : 1); clearRobots(); queue = 0;
    const o = __rb.addRobot(0.4, P.z - 3.2); o.hp = o.hp;
    if (/big/.test(HASH)) { const o2 = __rb.addRobot(-2.2, P.z - 5.5); }
    __rb.aimAt(0); P.pitch += 0.12; __rb.sim(0.05);
    if (/pop/.test(HASH)) { o.hp = 1; P.pitch = Math.atan2(1.2 * o.s - 1.6, 3.2); __rb.sim(0.03); __rb.shoot(); __rb.sim(0.14); }
    if (/freeze/.test(HASH)) frozen = true;
  }
  if (/stats/.test(HASH)) console.log("CITYSTATS leaves=" + leafList.length + " trunks=" + trunkList.length + " " + instLists.map(o => (o.mesh ? o.mesh.count : 0) + "x" + ((o.geo.index ? o.geo.index.count : o.geo.attributes.position.count) / 3 | 0)).join(" ") + " solids=" + solids.length + " trunksC=" + trunks.length + " bigs=" + bigSolids.length + " meshes=" + (() => { let n = 0; scene.traverse(() => n++); return n; })());
  { const m = /cam=(-?[\d.]+),(-?[\d.]+),(-?[\d.]+),(-?[\d.]+)/.exec(HASH); if (m) { P.x = +m[1]; P.z = +m[2]; P.yaw = +m[3]; P.pitch = +m[4]; __rb.sim(0.05); } }
  { const m = /bot=(\d+)/.exec(HASH); if (m) { const N = +m[1] * 20; let hist = [];
    for (let i = 0; i < N && mode === "play"; i++) {
      let bi = -1, bd = 1e9; robots.forEach((o, j) => { const d = Math.hypot(o.x - P.x, o.z - P.z); if (d < bd && o.born > 0.5) { bd = d; bi = j; } });
      if (bi >= 0 && !/idle/.test(HASH)) { __rb.aimAt(bi); fireHeld = true; } else fireHeld = false;
      __rb.sim(0.05); if (i % 100 === 0) hist.push(i / 20 + "s w" + wave + " r" + robots.length + " h" + P.hearts + " s" + score);
    }
    fireHeld = false; { const t0 = performance.now(); __rb.sim(2); console.log("UPDATEMS " + ((performance.now() - t0) / 40).toFixed(2) + " " + JSON.stringify(__rb.perf())); }
    console.log("BOTTEST " + JSON.stringify(__rb.state()) + " " + hist.join(" | ")); } }
  { const m = /coins=(\d+)/.exec(HASH); if (m) { coins = +m[1]; saveCoins(); drawStats(); } const q = /power=(\d)/.exec(HASH); if (q) { power = +q[1]; savePower(); } }
  if (/climb/.test(HASH)) { P.x = 8; P.z = 1.5; P.yaw = 0; keys.KeyW = true; const log = [];
    for (let i = 0; i < 120 && P.floor < 2.3; i++) { if (P.onFloor) jumpQueued = true; __rb.sim(0.05); if (i % 4 === 0) log.push("y" + P.y.toFixed(2) + "@" + P.z.toFixed(1)); }
    keys.KeyW = false; console.log("CLIMB floor=" + P.floor + " y=" + P.y.toFixed(2) + " " + log.join(" ")); }
  if (/dbg/.test(HASH)) setTimeout(() => console.log("DBG cam=" + camera.position.toArray().map(v => v.toFixed(2)) + " y=" + P.y + " vy=" + P.vy + " floor=" + P.floor + " mode=" + mode + " fog=" + scene.fog.near), 2500);
  if (/crate1/.test(HASH)) { P.x = 0; P.z = 0; P.yaw = 0; keys.KeyW = true; for (let i = 0; i < 60 && P.floor < 1; i++) { if (P.onFloor && P.z < -0.2) jumpQueued = true; __rb.sim(0.05); } keys.KeyW = false; __rb.sim(0.3); { const m = /pitch=(-?[0-9.]+)/.exec(HASH); P.yaw = 0.6; P.pitch = m ? +m[1] : -0.5; } __rb.sim(0.06); console.log("CRATE1 cam=" + camera.position.toArray().map(v => v.toFixed(2)) + " pitch=" + P.pitch + " floor=" + P.floor + " y=" + P.y.toFixed(2) + " z=" + P.z.toFixed(2)); }
  if (/pausetest/.test(HASH)) { __rb.sim(0.1); pauseGame(); if (/shop/.test(HASH)) openShop(); }
  if (/zaptest/.test(HASH)) { const out = [];
    for (let lv = 0; lv <= MAXP; lv++) { power = lv; const row = [];
      for (let t = 0; t < 3; t++) { clearRobots(); queue = 0; fight = false; P.x = 0; P.z = 12; P.floor = 0;
        const q = makeRobot(t, 0xff5a5a); q.x = 0; q.z = 4; q.born = 1; q.speed = 0; q.root.position.set(0, 0, 4); robots.push(q);
        let n = 0; while (robots.includes(q) && n < 30) { __rb.aimAt(robots.indexOf(q)); __rb.shoot(); __rb.sim(0.3); n++; q.x = 0; q.z = 4; }
        row.push(TIERS[t].name + "=" + n); }
      out.push("L" + (lv + 1) + ":" + row.join(",")); }
    clearRobots(); power = 0; console.log("ZAPTEST " + out.join(" | ") + " coins=" + coins + " saved=" + localStorage.getItem("robot-blaster-coins")); }
  if (/recoil/.test(HASH)) { __rb.shoot(); gunAnim(0.03, 0); if (/noball/.test(HASH)) for (const q of shots) q.g.visible = false; }
  if (/walk/.test(HASH)) { P.bob = 0.9; for (let i = 0; i < 12; i++) { P.bob += 0.25; clock += 0.05; gunAnim(0.05, 1); } }
  if (/over/.test(HASH)) { P.hearts = 1; __rb.hurt(); }
}
