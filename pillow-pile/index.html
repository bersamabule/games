$("play").onclick = newGame; $("again").onclick = newGame; $("resume").onclick = () => pause(false); $("pausebtn").onclick = () => pause(mode === "play"); $("musicbtn").onclick = () => setMusic(!musicOn);
document.querySelectorAll("#touch button").forEach(b => {
  const k = b.dataset.k;
  b.addEventListener("touchstart", e => { e.preventDefault(); getAc(); if (k === "left") { held.left = 1; rep.left = 0.2; tryMove(-1); } else if (k === "right") { held.right = 1; rep.right = 0.2; tryMove(1); } else if (k === "down") { held.down = 1; rep.down = 0.1; if (cur && mode === "play" && !clearing) stepDown(true); } else if (k === "rot") tryRotate(1); else if (k === "drop") hardDrop(); }, { passive: false });
  const up = e => { e.preventDefault(); held.left = held.right = held.down = 0; }; b.addEventListener("touchend", up, { passive: false }); b.addEventListener("touchcancel", up, { passive: false });
});

// ---------- the loop ----------
let clock = 0, last = performance.now();
function size() { R.setSize(innerWidth, innerHeight, false); const a = innerWidth / innerHeight; camera.aspect = a; camera.fov = a < 1 ? 62 : a < 1.5 ? 50 : 38; camera.updateProjectionMatrix(); camStandoff = a < 1 ? 44 : a < 1.5 ? 38 : 34; }
let camStandoff = 34; addEventListener("resize", size); size();
function update(dt) {
  clock += dt;
  if (mode === "play" && cur && !clearing) {
    for (const k of ["left", "right", "down"]) if (held[k]) { rep[k] -= dt; while (rep[k] <= 0) { rep[k] += k === "down" ? 0.045 : 0.055; if (k === "left") tryMove(-1); else if (k === "right") tryMove(1); else stepDown(true); } }
    fallT += dt;
    const onGround = !fits(cur.type, cur.rot, cur.x, cur.y - 1);
    if (onGround) { lockDelay += dt; if (lockDelay > 0.5) lockPiece(); } else { lockDelay = 0; while (fallT >= gravity()) { fallT -= gravity(); if (!stepDown(false)) break; } }
  }
  if (clearing) { clearing.t += dt; if (clearing.t > 0.75) finishClear(); }
  // pillows that burst away fly toward you; everything else settles smoothly where it should be
  for (const row of board || []) for (let c = 0; c < COLS; c++) { const m = row[c]; if (!m) continue; const u = m.userData;
    if (u.fly) { u.vy -= 9 * dt; m.position.x += u.vx * dt; m.position.y += u.vy * dt; m.position.z += u.vz * dt; m.rotation.x += u.spin * dt; m.rotation.y += u.spin * 0.6 * dt; const s = Math.max(0.01, 1 - clearing.t * 0.6); m.scale.set(s, s, s); }
  }
  if (board) for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const m = board[r][c]; if (!m || m.userData.fly) continue; const u = m.userData, tx = cellX(c), ty = cellY(r), k = Math.min(1, dt * 16); m.position.x += (tx - m.position.x) * k; m.position.y += (ty - m.position.y) * k; m.position.z += (0 - m.position.z) * k;
    if (u.sq > 0) { u.sq = Math.max(0, u.sq - dt * 3.2); const w = Math.sin(u.sq * 14) * u.sq * 0.09; m.scale.set(1 + w, 1 - w, 1 + w * 0.5); } else m.scale.set(1, 1, 1); }
  if (cur) {
    cur.vx += (cur.x - cur.vx) * Math.min(1, dt * 22); cur.vy += (cur.y - cur.vy) * Math.min(1, dt * 24);
    const cells = rotated(cur.type, cur.rot); cur.meshes.forEach((m, i) => { m.position.set(X0 + cur.vx + cells[i][0] + 0.5, cur.vy - cells[i][1] + 0.5, 0); const w = 0.012 * Math.sin(clock * 4 + i); m.scale.set(1 + w, 1 - w, 1); });
    const gy = dropRow(cur); cur.ghosts.forEach((g, i) => { g.visible = gy < cur.y; g.position.set(X0 + cur.x + cells[i][0] + 0.5, gy - cells[i][1] + 0.5, 0); });
  }
  featherStep(dt);
  // the camera drifts a tiny bit so the room feels alive (and you can see the pillows are really round)
  camera.position.set(Math.sin(clock * 0.25) * 0.9, 13.2 + Math.sin(clock * 0.19) * 0.25, camStandoff + 0.0);
  camera.lookAt(0, /zoom/.test(HASH) ? 3.5 : 9.2, 0); if (/zoom/.test(HASH)) camera.position.set(2, 6, 12);
}
function loop(now) { const dt = clamp((now - last) / 1000, 0, 0.05); last = now; if (mode !== "pause") update(dt); else featherStep(0); R.render(scene, camera); requestAnimationFrame(loop); }
board = emptyBoard(); setNext(nextFromBag());
$("bestline").textContent = best ? "Best score: " + best + " ⭐" : "";
if (TOUCH) document.body.classList.add("touch");
if (/dumptex/.test(HASH)) for (const t of [FAB.map, FAB.normalMap]) { const im = t.image; im.style.cssText = "position:fixed;z-index:99;width:400px;height:400px;top:10px;left:" + (t === FAB.map ? 10 : 420) + "px"; document.body.appendChild(im); }
requestAnimationFrame(loop);
// test hooks
window.__pt = { newGame, sim: s => { for (let i = 0; i < s * 20; i++) update(0.05); }, state: () => ({ mode, score, lines, level, cur: cur && { t: cur.type, x: cur.x, y: cur.y, rot: cur.rot }, next: nextType, rows: board.map(r => r.map(c => (c ? 1 : 0)).join("")).reverse() }), hardDrop, tryMove, tryRotate,
  fill: n => { for (let r = 0; r < n; r++) for (let c = 0; c < COLS - 1; c++) { if (board[r][c]) continue; const t = TYPES[(r + c) % 7], m = makePillow(t); m.position.set(cellX(c), cellY(r), 0); stack.add(m); board[r][c] = m; } } };
if (/play/.test(HASH)) { newGame(); if (/fill=(\d+)/.test(HASH)) __pt.fill(+/fill=(\d+)/.exec(HASH)[1]); if (/sim=(\d+)/.test(HASH)) __pt.sim(+/sim=(\d+)/.exec(HASH)[1]); if (/clear/.test(HASH)) { cur.type = "I"; cur.rot = 1; cur.x = COLS - 3; __pt.sim(0.3); __pt.hardDrop(); __pt.sim(0.25); } }
