<style>/* app build: no pinch zoom, pull-to-refresh, tap flashes or long-press menus */
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none}</style>
<style>
/* Drill Full Version: one page that plays Drill, Drill 2 and Drill 3 in order. The chapter menu, the chapter title cards and the ending
   live here; each chapter is the full game, mounted into #fv-host from its <template> and torn down again when you leave it. */
:root{
  color-scheme:dark;
  --fv-ink:#17130f;--fv-void:#0c0907;--fv-panel:#221c16;--fv-panel-hi:#2d251e;--fv-line:#41362b;--fv-text:#f0e6d4;--fv-dim:#a8987f;
  --fv-rig:#f4b400;--fv-on-rig:#1b1406;--fv-good:#86c46a;--fv-danger:#e4553c;
  --fv-display:"Saira Stencil One",Impact,"Arial Narrow",sans-serif;--fv-ui:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--fv-ink);color:var(--fv-text);font:500 16px/1.35 var(--fv-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
#fv-host{position:fixed;inset:0}
#fv-host:empty{display:none}
.fv-screen{position:fixed;inset:0;z-index:50;display:flex;padding:16px;overflow:auto;color:var(--fv-text);font:500 16px/1.35 var(--fv-ui);box-sizing:border-box;background:transparent;color-scheme:dark}
.fv-screen>*{margin:auto} /* centred, but never cut off at the top when the screen is short */
.fv-screen[hidden]{display:none!important}
.fv-screen *,.fv-screen *::before,.fv-screen *::after{box-sizing:border-box}
#fv-sky{position:fixed;inset:0;z-index:49;width:100%;height:100%;display:block;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 0%,#3a2a14 0%,rgba(23,19,15,0) 60%),linear-gradient(180deg,#1c1610 0%,#120e0b 55%,#0b0806 100%)}
#fv-sky.space{background:#05060d}
#fv-sky[hidden]{display:none}

/* the chapter menu */
#fv-menu .fv-panel{position:relative;width:min(760px,100%);background:rgba(34,28,22,.94);border:1px solid var(--fv-line);border-radius:24px;padding:0 24px 22px;display:flex;flex-direction:column;gap:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.fv-panel::before{content:"";display:block;height:10px;margin-inline:-24px;background:repeating-linear-gradient(-45deg,var(--fv-rig) 0 12px,var(--fv-on-rig) 12px 24px)}
.fv-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 18px;flex-wrap:wrap}
.fv-kicker{margin:0;font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--fv-dim)}
.fv-logo{margin:2px 0 0;font:400 72px/.85 var(--fv-display);letter-spacing:.04em;color:var(--fv-rig)}
.fv-ver{margin:0 0 4px;font:400 26px/1 var(--fv-display);letter-spacing:.12em;color:var(--fv-text)}
.fv-prog{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fv-prog i{display:block;height:6px;border-radius:999px;background:var(--fv-panel-hi)}
.fv-prog i.on{background:var(--fv-good)}
.fv-prog i.cur{background:linear-gradient(90deg,var(--fv-rig),var(--fv-panel-hi))}
.fv-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.fv-ch{display:grid;grid-template-columns:76px minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--fv-line);border-radius:18px;background:var(--fv-panel-hi)}
.fv-ch.next{border-color:var(--fv-rig);box-shadow:0 0 0 1px var(--fv-rig) inset}
.fv-ch.locked{opacity:.55}
.fv-ch img{width:76px;height:76px;display:block;border-radius:18px}
.fv-ch.locked img{filter:grayscale(1) brightness(.6)}
.fv-chn{margin:0;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--fv-dim)}
.fv-ch h2{margin:1px 0 2px;font:400 30px/1 var(--fv-display);letter-spacing:.04em;color:var(--fv-rig)}
.fv-ch h2 small{font:600 16px/1 var(--fv-ui);letter-spacing:.06em;color:var(--fv-text);margin-left:8px;text-transform:uppercase}
.fv-blurb{margin:0;font-size:16px;line-height:1.3;color:var(--fv-text)}
.fv-status{margin:4px 0 0;font-size:14px;font-weight:600;letter-spacing:.04em;color:var(--fv-dim)}
.fv-status.done{color:var(--fv-good)}
.fv-status.prog{color:var(--fv-rig)}
.fv-btn,.fv-primary,.fv-play{font:inherit;border-radius:999px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.fv-play{border:1px solid var(--fv-line);background:var(--fv-panel);color:var(--fv-text);padding:8px 16px;font-size:15px;white-space:nowrap}
.fv-play:hover:not(:disabled){border-color:var(--fv-dim)}
.fv-play:disabled{cursor:default}
.fv-ch.next .fv-play{background:var(--fv-rig);border-color:var(--fv-rig);color:var(--fv-on-rig)}
.fv-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.fv-primary{border:0;padding:12px 24px;background:var(--fv-rig);color:var(--fv-on-rig);font-size:19px}
.fv-primary:hover{filter:brightness(1.08)}
.fv-btn{border:1px solid var(--fv-line);background:var(--fv-panel);color:var(--fv-text);padding:9px 16px;font-size:14px}
.fv-btn:hover{border-color:var(--fv-dim)}
.fv-btn.warn{border-color:var(--fv-danger);color:#ffb3a5}
/* the Backups box (save kit) borrows the chapter menu's colours and button style */
.sk-back{--panel:var(--fv-panel);--line:var(--fv-line);--text:var(--fv-text);--dim:var(--fv-dim);--rig:var(--fv-rig);margin:0!important;font-family:var(--fv-ui)}
.sk .btn{font:inherit;font-size:14px;font-weight:700;border-radius:999px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--fv-line);background:var(--fv-panel-hi);color:var(--fv-text);padding:9px 16px}
.sk .btn:hover{border-color:var(--fv-dim)}
.sk h3{font-family:var(--fv-display);font-weight:400;letter-spacing:.04em}
.fv-note{margin:0;font-size:15px;color:var(--fv-dim)}
.fv-note.err{color:#ffb3a5}
.fv-keys{margin:0 0 0 auto;font-size:13px;color:var(--fv-dim);letter-spacing:.04em}
.fv-screen :focus-visible{outline:2px solid var(--fv-rig);outline-offset:2px}

/* the chapter title card between chapters */
#fv-title{cursor:pointer;text-align:center}
.fv-tc{position:relative;display:grid;justify-items:center;gap:10px;padding:24px;animation:fvIn 1s ease-out both}
.fv-tc .fv-kicker{font-size:15px;letter-spacing:.42em;color:#c9bba2}
.fv-tc h1{margin:0;font:400 clamp(64px,13vw,150px)/.85 var(--fv-display);letter-spacing:.05em;color:var(--fv-rig);text-shadow:0 0 40px rgba(244,180,0,.25)}
.fv-tc .fv-sub{margin:0;font-size:clamp(18px,2.6vw,26px);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.fv-tc .fv-line{width:min(420px,70vw);height:8px;border-radius:999px;background:repeating-linear-gradient(-45deg,var(--fv-rig) 0 10px,var(--fv-on-rig) 10px 20px);transform-origin:left;animation:fvGrow 3.2s linear both}
.fv-tc .fv-hint{margin:6px 0 0;font-size:14px;color:#8d8170;letter-spacing:.08em}
@keyframes fvIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fvGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* the ending */
#fv-end .fv-panel{position:relative;width:min(700px,100%);background:rgba(34,28,22,.95);border:1px solid var(--fv-line);border-radius:24px;padding:0 24px 22px;display:flex;flex-direction:column;gap:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:fvIn .9s ease-out both}

  padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));

/* ---------- textures (procedural and smooth, 64 px per tile) ---------- */
const TS = 64, ATILES = 6, ATL = TS * ATILES;
const TX = { rock: [], ore: [], gas: null, lava: [], core: [], crack: [], concrete: null };
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const lerp = (a, b, t) => a + (b - a) * t;
const mix3 = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
// value noise on a wrapping lattice, so every texture repeats seamlessly across tiles
function lattice(cells, seed) { const R = mulberry(seed), a = new Float32Array(cells * cells); for (let i = 0; i < a.length; i++) a[i] = R(); return a; }
function vnoise(L, cells, u, v) {
  u = (u % 1 + 1) % 1; v = (v % 1 + 1) % 1;
  const x = u * cells, y = v * cells, ix = x | 0, iy = y | 0, fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy), x1 = (ix + 1) % cells, y1 = (iy + 1) % cells;
  const a = L[iy * cells + ix], b = L[iy * cells + x1], c = L[y1 * cells + ix], d = L[y1 * cells + x1];
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}
function makeFbm(base, octs, seed) {
  const Ls = [], cells = [];
  for (let o = 0; o < octs; o++) { cells.push(base << o); Ls.push(lattice(base << o, seed + o * 17)); }
  return (u, v) => { let s = 0, amp = .5, tot = 0; for (let o = 0; o < octs; o++) { s += vnoise(Ls[o], cells[o], u, v) * amp; tot += amp; amp *= .5; } return s / tot; };
}
function wrapped(x, y, r, draw) {
  for (const dx of x < r ? [0, ATL] : x > ATL - r ? [0, -ATL] : [0]) for (const dy of y < r ? [0, ATL] : y > ATL - r ? [0, -ATL] : [0]) draw(x + dx, y + dy);
}

function buildRock(s) {
  const st = STRATA[s], sty = STYLE[s], c = mkCanvas(ATL, ATL), g = c.getContext('2d'), im = g.createImageData(ATL, ATL), d = im.data;
  const f1 = makeFbm(6, 4, 100 + s * 31), f2 = makeFbm(12, 3, 900 + s * 13), f3 = makeFbm(3, 2, 1700 + s * 7);
  const bf = sty.band ? ATILES * Math.max(1, Math.round(12 / sty.band[0])) : 0;
  for (let y = 0; y < ATL; y++) for (let x = 0; x < ATL; x++) {
    const u = x / ATL, v = y / ATL, n = f1(u, v), m = f2(u, v), big = f3(u, v);
    let k = 1 + (n - .5) * sty.n * 4.5 + (m - .5) * sty.n * 3 + (big - .5) * .22;
    if (bf) k += Math.sin(v * Math.PI * 2 * bf + (n - .5) * 7) * sty.band[1] * .8;
    let r = st.col[0] * k, gg = st.col[1] * k, b = st.col[2] * k;
    if (st.glow) { const vein = Math.pow(1 - Math.abs(m * 2 - 1), 7); r += vein * 190; gg += vein * 80; b += vein * 10; }
    const i = (y * ATL + x) * 4;
    d[i] = clamp(r, 0, 255); d[i + 1] = clamp(gg, 0, 255); d[i + 2] = clamp(b, 0, 255); d[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  const R = mulberry(400 + s * 53);
  for (const [p, m, tint] of sty.specks) {
    const n = Math.round(p * ATL * ATL / 34), col = tint || st.col;
    for (let i = 0; i < n; i++) {
      const x = R() * ATL, y = R() * ATL, r = .8 + R() * 1.9, k = tint ? .9 + R() * .2 : m, sq = .6 + R() * .4, rot = R() * 3;
      const fill = `rgba(${clamp(col[0] * k, 0, 255) | 0},${clamp(col[1] * k, 0, 255) | 0},${clamp(col[2] * k, 0, 255) | 0},${tint ? .8 : .65})`;
      wrapped(x, y, r + 1, (px, py) => { g.fillStyle = fill; g.beginPath(); g.ellipse(px, py, r, r * sq, rot, 0, 7); g.fill(); });
    }
  }
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (let i = 0; i < 14; i++) {
    let x = 40 + R() * (ATL - 80), y = 40 + R() * (ATL - 80), a = R() * 6.28;
    g.beginPath(); g.moveTo(x, y);
    for (let j = 0; j < 7; j++) { a += (R() - .5) * 1.1; x += Math.cos(a) * 7; y += Math.sin(a) * 7; g.lineTo(x, y); }
    g.strokeStyle = 'rgba(0,0,0,.26)'; g.lineWidth = 1.2; g.stroke();
  }
  return c;
}

function buildOre(k, v) {
  const o = ORES[k], c = mkCanvas(TS, TS), g = c.getContext('2d'), R = mulberry(7001 + k * 31 + v * 5), base = hex(o.col), hi = hex(o.hi);
  const rgb = (a, t = 1) => `rgb(${a.map(q => clamp(q * t, 0, 255) | 0).join(',')})`;
  const n = k === SULFUR ? 4 : 5;
  g.lineJoin = 'round';
  for (let i = 0; i < n; i++) {
    const cx = 11 + R() * 42, cy = 11 + R() * 42, r = 5.5 + R() * 5;
    g.save(); g.translate(cx, cy);
    g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 4; g.shadowOffsetY = 2;
    if (k === SULFUR) {
      // a hexagonal crystal: shaded left face, lit right face and a bright tip
      const tilt = (R() - .5) * 1.2, w = r * .55, h = r * 1.25, P = (px, py) => g.lineTo(px * Math.cos(tilt) - py * Math.sin(tilt), px * Math.sin(tilt) + py * Math.cos(tilt));
      const face = (col, pts) => { g.fillStyle = col; g.beginPath(); pts.forEach(([px, py], j) => j ? P(px, py) : g.moveTo(px * Math.cos(tilt) - py * Math.sin(tilt), px * Math.sin(tilt) + py * Math.cos(tilt))); g.closePath(); g.fill(); };
      face(rgb(base, .78), [[-w, -h * .55], [0, -h * .3], [0, h], [-w, h * .7]]);
      g.shadowColor = 'transparent';
      face(rgb(base, 1.08), [[0, -h * .3], [w, -h * .55], [w, h * .7], [0, h]]);
      face(rgb(hi), [[-w, -h * .55], [0, -h], [w, -h * .55], [0, -h * .3]]);
      g.strokeStyle = 'rgba(80,66,0,.5)'; g.lineWidth = .8; g.beginPath(); g.moveTo(0, -h * .3); P(0, h); g.stroke();
    } else {
      const rot = R() * 6.28, cnt = 8 + (R() * 3 | 0), pts = [];
      for (let j = 0; j < cnt; j++) { const a = rot + j / cnt * 6.283, rr = r * (.72 + R() * .5); pts.push([Math.cos(a) * rr, Math.sin(a) * rr]); }
      const lg = g.createLinearGradient(-r, -r, r, r);
      lg.addColorStop(0, rgb(hi)); lg.addColorStop(.45, rgb(base)); lg.addColorStop(1, rgb(base, .42));
      g.fillStyle = lg; g.beginPath(); pts.forEach(([px, py], j) => j ? g.lineTo(px, py) : g.moveTo(px, py)); g.closePath(); g.fill();
      g.shadowColor = 'transparent';
      g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = .9; g.stroke();
      g.fillStyle = k === COAL ? 'rgba(255,255,255,.4)' : 'rgba(255,255,255,.55)';
      g.beginPath(); g.ellipse(-r * .3, -r * .35, r * .28, r * .13, -.7, 0, 7); g.fill();
      if (k === COPPER) { g.fillStyle = 'rgba(79,176,138,.85)'; g.beginPath(); g.arc(r * .3, r * .25, r * .16, 0, 7); g.arc(-r * .1, r * .45, r * .1, 0, 7); g.fill(); }
      if (k === IRON) { g.fillStyle = 'rgba(70,26,12,.55)'; g.beginPath(); g.arc(r * .25, r * .1, r * .2, 0, 7); g.arc(-r * .35, r * .3, r * .12, 0, 7); g.fill(); }
    }
    g.restore();
  }
  return c;
}

function buildGas(v) {
  const c = mkCanvas(TS, TS), g = c.getContext('2d'), R = mulberry(3301 + v);
  // the pocket fills about 90% of the block, so it is hard to miss
  const lg = g.createRadialGradient(28, 24, 4, 32, 32, 44);
  lg.addColorStop(0, '#efd9ff'); lg.addColorStop(.45, '#a45fe6'); lg.addColorStop(1, '#4e1f8f');
  g.fillStyle = lg; g.beginPath(); g.roundRect(1.5, 1.5, 61, 61, 10); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.16)'; g.lineWidth = 2;
  for (let i = 0; i < 5; i++) { g.beginPath(); g.arc(8 + R() * 48, 8 + R() * 48, 6 + R() * 10, R() * 6, R() * 6 + 2); g.stroke(); }
  for (let i = 0; i < 9; i++) {
    const x = 7 + R() * 50, y = 7 + R() * 50, r = 2 + R() * 6, bg = g.createRadialGradient(x - r * .3, y - r * .3, 0, x, y, r);
    bg.addColorStop(0, 'rgba(255,255,255,.75)'); bg.addColorStop(.6, 'rgba(220,180,255,.25)'); bg.addColorStop(1, 'rgba(90,40,160,.4)');
    g.fillStyle = bg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  return c;
}

const LAVA = [];
function buildLava(kind, f) {
  const N = TS * 3, c = mkCanvas(N, N), g = c.getContext('2d'), im = g.createImageData(N, N), d = im.data;
  const fb = LAVA[kind] || (LAVA[kind] = makeFbm(3, 4, 5100 + kind * 1000)), sh = f / 12;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const n = fb(x / N + sh, y / N), heat = 1 - clamp(Math.abs(n - .5) * 6, 0, 1);
    let col;
    if (kind) col = mix3([196, 160, 108], [255, 244, 210], heat);
    else if (heat < .25) col = mix3([34, 13, 10], [118, 26, 16], heat / .25);
    else if (heat < .62) col = mix3([118, 26, 16], [238, 98, 24], (heat - .25) / .37);
    else col = mix3([238, 98, 24], [255, 226, 128], (heat - .62) / .38);
    const i = (y * N + x) * 4; d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  return c;
}

function buildConcrete() {
  const c = mkCanvas(TS, TS), g = c.getContext('2d'), R = mulberry(6601);
  g.fillStyle = vgradC(g, 0, TS, [[0, '#8e8a83'], [1, '#6f6b65']]); g.fillRect(0, 0, TS, TS);
  for (let i = 0; i < 260; i++) { g.fillStyle = R() < .5 ? 'rgba(255,255,255,.07)' : 'rgba(0,0,0,.09)'; g.fillRect(R() * TS, R() * TS, 1 + R() * 2, 1 + R() * 2); }
  return c;
}
function vgradC(g, y0, y1, stops) { const gr = g.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, col]) => gr.addColorStop(o, col)); return gr; }

function buildCracks() {
  const R = mulberry(4242), branches = [];
  for (let b = 0; b < 8; b++) {
    let x = 32 + (R() - .5) * 14, y = 32 + (R() - .5) * 14, a = R() * 6.28;
    const pts = [[x, y]];
    for (let j = 0; j < 5 + (R() * 3 | 0); j++) { a += (R() - .5) * 1.2; x += Math.cos(a) * (5 + R() * 3); y += Math.sin(a) * (5 + R() * 3); pts.push([x, y]); }
    branches.push(pts);
  }
  return [3, 5, 8].map(cnt => {
    const c = mkCanvas(TS, TS), g = c.getContext('2d');
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (const [w, col] of [[3.2, 'rgba(0,0,0,.25)'], [1.8, 'rgba(10,6,4,.85)']]) {
      g.lineWidth = w; g.strokeStyle = col;
      branches.slice(0, cnt).forEach(pts => { g.beginPath(); pts.forEach(([px, py], j) => j ? g.lineTo(px, py) : g.moveTo(px, py)); g.stroke(); });
    }
    return c;
  });
}

function buildTextures() {
  STRATA.forEach((_, s) => { TX.rock[s] = buildRock(s); });
  ORES.forEach((_, k) => { TX.ore[k] = [buildOre(k, 0), buildOre(k, 1)]; });
  TX.gas = [buildGas(0), buildGas(1)];
  for (let f = 0; f < 4; f++) { TX.lava[f] = buildLava(0, f); TX.core[f] = buildLava(1, f); }
  TX.concrete = buildConcrete();
  TX.crack = buildCracks();
}

/* ---------- input ---------- */
const held = [];
const KEYS = { arrowleft: 'L', a: 'L', arrowright: 'R', d: 'R', arrowup: 'U', w: 'U', arrowdown: 'D', s: 'D' };
const press = d => { if (!held.includes(d)) held.push(d); };
const release = d => { const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); };
const curDir = () => held[held.length - 1] || null;
// how you are playing right now: 'key' (keyboard and mouse), 'touch' or 'pad' (a gamepad); the words on screen follow it
const coarse = () => matchMedia('(pointer: coarse)').matches;
let inputMode = '';
const say = (key, touch, pad) => inputMode === 'touch' ? touch : inputMode === 'pad' ? pad : key;

/* ---------- actions ---------- */
const moveDur = () => .15 / Math.sqrt(motor());
const climbDur = () => Math.max(.04, .16 - G.climbN * .015) / Math.sqrt(motor());
const fallDur = () => Math.max(.045, .14 - G.fallN * .016);
const drillDur = m => (.2 + m * .1) / (motor() * L('bit').speed);
const atDepot = () => S.depotBuilt && S.y === SURF - 1 && S.x >= DEPOT_X && S.x < DEPOT_X + DEPOT_W;
function checkDebris() {
  if (S.depotBuilt || S.y < SURF - 3 || S.y > SURF - 1) return;
  const i = DEBRIS.findIndex((d, k) => d.x === S.x && !S.debris[k]);
  if (i < 0) return;
  S.debris[i] = true;
  const n = S.debris.filter(Boolean).length;
  floats.push({ x: S.x + .5, y: S.y - .2, text: `+ ${DEBRIS[i].name}`, col: '#93cfe0', age: 0 });
  emit(S.x + .5, SURF - .3, 10, () => Math.random() < .5 ? '#fff1b8' : '#93cfe0', 3, .6, 16, 'spark');
  sfx.ore(1);
  if (n < DEBRIS.length) { toast(`Salvaged the ${DEBRIS[i].name}. ${n} of ${DEBRIS.length} pieces.`); save(); return; }
  S.depotBuilt = true;
  emit(DEPOT_X + DEPOT_W / 2, SURF - 1, 40, () => ['#fff1b8', RIG][Math.random() * 2 | 0], 6, 1, 16, 'spark');
  emit(DEPOT_X + DEPOT_W / 2, SURF - .6, 24, () => Math.random() < .5 ? '#b9ad98' : '#8d949b', 2.5, 1.4, -.5, 'dust');
  sfx.cast(); sfx.buy();
  toast('All pieces salvaged. The depot is built from the wreckage. Now sell 20 of every ore and bar to rebuild the satellite.');
  checkDock(); save();
}

function startMove(tx, ty, dur, type) { G.act = { type, fromX: S.x, fromY: S.y, toX: tx, toY: ty, t: 0, dur }; }
function bump(msg) {
  if (msg) hint(msg);
  sfx.bump();
  G.act = { type: 'bump', fromX: S.x, fromY: S.y, toX: S.x, toY: S.y, t: 0, dur: .32 };
}

function decide() {
  const x = S.x, y = S.y, dir = curDir(), supported = solidAt(x, y + 1);
  G.thrust = dir === 'U';
  if (dir === 'U') {
    G.fallN = 0;
    if (y > 0 && tileAt(x, y - 1) === AIR) { G.face = G.body; G.climbN++; startMove(x, y - 1, climbDur(), 'climb'); return; }
    G.climbN = 0;
    if (y >= SURF) { G.face = 'U'; tryDrill(x, y - 1); return; }
    return;
  }
  G.climbN = 0;
  if (dir === 'L' || dir === 'R') {
    G.face = G.body = dir;
    const nx = x + (dir === 'L' ? -1 : 1);
    if (tileAt(nx, y) === AIR) { startMove(nx, y, moveDur(), 'move'); return; }
    if (supported) { tryDrill(nx, y); return; }
  } else if (dir === 'D') {
    G.face = 'D';
    if (supported) { tryDrill(x, y + 1); return; }
  }
  if (!supported) { G.fallN++; startMove(x, y + 1, fallDur(), 'fall'); }
}

function tryDrill(tx, ty) {
  const t = tileAt(tx, ty);
  if (t === EDGE) return bump('That is the edge of the claim.');
  if (t === CENTER) return bump('This is the center of planet 1.7305.d. Every direction from here is up.');
  if (t === CONCRETE) return bump('The depot pad is reinforced concrete. Go round it.');
  const st = STRATA[strataOf(tx, ty)];
  if (st.temp > shield()) return bump(`${st.name} is ${fmt(st.temp)} °C. Your heat shield is rated ${fmt(shield())} °C.`);
  if (t === MAGMA) {
    const what = moltenName(tx, ty);
    setTile(tx, ty, AIR);
    emit(tx + .5, ty + .5, 12, () => Math.random() < .5 ? '#ffb347' : '#ff7a2e', 3, .7, -1, 'fire');
    emit(tx + .5, ty + .5, 10, () => '#d8d2ca', 2, 1.3, -2.2, 'smoke'); // a hiss of steam
    hurt(34, what);
    if (!G.breach) bump();
    return;
  }
  const m = tileMohs(t, tx, ty);
  if (m > bitMohs()) return bump(`${tileName(t, tx, ty)} is Mohs ${m}. Your ${L('bit').label.toLowerCase()} bit is rated ${bitMohs()}.`);
  if (t === GAS) return explode(tx, ty);
  G.act = { type: 'drill', tx, ty, m, fromX: S.x, fromY: S.y, toX: S.x, toY: S.y, t: 0, dur: drillDur(m) };
  sfx.drill(G.act.dur, m);
}

function explode(gx, gy) {
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const x = gx + dx, y = gy + dy;
    if (x < 0 || x >= COLS || y < SURF || y >= SURF + GROUND) continue;
    const t = tileAt(x, y);
    if (t === CONCRETE || t === CENTER) continue;
    if (t !== AIR) emit(x + .5, y + .5, 5, () => tileColor(t, x, y), 5, .8);
    if (t !== AIR) emit(x + .5, y + .5, 2, () => tileColor(ROCK, x, y), 2, 1.4, -.4, 'dust');
    setTile(x, y, AIR);
  }
  emit(gx + .5, gy + .5, 55, () => ['#fff1b8', '#ffb02e', '#ff6a1f'][Math.random() * 3 | 0], 9, .7, 4, 'fire');
  emit(gx + .5, gy + .5, 18, () => Math.random() < .5 ? '#6b5a4c' : '#4a4038', 3, 1.8, -1.2, 'smoke');
  G.boom = { x: gx + .5, y: gy + .5, t: 0 }; // the flash lights up the rock round it
  G.shake = 1;
  sfx.boom();
  hurt(30, 'Gas pocket');
  if (!G.breach) bump();
}

function hurt(n, why) {
  if (G.breach) return;
  S.hull = Math.max(0, S.hull - n);
  G.shake = Math.max(G.shake, .6);
  sfx.hurt();
  stage.classList.remove('hit'); void stage.offsetWidth; stage.classList.add('hit');
  if (S.hull <= 0) {
    G.breach = { t: 0, d: Math.round(depthOf(S.y)) };
    G.act = null;
    emit(S.x + .5, S.y + .5, 60, () => ['#fff1b8', '#ffb02e', RIG][Math.random() * 3 | 0], 8, 1, 6, 'fire');
    emit(S.x + .5, S.y + .5, 24, () => Math.random() < .5 ? '#2b2622' : '#4a4038', 3, 2, -1, 'smoke');
    emit(S.x + .5, S.y + .5, 16, () => RIG, 6, 1.2, 16); // bits of the yellow hull
    G.boom = { x: S.x + .5, y: S.y + .5, t: 0 };
    sfx.boom();
    toast(`${why}. Hull breached at ${G.breach.d} m.`);
  } else toast(`${why}: hull −${n}.`);
}

function land() {
  const n = G.fallN; G.fallN = 0;
  if (n > 1) {
    emit(S.x + .5, S.y + .95, Math.min(14, n * 2), () => tileColor(ROCK, S.x, S.y + 1), 2.5, .5);
    emit(S.x + .5, S.y + .95, Math.min(10, n * 2), () => S.y === SURF - 1 ? '#8f7a5a' : tileColor(ROCK, S.x, S.y + 1), 2.2, 1, -.3, 'dust');
    G.shake = Math.max(G.shake, Math.min(.5, n * .05));
  }
  if (n > 4 && S.y >= SURF) hurt((n - 4) * 6, `Fell ${n * MPT} m`);
}

function collect(k, tx, ty) {
  const o = ORES[k];
  S.mined++;
  if (!S.found[k]) { S.found[k] = true; toast(`New find: ${o.name}. Mohs ${o.mohs}, assays at $${o.price} raw.`); }
  if (cargoN() >= holdCap()) { hint(`Hold full. ${o.name} left behind.`); return; }
  S.cargo[k]++;
  floats.push({ x: tx + .5, y: ty + .2, text: `+ ${o.name}`, col: k === COAL ? '#b9b2aa' : o.col, age: 0 });
  sfx.ore(k);
  flyToBay('ore', k);
}

function finish() {
  const a = G.act; G.act = null;
  if (a.type === 'bump') return;
  if (a.type === 'drill') {
    const t = tileAt(a.tx, a.ty);
    if (t === AIR) return;
    setTile(a.tx, a.ty, AIR);
    emit(a.tx + .5, a.ty + .5, 10, () => tileColor(t, a.tx, a.ty), 4, .6);
    emit(a.tx + .5, a.ty + .5, 4, () => tileColor(ROCK, a.tx, a.ty), 1.5, 1.1, -.4, 'dust');
    if (t >= ORE0) collect(t - ORE0, a.tx, a.ty);
    startMove(a.tx, a.ty, .1, 'enter');
    return;
  }
  S.x = a.toX; S.y = a.toY;
  const d = depthOf(S.y);
  if (d > S.maxDepth) S.maxDepth = d;
  if (G.fallN > 0 && solidAt(S.x, S.y + 1)) land();
  checkDebris();
  checkDock();
  if (d >= BOTTOM_M && !S.center) { S.center = true; save(); showWin(); }
}

/* ---------- smelter ----------
   The smelter stands at the depot. Ore is put in at the depot ("Smelt it"); it works through that queue while the ship is
   away, stacks the bars beside it, and they are sold the next time the ship docks (straight away while it is parked). */

  if (!S.barTip) { S.barTip = true; toast(`Your first ${bar.name.toLowerCase()}! Bars sell for much more than raw ore, and the satellite needs ${GOAL} of each kind.`); }
  if (G.docked) {

// put every full recipe in the hold into the smelter; ore that makes no full bar stays aboard to sell raw

/* ---------- the upgrade show ----------
   A robot arm comes down from the depot's ceiling and welds the new part on. When it is fitted, the part flashes, the
   ship hops, sparks burst out, its own sound plays and a sign says what it is. The smelter's upgrade happens at the
   smelter instead. The ship keeps showing the old part until the arm has finished. */
const UP_EXT = .45, UP_FIT = 1.6, UP_END = 2.3;

// where the arm welds, in the ship's 16-unit box
function upTarget(id, face = G.face) {

  return { heat: [12.9, 7.5], motor: [5.4, 12.6], hold: [3, 3.4], hull: [8.5, 10.2], lamp: [12.4, 2.4] }[id] || [8, 6];
}
// the level each part is drawn at: the old one while the arm is still working on it
function shownUp() {
  const lv = Object.assign({}, S.up), f = G.upFx;

}

function stepUpgrade(dt) {

      if (Math.random() < .35) sfx.weld();

    emit(wx, wy, f.max ? 40 : 22, () => gold[Math.random() * 3 | 0], f.max ? 8 : 6, .8, 3, 'spark');
    if (f.max) emit(G.fx + .5, G.fy + .3, 40, () => CONFETTI[Math.random() * CONFETTI.length | 0], 7, 1.6, 7, 'chip');
    banner(f.max ? 'Fully upgraded!' : 'Upgraded!', u.name, u.fmt(l), UP_ICON[f.id], f.max ? '⭐' : '🔧', f.max ? '' : 'up');

/* ---------- depot ---------- */
function checkDock() {
  const now = atDepot();
  if (now && !G.docked) { G.docked = true; sell(); openDepot(); }
  else if (!now && G.docked) { G.docked = false; closeDepot(); }
}
function sell() {
  let total = 0;
  const sold = [];
  BARS.forEach((b, i) => { const n = S.bars[i]; if (n) { total += n * b.price; sold.push(plural(n, b.name.toLowerCase())); S.sold.bar[i] += n - S.bought.bar[i]; } S.bars[i] = 0; S.bought.bar[i] = 0; });
  const stacked = [];
  BARS.forEach((b, i) => { const n = S.smelt.stack[i]; if (n) { total += n * b.price; stacked.push(plural(n, b.name.toLowerCase())); S.sold.bar[i] += n; } S.smelt.stack[i] = 0; });
  const what = [andList(sold), stacked.length ? `${andList(stacked)} from the smelter` : ''].filter(Boolean).join(', and ');
  const repaired = S.hull < hullMax();
  S.hull = hullMax(); S.cash += total; S.earned += total;
  saleLine = (total ? `Sold ${what} for $${fmt(total)}.` : 'No bars to sell yet.') + (repaired ? ' Hull repaired.' : '');
  if (total) sfx.sell();
  save();
  checkRebuild();
}
function sellRaw() {
  let total = 0;
  const sold = [];
  ORES.forEach((o, k) => { const n = S.cargo[k]; if (n) { total += n * o.price; sold.push(`${n} ${o.name.toLowerCase()}`); S.sold.ore[k] += n - S.bought.ore[k]; } S.cargo[k] = 0; S.bought.ore[k] = 0; });
  if (!total) return;
  S.cash += total; S.earned += total;
  saleLine = `Sold ${andList(sold)} as raw ore for $${fmt(total)}.`;
  sfx.sell(); renderDepot(); save();
  checkRebuild();
}
function buy(id) {
  const u = UP[id], cur = S.up[id];
  if (cur >= u.lv.length - 1) return;
  const next = u.lv[cur + 1];
  if (S.cash < next.cost) { hint(`${u.name} upgrade costs $${fmt(next.cost)}. You have $${fmt(S.cash)}.`); sfx.bump(); return; }
  S.cash -= next.cost; S.up[id]++;

  renderDepot(); syncLog(); save();

function shopBuy(kind, i, want) {
  const ore = kind === 'ore', it = ore ? ORES[i] : BARS[i], price = it.price * MARKUP;
  const room = holdCap() - cargoN(), n = Math.min(want, room, Math.floor(S.cash / price));

/* ---------- particles ----------

   off light, so they are drawn over the darkness with additive blending) */
function emit(x, y, n, colFn, spd, life, grav = 16, kind = 'chip') {
  if (reduced) n = Math.ceil(n / 3);

    const ang = Math.random() * Math.PI * 2, v = spd * (.3 + Math.random());
    parts.push({ x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v - spd * .4, life: life * (.5 + Math.random() * .7), age: 0, col: colFn(i), g: grav, sz: Math.random() < .3 ? 2 : 1,
      kind, rot: Math.random() * 6.28, vr: (Math.random() - .5) * 18 });

  for (const p of parts) {

/* ---------- update ---------- */

function paintRig(ctx, o) {   // the drill ship in a 16-unit box at the current transform

  }

function drawPod(cx, cy, now) {
  if (G.breach) return;
  const a = G.act, busy = a && (a.type === 'drill' || a.type === 'bump');
  let px = G.fx * T - cx, py = G.fy * T - cy;
  if (busy && !reduced) { px += (Math.random() - .5) * U * .9; py += (Math.random() - .5) * U * .9; }
  const flip = G.body === 'L';
  G.podX = px; G.podY = py;
  const lv = shownUp(), hop = hopY() * U;
  ctx.save(); ctx.translate(px + (flip ? T : 0), py - hop); ctx.scale(flip ? -U : U, U);
  paintRig(ctx, { now, down: G.face === 'D', up: G.face === 'U', thrust: G.thrust || (a && a.type === 'climb'), bit: BITCOL[lv.bit], spin: a && a.type === 'drill' ? now / 60 : 0, roll: a && a.type === 'move' ? a.t / a.dur * 3 : 0, load: binLoad(), lv });
  paintFlash(ctx, G.upFx);
  if (G.docked) { ctx.translate(0, hop / U); paintArm(ctx, G.upFx, now); }
  ctx.restore();
}
// a point given in the ship's own 16-unit box, on screen (the ship is mirrored when it faces left)
const podPt = (ux, uy) => [G.podX + (G.body === 'L' ? T - ux * U : ux * U), G.podY + uy * U];
const tipPt = () => G.face === 'D' ? podPt(8, 16.8) : G.face === 'U' ? podPt(8, -4) : podPt(17.6, 7.9);

/* ---------- particles on screen ---------- */
// soft round puffs, one small sprite per colour, so dust and smoke have no hard edges
const softSprites = new Map();
function soft(col) {
  let c = softSprites.get(col);
  if (!c) {
    c = mkCanvas(32, 32); const g = c.getContext('2d'), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    g.fillStyle = col; g.fillRect(0, 0, 32, 32);
    gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(.45, 'rgba(0,0,0,.6)'); gr.addColorStop(1, 'rgba(0,0,0,0)');

function drawParts(cx, cy) {
  for (const p of parts) {
    const kd = p.kind;
    if (kd === 'spark' || kd === 'fire') continue;
    const k = p.age / p.life, al = clamp(1 - k, 0, 1), x = p.x * T - cx, y = p.y * T - cy;
    if (kd === 'dust' || kd === 'smoke') {

      ctx.globalAlpha = al * (kd === 'smoke' ? .55 : .42) * Math.min(1, p.age * 10);
      ctx.drawImage(soft(p.col), x - r, y - r, r * 2, r * 2);

  const names = $('#names'), H = names.clientHeight, n = logNames.length;

  names.style.visibility = H >= n * 11.5 ? '' : 'hidden'; // too short to list them all: the coloured strip alone still shows the layers

}

    else if (heat < .62) col = mix3([118, 26, 16], [238, 98, 24], (heat - .25) / .37);
    else col = mix3([238, 98, 24], [255, 226, 128], (heat - .62) / .38);
    const i = (y * N + x) * 4; d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  return c;
}

function buildConcrete() {
  // the landing pad: regolith fused into dark, glassy slag by the pod's retro burn
  const c = mkCanvas(TS, TS), g = c.getContext('2d'), R = mulberry(6601);
  g.fillStyle = vgradC(g, 0, TS, [[0, '#4d3529'], [1, '#2b1d16']]); g.fillRect(0, 0, TS, TS);
  for (let i = 0; i < 26; i++) {
    const x = R() * TS, y = R() * TS, r = 3 + R() * 7, gr = g.createRadialGradient(x - r * .35, y - r * .35, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,214,176,.2)'); gr.addColorStop(.5, 'rgba(120,70,50,.12)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = .8;
  for (let i = 0; i < 6; i++) {
    let x = R() * TS, y = R() * TS, a = R() * 6.3;
    g.beginPath(); g.moveTo(x, y);
    for (let j = 0; j < 4; j++) { a += (R() - .5) * 1.4; x += Math.cos(a) * 6; y += Math.sin(a) * 6; g.lineTo(x, y); }
    g.stroke();
  }
  for (let i = 0; i < 140; i++) { g.fillStyle = R() < .5 ? 'rgba(255,240,220,.08)' : 'rgba(0,0,0,.16)'; g.fillRect(R() * TS, R() * TS, 1 + R() * 1.6, 1 + R() * 1.6); }
  return c;
}
function buildRecorder() {
  // an orange flight recorder, half-buried in the rock
  const c = mkCanvas(TS, TS), g = c.getContext('2d');
  g.save(); g.translate(32, 33); g.rotate(-.28);
  g.shadowColor = 'rgba(0,0,0,.65)'; g.shadowBlur = 6; g.shadowOffsetY = 3;
  const body = g.createLinearGradient(0, -11, 0, 11); body.addColorStop(0, '#ffb062'); body.addColorStop(.35, '#f2731f'); body.addColorStop(1, '#7c2f0c');
  g.fillStyle = body; g.beginPath(); g.roundRect(-19, -10, 38, 20, 5); g.fill();
  g.shadowColor = 'transparent';
  // reflective bands, end caps and the warning plate
  g.fillStyle = 'rgba(236,232,222,.9)'; g.fillRect(-12, -10, 3.5, 20); g.fillRect(8.5, -10, 3.5, 20);
  const cap = g.createLinearGradient(0, -9, 0, 9); cap.addColorStop(0, '#6b6660'); cap.addColorStop(1, '#262321');
  g.fillStyle = cap; g.beginPath(); g.roundRect(-22, -8, 4, 16, 1.5); g.roundRect(18, -8, 4, 16, 1.5); g.fill();
  g.fillStyle = '#1b1712'; g.fillRect(-7, -5, 14, 7);
  g.fillStyle = '#e8e2d6'; g.fillRect(-5.5, -3.5, 11, 1.2); g.fillRect(-5.5, -1, 7, 1.2);
  g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.roundRect(-17, -8.5, 34, 3, 1.5); g.fill();
  g.strokeStyle = 'rgba(40,14,4,.6)'; g.lineWidth = .8; g.beginPath(); g.roundRect(-19, -10, 38, 20, 5); g.stroke();
  // scratches from the fall
  g.strokeStyle = 'rgba(60,20,6,.55)'; g.lineWidth = .7; g.beginPath(); g.moveTo(-3, 4); g.lineTo(6, 8); g.moveTo(10, -6); g.lineTo(15, -2); g.stroke();
  g.restore();
  return c;
}
function vgradC(g, y0, y1, stops) { const gr = g.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, col]) => gr.addColorStop(o, col)); return gr; }

function buildCracks() {
  const R = mulberry(4242), branches = [];
  for (let b = 0; b < 8; b++) {
    let x = 32 + (R() - .5) * 14, y = 32 + (R() - .5) * 14, a = R() * 6.28;
    const pts = [[x, y]];
    for (let j = 0; j < 5 + (R() * 3 | 0); j++) { a += (R() - .5) * 1.2; x += Math.cos(a) * (5 + R() * 3); y += Math.sin(a) * (5 + R() * 3); pts.push([x, y]); }
    branches.push(pts);
  }
  return [3, 5, 8].map(cnt => {
    const c = mkCanvas(TS, TS), g = c.getContext('2d');
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (const [w, col] of [[3.2, 'rgba(0,0,0,.25)'], [1.8, 'rgba(10,6,4,.85)']]) {
      g.lineWidth = w; g.strokeStyle = col;
      branches.slice(0, cnt).forEach(pts => { g.beginPath(); pts.forEach(([px, py], j) => j ? g.lineTo(px, py) : g.moveTo(px, py)); g.stroke(); });
    }
    return c;
  });
}

function buildTextures() {
  STRATA.forEach((_, s) => { TX.rock[s] = buildRock(s); });
  ORES.forEach((_, k) => { TX.ore[k] = [buildOre(k, 0), buildOre(k, 1)]; });
  TX.gas = [buildGas(0), buildGas(1)];
  for (let f = 0; f < 4; f++) { TX.lava[f] = buildLava(0, f); TX.core[f] = buildLava(1, f); }
  TX.concrete = buildConcrete();
  TX.rec = buildRecorder();
  TX.crack = buildCracks();
}

/* ---------- input ---------- */
const held = [];
const KEYS = { arrowleft: 'L', a: 'L', arrowright: 'R', d: 'R', arrowup: 'U', w: 'U', arrowdown: 'D', s: 'D' };
const press = d => { if (!held.includes(d)) held.push(d); };
const release = d => { const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); };
const curDir = () => held[held.length - 1] || null;
const keyDown = {}; // which direction keys are physically down right now
const gpDrive = {}; // which directions a gamepad is holding down right now
// how the player is playing: keys, touch or a gamepad. It picks the wording on screen and shows or hides the touch pad.
const COARSE = matchMedia('(pointer:coarse)').matches;
const app = $('.app');
let inputMode = COARSE ? 'touch' : 'key';
app.dataset.input = inputMode;
function setInput(m) { if (m !== inputMode) { inputMode = m; app.dataset.input = m; } } // the panels pick up the new wording on the next frame
const tapWord = () => inputMode === 'touch' ? 'Tap' : inputMode === 'pad' ? 'Press A' : 'Click';

/* ---------- actions ---------- */
const moveDur = () => .15 / Math.sqrt(motor());
const climbDur = () => Math.max(.04, .16 - G.climbN * .015) / Math.sqrt(motor());
const fallDur = () => Math.max(.045, .14 - G.fallN * .016);
const drillDur = m => (.2 + m * .1) / (motor() * L('bit').speed);
const atDepot = () => S.y === SURF - 1 && S.x >= DEPOT_X && S.x < DEPOT_X + DEPOT_W;
const inShelter = () => { const s = S.station; return S.x >= s.x0 && S.x < s.x0 + 4 && S.y >= s.y0 && S.y <= s.y0 + 2; };
function checkShelter() {
  if (S.rescued || !inShelter()) return;
  S.rescued = true;
  const s = S.station;
  emit(s.x0 + 3.6, s.y0 + 1.6, 30, () => ['#fff1b8', '#ffd27a', '#e8e2d6'][Math.random() * 3 | 0], 3, 1, 2);
  sfx.rescue();
  save();
  showLog(`Halden deep shelter · ${SHELTER_M} m`, `${SURVIVOR} is alive`,
    `The shelter hatch grinds open and a figure in an orange suit steps into your headlamp. “I heard your drill coming through the rock and thought I was dreaming.” ${SURVIVOR} climbs into the drill ship’s cab beside you. The hollow below is still a mystery, but it can wait. Get back to the escape pod.`);
}
function recoverLog(tx, ty) {
  const i = S.recs.findIndex(r => r.x === tx && r.y === ty);
  if (i < 0 || S.logs[i]) return;
  S.logs[i] = true;
  floats.push({ x: tx + .5, y: ty + .2, text: '+ Flight recorder', col: '#ffb070', age: 0 });
  sfx.log(); save();
  showLog(`Flight recorder ${i + 1} of ${LOGS.length} · ${logsFound()} found`, LOGS[i].title, `“${LOGS[i].text}”`);
}

function startMove(tx, ty, dur, type) { G.act = { type, fromX: S.x, fromY: S.y, toX: tx, toY: ty, t: 0, dur }; }
function bump(msg) {
  if (msg) hint(msg);
  sfx.bump();
  G.act = { type: 'bump', fromX: S.x, fromY: S.y, toX: S.x, toY: S.y, t: 0, dur: .32 };
}

function decide() {
  const x = S.x, y = S.y, dir = curDir(), supported = solidAt(x, y + 1);
  G.thrust = dir === 'U';
  if (dir === 'U') {
    G.fallN = 0;
    if (y > 0 && tileAt(x, y - 1) === AIR) { G.face = G.body; G.climbN++; startMove(x, y - 1, climbDur(), 'climb'); return; }
    G.climbN = 0;
    if (y >= SURF) { G.face = 'U'; tryDrill(x, y - 1); return; }
    return;
  }
  G.climbN = 0;
  if (dir === 'L' || dir === 'R') {
    G.face = G.body = dir;
    const nx = x + (dir === 'L' ? -1 : 1);
    if (tileAt(nx, y) === AIR) { startMove(nx, y, moveDur(), 'move'); return; }
    if (supported) { tryDrill(nx, y); return; }
  } else if (dir === 'D') {
    G.face = 'D';
    if (supported) { tryDrill(x, y + 1); return; }
  }
  if (!supported) { G.fallN++; startMove(x, y + 1, fallDur(), 'fall'); }
}

function tryDrill(tx, ty) {
  const t = tileAt(tx, ty);
  if (t === EDGE) return bump('That is the edge of the claim.');
  if (t === CENTER) return bump(`Below this is the magma ocean of ${PLANET}. Nothing can drill through it.`);
  if (t === CONCRETE) return bump('The pod’s retro burn fused this ground into solid glass.');
  if (t === STATION) return bump('The armored wall of Halden’s deep shelter. The hatch faces the cave.');
  const st = STRATA[strataOf(tx, ty)];
  if (st.temp > shield()) return bump(`${st.name} is ${fmt(st.temp)} °C. Your heat shield is rated ${fmt(shield())} °C.`);
  if (t === MAGMA) {
    const what = moltenName(tx, ty);
    setTile(tx, ty, AIR);
    emit(tx + .5, ty + .5, 18, () => Math.random() < .5 ? '#ffb347' : '#e8e2da', 3, .9, -2);
    hurt(34, what);
    if (!G.breach) bump();
    return;
  }
  const m = tileMohs(t, tx, ty);
  if (m > bitMohs()) return bump(`${tileName(t, tx, ty)} is Mohs ${m}. Your ${L('bit').label.toLowerCase()} bit is rated ${bitMohs()}.`);
  if (t === GAS) return explode(tx, ty);
  G.act = { type: 'drill', tx, ty, m, fromX: S.x, fromY: S.y, toX: S.x, toY: S.y, t: 0, dur: drillDur(m) };
  sfx.drill(G.act.dur, m);
}

function explode(gx, gy) {
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const x = gx + dx, y = gy + dy;
    if (x < 0 || x >= COLS || y < SURF || y >= SURF + GROUND) continue;
    const t = tileAt(x, y);
    if (t === CONCRETE || t === CENTER || t === STATION || t === RECORDER) continue;
    if (t !== AIR) emit(x + .5, y + .5, 5, () => tileColor(t, x, y), 5, .8);
    setTile(x, y, AIR);
  }
  emit(gx + .5, gy + .5, 60, () => ['#fff1b8', '#ffb02e', '#ff6a1f', '#6b5a4c'][Math.random() * 4 | 0], 9, .7, 4);
  booms.push({ x: gx + .5, y: gy + .5, r: 2.4, age: 0 });
  G.shake = 1;
  sfx.boom();
  hurt(30, 'Gas pocket');
  if (!G.breach) bump();
}

function hurt(n, why) {
  if (G.breach) return;
  S.hull = Math.max(0, S.hull - n);
  G.shake = Math.max(G.shake, .6);
  sfx.hurt();
  stage.classList.remove('hit'); void stage.offsetWidth; stage.classList.add('hit');
  if (S.hull <= 0) {
    G.breach = { t: 0, d: Math.round(depthOf(S.y)) };
    G.act = null;
    emit(S.x + .5, S.y + .5, 70, () => ['#fff1b8', '#ffb02e', RIG, '#2b2622'][Math.random() * 4 | 0], 8, 1, 6);
    booms.push({ x: S.x + .5, y: S.y + .5, r: 2, age: 0 });
    sfx.boom();
    toast(`${why}. Hull breached at ${G.breach.d} m.`);
  } else toast(`${why}: hull −${n}.`);
}

function land() {
  const n = G.fallN; G.fallN = 0;
  if (n > 1) {
    emit(S.x + .5, S.y + .95, Math.min(14, n * 2), () => tileColor(ROCK, S.x, S.y + 1), 2.5, .5);
    G.shake = Math.max(G.shake, Math.min(.5, n * .05));
  }
  if (n > 4 && S.y >= SURF) hurt((n - 4) * 6, `Fell ${n * MPT} m`);
}

function collect(k, tx, ty) {
  const o = ORES[k];
  S.mined++;
  if (!S.found[k]) { S.found[k] = true; toast(`New find: ${o.name}. Mohs ${o.mohs}, assays at $${o.price} raw.`); }
  if (cargoN() >= holdCap()) { hint(`Hold full. ${o.name} left behind.`); return; }
  S.cargo[k]++;
  floats.push({ x: tx + .5, y: ty + .2, text: `+ ${o.name}`, col: k === COAL ? '#b9b2aa' : o.col, age: 0 });
  sfx.ore(k);
}

function finish() {
  const a = G.act; G.act = null;
  if (a.type === 'bump') return;
  if (a.type === 'drill') {
    const t = tileAt(a.tx, a.ty);
    if (t === AIR) return;
    setTile(a.tx, a.ty, AIR);
    emit(a.tx + .5, a.ty + .5, 10, () => tileColor(t, a.tx, a.ty), 4, .6);
    if (t >= ORE0) collect(t - ORE0, a.tx, a.ty);
    else if (t === RECORDER) recoverLog(a.tx, a.ty);
    startMove(a.tx, a.ty, .1, 'enter');
    return;
  }
  S.x = a.toX; S.y = a.toY;
  const d = depthOf(S.y);
  if (d > S.maxDepth) S.maxDepth = d;
  if (G.fallN > 0 && solidAt(S.x, S.y + 1)) land();
  checkShelter();
  checkDock();
}

/* ---------- smelter ---------- */
function stepSmelter(dt) {
  const sm = S.smelt;
  if (!sm.job) {
    if (!sm.on) return;
    for (let b = 0; b < BARS.length; b++) {
      if (!canMake(b)) continue;
      for (const [k, n] of BARS[b].needs) S.cargo[k] -= n;
      sm.job = { b, t: 0 };
      break;
    }
    return;
  }
  sm.job.t += dt;
  G.smoke -= dt;
  if (G.smoke <= 0) {
    G.smoke = .22;
    emit(G.fx + (G.body === 'L' ? .78 : .22), G.fy + .02, 1, () => Math.random() < .3 ? '#ffb347' : '#8a8178', .5, 1.1, -1.4);
  }
  if (sm.job.t < smeltTime()) return;
  const b = sm.job.b, bar = BARS[b];
  sm.job = null;
  S.cast++;
  floats.push({ x: G.fx + .5, y: G.fy - .1, text: `+ ${bar.name}`, col: bar.col, age: 0 });
  sfx.cast();
  if (G.docked && S.repair[b] < REPAIR[b]) {
    S.repair[b]++;
    saleLine = `Cast 1 ${bar.name.toLowerCase()} and fitted it to the launch engine.` + (repairDone() ? ' Repairs complete.' : '');
  } else if (G.docked) {
    S.cash += bar.price; S.earned += bar.price;
    saleLine = `Cast and sold 1 ${bar.name.toLowerCase()} for $${bar.price}.`;
  } else S.bars[b]++;
}
function toggleSmelter() {
  S.smelt.on = !S.smelt.on;
  toast(S.smelt.on ? 'Smelter on.' : (S.smelt.job ? 'Smelter off after this bar.' : 'Smelter off. Ore stays raw.'));
}

/* ---------- the escape pod ---------- */
function checkDock() {
  const now = atDepot();
  if (now && !G.docked) { G.docked = true; arrive(); openDepot(); }
  else if (!now && G.docked) { G.docked = false; closeDepot(); }
}
// parking at the pod: drop off the survivor, fit bars to the launch engine, sell the rest and patch the hull
function arrive() {
  const notes = [];
  if (S.rescued && !S.safe) { S.safe = true; notes.push(`${SURVIVOR} is safe inside the pod.`); sfx.rescue(); }
  const fitted = [];
  BARS.forEach((b, i) => { const n = Math.min(S.bars[i], Math.max(0, REPAIR[i] - S.repair[i])); if (n) { S.repair[i] += n; S.bars[i] -= n; fitted.push(plural(n, b.name.toLowerCase())); } });
  if (fitted.length) { notes.push(`Fitted ${andList(fitted)} to the launch engine.` + (repairDone() ? ' Repairs complete.' : '')); sfx.cast(); }
  let total = 0;
  const sold = [];
  BARS.forEach((b, i) => { const n = S.bars[i]; if (n) { total += n * b.price; sold.push(plural(n, b.name.toLowerCase())); } S.bars[i] = 0; });
  if (total) { S.cash += total; S.earned += total; notes.push(`Sold ${andList(sold)} for $${fmt(total)}.`); sfx.sell(); }
  if (S.hull < hullMax()) { S.hull = hullMax(); notes.push('Hull repaired.'); }
  saleLine = notes.join(' ') || 'No bars aboard yet.';
  save();
}
function sellRaw() {
  let total = 0;
  const sold = [];
  ORES.forEach((o, k) => { const n = S.cargo[k]; if (n) { total += n * o.price; sold.push(`${n} ${o.name.toLowerCase()}`); } S.cargo[k] = 0; });
  if (!total) return;
  S.cash += total; S.earned += total;
  saleLine = `Sold ${andList(sold)} as raw ore for $${fmt(total)}.`;
  sfx.sell(); renderDepot(); save();
}
function buy(id) {
  const u = UP[id], cur = S.up[id];
  if (cur >= u.lv.length - 1) return;
  const next = u.lv[cur + 1];
  if (S.cash < next.cost) { hint(`${u.name} upgrade costs $${fmt(next.cost)}. You have $${fmt(S.cash)}.`); sfx.bump(); return; }
  S.cash -= next.cost; S.up[id]++;
  if (id === 'hull') S.hull = hullMax();
  sfx.buy();
  const spec = u.fmt(next);
  toast(`Fitted: ${u.name.toLowerCase()}, ${spec[0].toLowerCase() + spec.slice(1)}.`);
  renderDepot(); syncLog(); save();
}

function shopBuy(kind, i, want) {
  const ore = kind === 'ore', it = ore ? ORES[i] : BARS[i], price = it.price * MARKUP;
  const room = ore ? holdCap() - cargoN() : REPAIR[i] - S.repair[i], n = Math.min(want, room, Math.floor(S.cash / price));
  if (n < 1) {
    hint(room >= 1 ? `${it.name} costs $${fmt(price)}. You have $${fmt(S.cash)}.`
      : ore ? 'Hold full. Sell something or fit a bigger cargo hold.' : `The launch engine already has all the ${it.name.toLowerCase()}s it needs.`);
    sfx.bump(); return;
  }
  S.cash -= n * price;
  const what = ore ? `${n} ${it.name.toLowerCase()}` : plural(n, it.name.toLowerCase()), short = n < want ? (n === room ? (ore ? ' The hold is full.' : '') : ' That is all you can afford.') : '';
  if (ore) { S.cargo[i] += n; S.found[i] = true; toast(`Bought ${what} for $${fmt(n * price)}.` + short); }
  else { S.repair[i] += n; toast(`Bought ${what} for $${fmt(n * price)} and fitted ${n === 1 ? 'it' : 'them'} to the launch engine.` + (repairDone() ? ' Repairs complete.' : short)); }
  sfx.buy(); renderDepot(); save();
}
const launchReady = () => S.safe && repairDone() && !S.launched;
function launch() {
  if (!launchReady()) return;
  S.launched = true; save();
  closeDepot(); startCine('outro');
}

// where the tow drone sets the ship down: the starting spot, unless a shaft has been drilled there (the ship would
// drop straight back down it), then the glassy rim of the landing pad, which can never be drilled away
const safeX = () => solidAt(START_X, SURF) ? START_X : DEPOT_X + DEPOT_W;
function recover() {
  const d = G.breach.d;
  S.cargo = ORES.map(() => 0); S.bars = BARS.map(() => 0); S.smelt.job = null;
  S.hull = hullMax(); S.recoveries++;
  S.x = safeX(); S.y = SURF - 1;
  resetDynamic();
  toast(`Hull breached at ${d} m. The pod’s tow drone hauled the ship back up. Cargo lost.` + (S.rescued && !S.safe ? ` ${SURVIVOR} is shaken but fine.` : ''));
  save();
}

/* ---------- particles ---------- */
function emit(x, y, n, colFn, spd, life, grav = 16) {
  if (reduced) n = Math.ceil(n / 3);
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2, v = spd * (.3 + Math.random());
    parts.push({ x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v - spd * .4, life: life * (.5 + Math.random() * .7), age: 0, col: colFn(i), g: grav, sz: Math.random() < .3 ? 2 : 1 });
  }
  if (parts.length > 700) parts.splice(0, parts.length - 700);
}
function stepFx(dt) {
  for (const p of parts) { p.age += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.age < p.life);
  for (const f of floats) { f.age += dt; f.y -= dt * .9; }
  floats = floats.filter(f => f.age < 1.2);
  for (const b of booms) b.age += dt;
  booms = booms.filter(b => b.age < BOOM_T);
  G.shake = Math.max(0, G.shake - dt * 2.4);
}

/* ---------- update ---------- */
function update(dt) {
  if (G.overlay) return;
  S.time += dt;
  if (G.breach) { G.breach.t += dt; if (G.breach.t > 1.5) recover(); return; }
  let budget = dt;
  for (let i = 0; i < 6 && !G.overlay; i++) {
    if (!G.act) { decide(); if (!G.act) break; }
    const a = G.act, need = a.dur - a.t;
    if (budget < need) { a.t += budget; break; }
    budget -= need; a.t = a.dur; finish();

const BOOM_T = .5;

    const g = ctx.createRadialGradient(x, y, 0, x, y, r);

function drawDark(cx, cy) {

const logNames = [];
function layoutLog() {
  const box = $('#names'), H = box.clientHeight, n = logNames.length;
  if (!H || !n) return;
  const gap = Math.min(16, H / n), pos = logNames.map(([, m]) => m / LOG_M * H);
  pos[0] = Math.max(pos[0], gap / 2);

}

  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase(), dir = KEYS[k];
  unlockAudio();
  if (!COARSE) setInput('key');
  if (G.overlay === 'cine') { if (k === 'escape' || k === 'enter' || k === ' ') { e.preventDefault(); endCine(); } return; }
  if (dir) keyDown[dir] = true;
  if (G.overlay === 'intro') {
    const onBtn = document.activeElement && document.activeElement.tagName === 'BUTTON';
    if (k === 'm') { toggleSound(); return; }
    // the start can wait a moment for the account save: only keep driving if the key is still held by then
    if (dir || ((k === 'enter' || k === ' ') && !onBtn) || (k === 'escape' && G.started)) { e.preventDefault(); afterCloud(() => { startGame(); if (dir && !G.overlay && keyDown[dir]) press(dir); }); }
    return;
  }
  if (G.overlay === 'log') { if (k === 'escape' || k === 'enter' || k === ' ') { e.preventDefault(); hideLog(); } return; }
  if (G.overlay === 'win') { if (k === 'escape' || ((k === 'enter' || k === ' ') && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('#win .actions')))) { e.preventDefault(); hideWin(); } return; }
  if (dir) { e.preventDefault(); press(dir); return; }
  if (k === 'escape' && !depotEl.hidden) { closeDepot(); return; }
  if ((k === 'e' || k === 'enter') && G.docked && depotEl.hidden) { e.preventDefault(); openDepot(); return; }
  const digit = /^(?:Digit|Numpad)([1-7])$/.exec(e.code);
  if (!depotEl.hidden && digit) {
    if (G.depotTab === 'shop') { const it = SHOP[digit[1] - 1]; shopBuy(it.kind, it.i, e.shiftKey ? 10 : 1); }
    else if (G.depotTab === 'ups' && !e.shiftKey) buy(UPG[digit[1] - 1].id);
    return;
  }
  if (k === 'f') toggleSmelter();
  else if (k === 'm') toggleSound();
  else if (k === 'h' || k === '?') introMode('resume');
});
addEventListener('keyup', e => { const d = KEYS[e.key.toLowerCase()]; if (d) { keyDown[d] = false; letGo(d); } });
addEventListener('blur', () => dropInput());

/* ---------- the touch pad: each finger holds one button, several fingers at once (→ and ▲ together), and a finger can
   slide from one button to the next. A finger that slides off, or is cut off by the system, lets go. ---------- */
const padEl = $('#pad'), padBtns = [...padEl.querySelectorAll('button')], fingers = new Map(); // pointer id -> direction under it (or null)
const fingerHolds = d => { for (const v of fingers.values()) if (v === d) return true; return false; };
// a direction stops when no key, finger or gamepad is holding it any more
function letGo(d) { if (!keyDown[d] && !fingerHolds(d) && !gpDrive[d]) release(d); }

function finger(id, d, lifted) {
  const was = fingers.get(id) || null, now = lifted ? null : d;
  if (lifted) fingers.delete(id); else fingers.set(id, d);
  if (was === now) return;
  if (was) letGo(was);
  if (now && !G.overlay) press(now);
  padLight();
}

  const el = document.elementFromPoint(e.clientX, e.clientY), b = el && el.closest ? el.closest('#pad button') : null;
  if (b) return b.dataset.dir;
  // a little slack round the button the finger is on, so a wobbling thumb doesn't let go
  const cur = fingers.get(e.pointerId), cb = cur && padBtns.find(x => x.dataset.dir === cur);
  if (cb) { const r = cb.getBoundingClientRect(); if (e.clientX > r.left - 16 && e.clientX < r.right + 16 && e.clientY > r.top - 16 && e.clientY < r.bottom + 16) return cur; }
  return null;
}
padEl.addEventListener('pointerdown', e => {
  const b = e.target.closest('button');
  if (!b) return;
  e.preventDefault(); unlockAudio();
  try { b.setPointerCapture(e.pointerId); } catch (_) {}
  finger(e.pointerId, b.dataset.dir, false);
});
padEl.addEventListener('pointermove', e => { if (fingers.has(e.pointerId)) finger(e.pointerId, fingerAt(e), false); });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) padEl.addEventListener(ev, e => { if (fingers.has(e.pointerId)) finger(e.pointerId, null, true); });
// let go of everything: the window lost focus, or the app went to the background
function dropInput() {
  held.length = 0;
  for (const d in keyDown) keyDown[d] = false;
  for (const d in gpDrive) gpDrive[d] = false;
  fingers.clear(); padLight();
}
// the last thing touched picks the wording; a long press never brings up a menu over the game
app.addEventListener('pointerdown', e => { if (e.pointerType === 'touch' || e.pointerType === 'pen') setInput('touch'); else if (e.pointerType === 'mouse' && !COARSE) setInput('key'); }, true);
app.addEventListener('contextmenu', e => { if (inputMode === 'touch') e.preventDefault(); });

/* ---------- gamepads (Steam Deck and controllers), read every frame: the D-pad or left stick drives, A opens the pod and
   chooses, B closes and goes back, X switches the smelter, LB and RB switch the pod's tabs, Menu opens the help.
   In the pod and on the cards the D-pad moves between buttons. ---------- */

  const items = [...box.querySelectorAll('button')].filter(b => !b.disabled && b.getClientRects().length);
  if (!items.length) return;
  const cur = document.activeElement;
  let next = null;
  if (!d || !items.includes(cur)) next = items.find(b => b.getAttribute('aria-selected') === 'true') || items.find(b => b.classList.contains('primary')) || items[0];
  else {
    const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let best = Infinity;

      const q = b.getBoundingClientRect(), dx = q.left + q.width / 2 - cx, dy = q.top + q.height / 2 - cy;
      const along = d === 'L' ? -dx : d === 'R' ? dx : d === 'U' ? -dy : dy, across = d === 'L' || d === 'R' ? Math.abs(dy) : Math.abs(dx);
      if (along < 4) continue;

}
function pollPads(dt) {
  if (gpOff || !navigator.getGamepads) return;

  try { list = navigator.getGamepads(); } catch (e) { gpOff = true; return; }
  const btn = [], dir = {};
  let any = false;
  for (const gp of list || []) {
    if (!gp || gp.connected === false) continue;
    any = true;
    gp.buttons.forEach((b, i) => { if (b && (b.pressed || b.value > .5)) btn[i] = true; });
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    if (ax < -.5) dir.L = true; if (ax > .5) dir.R = true; if (ay < -.5) dir.U = true; if (ay > .5) dir.D = true;
  }
  if (!any && !gpSeen) return;
  if (btn[12]) dir.U = true; if (btn[13]) dir.D = true; if (btn[14]) dir.L = true; if (btn[15]) dir.R = true;
  const was = gpBtn, hit = i => !!btn[i] && !was[i], fresh = DIRS.filter(d => dir[d] && !gpDir[d]);
  gpBtn = btn; gpDir = dir;
  if (fresh.length || [0, 1, 2, 3, 4, 5, 8, 9].some(hit)) { gpSeen = true; setInput('pad'); }
  const where = G.overlay === 'cine' ? 'cine' : G.overlay ? 'menu' : !depotEl.hidden ? 'pod' : 'play';
  // driving: a direction pressed while driving holds for as long as the D-pad or stick holds it
  for (const d of DIRS) {
    if (dir[d] && fresh.includes(d) && where === 'play') { gpDrive[d] = true; press(d); }
    else if (!dir[d] && gpDrive[d]) { gpDrive[d] = false; letGo(d); }
  }
  // on a card or in the pod the D-pad moves between buttons, repeating while held
  const box = where === 'menu' ? (G.overlay === 'intro' ? intro : G.overlay === 'log' ? logBox : winEl) : where === 'pod' ? depotEl : null;
  if (gpNav && !dir[gpNav]) gpNav = null;
  if (box) {
    const d = fresh[0];
    if (d) { gpNav = d; gpRep = .42; navFocus(box, d); }
    else if (gpNav && (gpRep -= dt) <= 0) { gpRep = .13; navFocus(box, gpNav); }
  }
  const A = hit(0), B = hit(1), X = hit(2), menu = hit(9) || hit(8);
  if (where === 'cine') { if (A || B || menu) endCine(); return; }
  if (where === 'menu') {
    if (A || menu) {
      const f = document.activeElement;
      if (f && f.tagName === 'BUTTON' && box.contains(f) && !f.disabled && f.getClientRects().length) f.click();
      else { const p = [...box.querySelectorAll('.primary')].find(b => b.getClientRects().length); if (p) p.click(); }
    } else if (B) {
      if (G.overlay === 'log') hideLog();
      else if (G.overlay === 'win') hideWin();
      else if (G.overlay === 'intro' && G.started) afterCloud(startGame);
    }
    return;
  }
  if (where === 'pod') {
    if (A) { const f = document.activeElement; if (f && f.tagName === 'BUTTON' && depotEl.contains(f) && !f.disabled) f.click(); else navFocus(depotEl, null); }
    else if (B) closeDepot();
    else if (hit(4) || hit(5)) {
      const tabs = ['ups', 'shop', 'logs'];
      G.depotTab = tabs[(tabs.indexOf(G.depotTab) + (hit(5) ? 1 : 2)) % 3]; renderDepot();
      const t = depotEl.querySelector(`[data-tab="${G.depotTab}"]`); if (t) t.focus({ preventScroll: true });
    }
  } else if (A && G.docked && depotEl.hidden) openDepot();
  if (X) toggleSmelter();
  if (menu) introMode('resume');
}

/* ---------- rough planets ----------

   noise, mountain ridges, lava plains, a few hundred craters with rims, floors and central peaks), coloured by height,
   latitude and rock type, then shaded pixel by pixel with bump-mapped sunlight. Mountains and crater walls catch the

   slices while the game is idle, and drawn from then on as an image. */

      if (tick && dm > .15 && Math.random() < (fighting ? .7 : .3)) emitSmoke((x + cx) / T, (y - fr * .6 - gy) / T + SURF, 1, fighting ? '52,46,50' : '130,126,122', .3, .55, 4.5, .45 + fr / T * .6);

  S.phase = 'fight';
  const used = [];
  WAVES[S.wave].forEach((kind, i) => { const x = pickDropX(kind, used); used.push(x); S.drops.push({ kind, x, t: 2.2 + i * 1.6 }); });

}

/* ---------- rebuilding the city ---------- */

/* ---------- smelter ---------- */

/* ---------- particles ---------- */

}

/* ---------- update ---------- */

  if (G.winT > 0) { G.winT -= dt; if (G.winT <= 0) { save(); startCine('outro'); return; } }
  if (G.breach) { G.breach.t += dt; if (G.breach.t > 1.5) recover(); }
  else {

    if (G.act && (G.act.type === 'drill' || G.act.type === 'bump')) { const d = curDir(); if (d) { const [dx, dy] = DIRS[d]; if (botAt(S.x + dx, S.y + dy)) G.act = null; } }

   noise, mountain ridges, lava plains, a few hundred craters with rims, floors and central peaks), coloured by height,
   latitude and rock type, then shaded pixel by pixel with bump-mapped sunlight. Mountains and crater walls catch the
